    // Fix 02.07.2026 (Kapitel 32): window.location.reload(true) ersetzt durch dasselbe
    // sichere hardReload()-Pattern wie index.html (seit v3.33, Kapitel 7.3). admin.html

    // unproblematisch — seit sw-admin.js (v3.59, Push-Empfang) aktiv ist, kann reload(true)
    // aber wie in Kapitel 7.3 beschrieben bei aktivem SW auf Safari lautlos hängen bleiben.
    // Das erklärt einen Teil des gemeldeten "Admin-App lädt nach Push-Tap unzuverlässig".
    function hardReload() {
      const bust = 'rsw_reload=' + Date.now();
      const url = window.location.href.split('#')[0];
      const sep = url.includes('?') ? '&' : '?';
      let hash = window.location.hash || '';
      // Fix (02.07.2026, Kapitel 33, identisch zu index.html): Trägt die URL keinen Hash
      // (Normalfall bei bereits offenen Clients), ging bei jedem Reload-Pfad (Watchdog,
      // Hintergrund>60s) ein zuvor erfolgreich angewendetes Push-Ziel verloren, sobald der
      // pending-deeplink-Cache-Eintrag schon konsumiert war. routeHash() hinterlegt deshalb
      // einen kurzlebigen (30s) Recovery-Eintrag in localStorage, einmalig gelesen+gelöscht.
      if(!hash) {
        try {
          const raw = localStorage.getItem('rsw_admin_crash_recover_hash');
          if(raw) {
            localStorage.removeItem('rsw_admin_crash_recover_hash');
            const r = JSON.parse(raw);
            if(r && r.hash && (Date.now() - (r.ts || 0) < 30000)) hash = '#' + r.hash;
          }
        } catch(e) {}
      }
      window.location.href = url + sep + bust + hash;
    }
    document.addEventListener('visibilitychange', function() {
      if(document.visibilityState === 'visible') {
        const now = Date.now();
        const last = parseInt(sessionStorage.getItem('lastVisible') || now);
        if(now - last > 1 * 60 * 1000) {
          if('serviceWorker' in navigator) {
            const timeout = new Promise(res => setTimeout(res, 800));
            Promise.race([navigator.serviceWorker.ready, timeout]).then(hardReload).catch(hardReload);
          } else {
            hardReload();
          }
        } else if(window.__swApplyPendingDeepLink) {
          // Kein Reload nötig (App war <60s im Hintergrund) — trotzdem auf einen
          // während des Fokuswechsels geschriebenen Deep-Link prüfen, da sw-admin.js
          // bestehende Clients nicht mehr selbst navigiert (Race-Fix, siehe sw-admin.js).
          window.__swApplyPendingDeepLink();
        }
        sessionStorage.setItem('lastVisible', now);
      } else {
        sessionStorage.setItem('lastVisible', Date.now());
      }
    });

    font-family: 'Exo 2';
    font-size: 16px;
    color: var(--text);
    resize: none;
    max-height: 156px;
    overflow-y: hidden;
    line-height: 1.6;
    transition: border .2s, height .1s ease;
  }
  .input-box:focus { outline: none; border-color: var(--teal); background: #fff; }
  .send-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--sage); color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s; flex-shrink: 0;
  }
  .send-btn:hover { background: var(--sage-dark); transform: scale(1.05); }
  .send-btn:disabled { background: var(--border); color: var(--muted); transform: none; cursor: default; }
  .attach-btn {
    width: 33px; height: 33px; border-radius: 50%; border: none;
    background: transparent; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s; flex-shrink: 0;
  }
  .attach-btn:hover { color: var(--teal-dark); }

  /* Quick replies */
  .quick-replies { display:flex; gap:6px; flex-wrap:wrap; padding:0 24px 10px; flex-shrink:0; }
  .qr-btn {
    padding:5px 12px; border-radius:18px; border:1.5px solid var(--border);
    background:var(--surface); font-size:.74rem; cursor:pointer;
    color:var(--muted); font-family:'Exo 2'; transition:all .15s;
  }
  .qr-btn:hover { border-color:var(--teal); color:var(--text); background:var(--teal-pale); }

  /* Info bar */
  .info-bar { background:var(--lime-pale); border-bottom:1px solid var(--border); padding:10px 20px; display:flex; gap:20px; font-size:.79rem; color:var(--muted); flex-shrink:0; }
  .info-bar strong { color:var(--text); }

  /* Empty chat */
  .empty-chat { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--muted); }
  .empty-chat h3 { font-family:'Manuale',serif; font-size:1.25rem; color:var(--text); opacity:.35; }
  .empty-chat p { font-size:.84rem; opacity:.5; }

  /* Photo panel */
  .photo-panel { background:var(--surface); border-top:1px solid var(--border); padding:12px 18px; flex-shrink:0; }
  .photo-panel-title { font-size:.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:9px; }
  .photo-grid { display:flex; gap:7px; flex-wrap:wrap; }
  .photo-thumb { width:68px; height:68px; border-radius:9px; object-fit:cover; cursor:pointer; border:2px solid transparent; transition:border-color .15s; }
  .photo-thumb:hover { border-color:var(--teal); }
  .photo-add {
    width:68px; height:68px; border-radius:9px; border:2px dashed var(--border2);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; cursor:pointer; color:var(--muted); transition:all .15s; font-size:.65rem; font-weight:700;
  }
  .photo-add:hover { border-color:var(--teal); color:var(--teal-dark); background:var(--teal-pale); }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:99999; display:flex; align-items:center; justify-content:center; }
  .lightbox img { max-width:90vw; max-height:85vh; border-radius:12px; object-fit:contain; }
  /* lightbox-close now inline */

  /* ══════════════════════════════
     CONTENT PAGES (right side)
  ══════════════════════════════ */
  
  .page-heading { font-family:'Manuale',serif; font-size:1.7rem; color:var(--text); margin-bottom:4px; }
  .page-sub { font-size:.87rem; color:var(--muted); margin-bottom:24px; }

  .card { background:var(--surface); border:1px solid var(--border2); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; margin-bottom:16px; }
  .card-title {
    font-family:'Manuale',serif; font-size:1.03rem; color:var(--text);
    margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:9px;
  }

  /* Buttons */
  .btn { padding:8px 18px; border:none; border-radius:10px; cursor:pointer; font-family:'Exo 2'; font-weight:700; font-size:.83rem; transition:all .18s; display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn-primary { background:var(--teal); color:#fff; }
  .btn-primary:hover { background:var(--teal-dark); }
  .btn-sage { background:var(--teal); color:#fff; }
  .btn-sage:hover { background:var(--teal-dark); }
  .btn-lime { background:var(--teal); color:#fff; }
  .btn-lime:hover { background:var(--teal-dark); }
  .btn-ghost { background:transparent; border:1.5px solid var(--border2); color:var(--muted); }
  .btn-ghost:hover { border-color:var(--teal); color:var(--text); }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-sm { padding:4px 10px; font-size:.75rem; }

  /* Forms */
  .label { font-size:.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; display:block; }
  .input,.textarea,.select {
    width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:10px;
    font-family:'Exo 2'; font-size:16px; background:var(--surface); color:var(--text); transition:border .2s;
    line-height:1.5;
  }
  .input:focus,.textarea:focus,.select:focus { outline:none; border-color:var(--teal); }
  .textarea { resize:vertical; min-height:92px; line-height:1.55; overflow-wrap:break-word; word-break:break-word; }
  .form-row { margin-bottom:12px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .flex-between { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }

  /* Reminders */
  .reminder-item { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .reminder-item-top { display:flex; justify-content:space-between; align-items:center; }
  .reminder-photos { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .rem-photo { width:60px; height:60px; border-radius:8px; object-fit:cover; cursor:pointer; border:1.5px solid transparent; transition:border-color .15s; }
  .rem-photo:hover { border-color:var(--teal); }
  .rem-photo-add { width:60px; height:60px; border-radius:8px; border:2px dashed var(--border2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; color:var(--muted); font-size:.6rem; font-weight:700; font-family:'Exo 2',sans-serif; transition:all .15s; }
  .rem-photo-add:hover { border-color:var(--teal); color:var(--teal-dark); background:var(--teal-pale); }
  .reminder-left { display:flex; align-items:center; gap:12px; }
  .reminder-icon-wrap { width:36px; height:36px; border-radius:9px; background:var(--sage-pale); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--teal-dark); flex-shrink:0; }
  .reminder-text { font-weight:700; font-size:.86rem; }
  .reminder-time { font-size:.73rem; color:var(--muted); margin-top:1px; }
  .toggle { width:40px; height:22px; background:var(--border2); border-radius:99px; cursor:pointer; position:relative; border:none; transition:background .2s; }
  .toggle.on { background:var(--teal); }
  .toggle::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .toggle.on::after { left:21px; }

  /* Icon picker */
  .icon-picker { display:flex; gap:6px; flex-wrap:wrap; }
  .icon-pick-btn { width:38px; height:38px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface2); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--muted); transition:all .15s; }
  .icon-pick-btn:hover { border-color:var(--teal); color:var(--teal-dark); }
  .icon-pick-btn.selected { border-color:var(--teal); background:var(--teal); color:#fff; }

  /* Recurrence */
  .rec-tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .rec-tab { padding:7px 13px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); color:var(--muted); font-family:'Exo 2'; font-weight:700; font-size:.81rem; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .15s; }
  .rec-tab:hover { border-color:var(--teal); color:var(--text); }
  .rec-tab.active { border-color:var(--teal); background:var(--teal); color:#fff; }
  .rec-preview { background:var(--lime-pale); border-left:3px solid var(--lime-dark); border-radius:0 8px 8px 0; padding:11px 13px; font-size:.88rem; color:var(--muted); margin-top:10px; line-height:1.6; }
  .rec-preview strong { color:var(--text); }
  .day-picker { display:flex; gap:5px; }
  .day-btn { width:38px; height:38px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface2); color:var(--muted); font-family:'Exo 2'; font-weight:700; font-size:.72rem; cursor:pointer; transition:all .15s; }
  .day-btn.sel { border-color:var(--teal); background:var(--teal); color:#fff; }
  .mday-grid { display:flex; gap:4px; flex-wrap:wrap; max-width:360px; }
  .mday-btn { width:33px; height:33px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); color:var(--muted); font-family:'Exo 2'; font-weight:700; font-size:.73rem; cursor:pointer; transition:all .15s; }
  .mday-btn.sel { border-color:var(--teal); background:var(--teal); color:#fff; }

  /* Modal */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:9999; display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--surface); border-radius:var(--radius); padding:20px; padding-bottom:0; box-sizing:border-box; width:calc(100vw - 32px); max-width:460px; min-width:0; max-height:calc(100dvh - 80px); overflow-y:auto; overflow-x:hidden; box-shadow:0 20px 60px rgba(0,0,0,.2); display:flex; flex-direction:column; }
  .modal-title { font-family:'Manuale',serif; font-size:1.15rem; color:var(--text); margin-bottom:16px; }
  .modal-actions { display:flex; gap:8px; justify-content:flex-end; flex-shrink:0; background:var(--surface); padding:14px 0 calc(env(safe-area-inset-bottom,0px) + 16px); border-top:2px solid var(--border); margin-top:16px; }
  .modal-actions .btn { width:130px !important; min-width:130px !important; max-width:130px !important; flex:0 0 130px !important; justify-content:center; }

  /* Dashboard stats */
  .stat-grid { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .stat-card { background:var(--surface); border-radius:var(--radius); padding:16px 18px; border:1px solid var(--border2); box-shadow:var(--shadow); }
  .stat-label { font-size:.69rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .stat-value { font-family:'Manuale',serif; font-size:1.75rem; color:var(--text); margin-top:2px; }
  .stat-hint { font-size:.74rem; color:var(--teal-dark); margin-top:2px; }

  .quote-block { background:var(--sage); border-radius:var(--radius); padding:20px 24px; margin-bottom:18px; position:relative; overflow:hidden; text-align:center; }
  .quote-block::before { content:''; }
  .quote-text { font-family:'Manuale',serif; font-size:1.15rem; font-style:italic; line-height:1.65; color:var(--text); text-align:center; }
  .quote-author { font-size:.74rem; color:var(--text); margin-top:8px; font-weight:700; text-align:center; }

  /* Section label */
  .section-label { font-size:.69rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; margin-bottom:8px; margin-top:2px; display:flex; align-items:center; gap:7px; }
  .section-label-line { flex:1; height:1px; background:var(--border); }

  /* Info tip */
  .info-tip { border-radius:var(--radius); padding:13px 16px; margin-bottom:16px; font-size:.83rem; line-height:1.65; display:flex; align-items:flex-start; gap:11px; }
  .info-tip-lime { background:var(--lime-pale); border-left:3px solid var(--lime-dark); color:var(--text); }
  .info-tip-sage { background:var(--sage-pale); border-left:3px solid var(--sage-dark); color:var(--text); }

  /* Library */
  .lib-filter { display:flex; gap:7px; margin-bottom:18px; flex-wrap:wrap; }
  .lib-filter-btn { padding:6px 14px; border-radius:99px; border:1.5px solid var(--border); background:var(--surface); color:var(--muted); font-family:'Exo 2'; font-weight:700; font-size:.79rem; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .15s; }
  .lib-filter-btn.sel               { border-color:var(--neutral); background:var(--neutral); color:var(--text); }
  .lib-filter-btn[data-type="audio"].sel { border-color:var(--teal); background:var(--teal); color:white; }
  .lib-filter-btn[data-type="video"].sel { border-color:var(--teal); background:var(--teal); color:#fff; }
  .lib-filter-btn[data-type="dokus"].sel { border-color:var(--teal); background:var(--teal); color:#fff; }
  .lib-filter-btn[data-type="foto"].sel  { border-color:var(--sky); background:var(--sky); color:#fff; }
  /* All filter buttons use same forest color when selected */
  .lib-filter-btn:hover { border-color:var(--teal); }
  .lib-grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-bottom:20px; }
  .lib-card { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; cursor:pointer; transition:transform .15s,box-shadow .15s; }
  .lib-card:hover { transform:translateY(-2px); box-shadow:var(--shadow2); }
  .lib-thumb { width:100%; height:130px; display:flex; align-items:center; justify-content:center; color:var(--muted); position:relative; }
  .lib-thumb img { width:100%; height:100%; object-fit:cover; }
  .lib-type-badge { position:absolute; top:9px; left:9px; padding:3px 9px; border-radius:99px; font-size:.67rem; font-weight:700; display:flex; align-items:center; gap:4px; }
  .badge-audio { background:var(--teal); color:white; }
  .badge-video { background:var(--sage); color:#fff; }
  .badge-dokus { background:var(--teal); color:#fff; }
  .badge-foto  { background:var(--sky); color:#fff; }
  .lib-play-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.2); }
  .lib-play-btn { width:40px; height:40px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .lib-card-body { padding:12px; border-left-width:3px; border-left-style:solid; }
  .lib-card-title { font-weight:700; font-size:.88rem; margin-bottom:3px; color:var(--text); }
  .lib-card-desc { font-size:.88rem; color:var(--muted); line-height:1.5; }
  .lib-card-meta { display:flex; justify-content:space-between; align-items:center; margin-top:9px; font-size:.71rem; color:var(--muted); }

  /* Upload zone */
  .upload-zone { border:2px dashed var(--border2); border-radius:var(--radius); padding:28px; text-align:center; cursor:pointer; transition:all .2s; color:var(--muted); }
  .upload-zone:hover,.upload-zone.drag { border-color:var(--teal); background:var(--teal-pale); color:var(--teal-dark); }
  .upload-zone p { font-size:.86rem; margin-top:8px; }
  .upload-zone span { font-size:.74rem; color:var(--muted); display:block; margin-top:3px; }


  /* ── DOODLE / TERMINFINDUNG ── */
  .doodle-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:12px;border-left:4px solid var(--teal);transition:transform .15s}
  .doodle-card:hover{transform:translateY(-1px)}
  .doodle-card.closed{border-left-color:var(--border2);opacity:.7}
  .doodle-title{font-family:'Manuale',serif;font-weight:700;font-size:1rem;color:var(--text);margin-bottom:6px}
  .doodle-meta{font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
  .doodle-recipients{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
  .recipient-chip{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--sage-pale);color:var(--text)}
  .doodle-actions{display:flex;gap:7px;flex-wrap:wrap}
  .timeslot-row{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:10px;padding:9px 13px;margin-bottom:6px;border:1.5px solid transparent}
  .timeslot-row.best-slot{background:var(--teal-pale);border-color:var(--teal)}
  .timeslot-datetime{flex:1;font-size:.85rem;font-weight:600;color:var(--text)}
  .votes-wrap{display:flex;gap:4px;flex-wrap:wrap}
  .vote-chip{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.63rem;font-weight:700}
  .vote-yes-chip{background:var(--teal);color:white}
  .vote-no-chip{background:var(--danger-pale);color:var(--danger)}
  .vote-unknown-chip{background:var(--surface-neutral);color:var(--text-neutral)}
  .vote-count-label{font-size:.76rem;font-weight:700;color:var(--muted);min-width:44px}
  .vote-count-label.best{color:var(--teal-dark)}
  .best-badge{font-size:.62rem;font-weight:700;background:var(--teal);color:white;padding:1px 7px;border-radius:99px;margin-left:6px}
  .status-pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px}
  .status-open{background:var(--accent-pale);color:var(--teal-dark)}
  .status-closed{background:var(--surface-neutral);color:var(--text-neutral)}
  .slot-list-build{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  .slot-item-build{display:flex;align-items:center;justify-content:space-between;background:var(--sage-pale);border-radius:8px;padding:7px 12px;font-size:.85rem;font-weight:600;color:var(--text)}
  .coachee-check-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;cursor:pointer;transition:background .15s;border:1.5px solid transparent;margin-bottom:5px}
  .coachee-check-row:hover{background:var(--sage-pale)}
  .coachee-check-row.sel{background:var(--teal-pale);border-color:var(--teal)}
  .coachee-av-sm{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--text);flex-shrink:0}
  /* vote rows coachee */
  .vote-row-c{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:10px;margin-bottom:6px;background:var(--surface2);border:1.5px solid transparent;transition:all .15s}
  .vote-row-c.sel-yes{background:var(--teal-pale);border-color:var(--teal)}
  .vote-row-c.sel-no{background:var(--danger-pale);border-color:var(--danger-border)}
  .vbtn{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-size:.95rem;transition:all .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .vbtn:hover{transform:scale(1.1)}
  .vbtn.yes.on{background:var(--teal);border-color:var(--teal-dark);color:#fff}
  .vbtn.no.on{background:var(--danger);border-color:var(--danger-dark);color:white}
  /* event cards */
  .event-card-row{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;display:flex;transition:transform .15s}
  .event-card-row:hover{transform:translateY(-2px)}
  .event-date-blk{width:68px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 6px}
  .event-day-big{font-family:'Manuale',serif;font-size:1.7rem;font-weight:700;line-height:1;color:white}
  .event-month-sm{font-size:.68rem;font-weight:700;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:.5px}
  .event-body-c{flex:1;padding:14px 16px}
  .event-title-c{font-family:'Manuale',serif;font-size:.97rem;font-weight:700;color:var(--text);margin-bottom:3px}
  .event-meta-c{font-size:.84rem;color:var(--muted);margin-bottom:7px}
  .event-desc-c{font-size:.88rem;color:var(--text);line-height:1.55;margin-bottom:9px}
  .event-bar{height:4px;background:var(--border);border-radius:99px;margin-top:6px;overflow:hidden}
  .event-bar-fill{height:100%;border-radius:99px;transition:width .4s}
  /* sub-tabs inside doodle page */
  .sub-tabs{display:flex;gap:6px;margin-bottom:20px}
  .sub-tab{padding:7px 16px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-family:'Exo 2',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;transition:all .15s}
  .sub-tab.active{background:var(--forest);color:white;border-color:var(--forest)}
  .imp-sub-nav{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
  .page-title{font-family:'Manuale',serif;font-size:1.4rem;font-weight:700;color:var(--text);margin:0 0 20px 0;}
  .imp-sub-btn{padding:8px 18px;border-radius:10px;border:1.5px solid var(--border2);background:transparent;color:var(--muted);font-family:'Exo 2',sans-serif;font-weight:700;font-size:.83rem;cursor:pointer;transition:all .15s}
  .imp-sub-btn:hover:not(.imp-sub-active){border-color:var(--forest-dark);color:var(--forest-dark)}
  .imp-sub-active{background:var(--forest) !important;color:#fff !important;border:2.5px solid var(--forest-dark) !important}

window.onerror = (msg, src, line, col, err) => {
  if(line === 0 && !src) return true; // Cross-Origin-Fehler ignorieren
  // Fix (31.08.2026): 1:1 identischer Filter wie in index.html — siehe dortiger Kommentar.

  if(/Can't find variable:\s*EmptyRanges/i.test(String(msg))) { console.warn('[Media] bekannter WebKit-Controls-Fehler ignoriert:', msg); return true; }

// Fix: Aufnahme wird vor dem Senden immer zu WAV/PCM re-encoded — von JEDEM Browser
// (inkl. iOS Safari) nativ abspielbar, ohne zusätzliche Library.
const encodeWav = audioBuffer => {
  const numChannels = audioBuffer.numberOfChannels;
  const sampleRate  = audioBuffer.sampleRate;
  const numFrames   = audioBuffer.length;
  const blockAlign  = numChannels * 2; // 16-bit
  const dataSize    = numFrames * blockAlign;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view   = new DataView(buffer);
  const writeStr = (offset, str) => { for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); };
  writeStr(0,"RIFF"); view.setUint32(4,36+dataSize,true); writeStr(8,"WAVE");
  writeStr(12,"fmt "); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numChannels,true); view.setUint32(24,sampleRate,true);
  view.setUint32(28,sampleRate*blockAlign,true); view.setUint16(32,blockAlign,true);
  view.setUint16(34,16,true); writeStr(36,"data"); view.setUint32(40,dataSize,true);
  const channels = []; for(let c=0;c<numChannels;c++) channels.push(audioBuffer.getChannelData(c));
  let offset = 44;
  for(let i=0;i<numFrames;i++){
    for(let c=0;c<numChannels;c++){
      let s = Math.max(-1,Math.min(1,channels[c][i]));
      s = s<0 ? s*0x8000 : s*0x7FFF;
      view.setInt16(offset,s,true); offset+=2;
    }
  }
  return new Blob([view],{type:"audio/wav"});
};

function adminUrlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

function isAdminPWA() {

// Erzeugt einen kurzen, stabilen Schlüssel aus dem Subscription-Endpoint (eindeutig pro
// Browser/Gerät), damit mehrere Geräte (z.B. iPhone + Desktop-Firefox) unter derselben
// Coach-UID gleichzeitig registriert bleiben können, statt sich gegenseitig zu überschreiben.
async function adminSubKeyFromEndpoint(endpoint) {
  const enc = new TextEncoder().encode(endpoint);
  const hashBuffer = await crypto.subtle.digest('SHA-256', enc);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 24);
}

async function subscribeAdminToPush(uid) {
  try {
    if(!ADMIN_PUSH_VAPID_KEY || !uid) return;
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(sub) {
      const currentKey = adminUrlBase64ToUint8Array(ADMIN_PUSH_VAPID_KEY);
      const subKey = new Uint8Array(sub.options?.applicationServerKey || []);
      const keyMatches = subKey.length === currentKey.length && subKey.every((b,i) => b === currentKey[i]);
      if(!keyMatches) {
        await sub.unsubscribe().catch(()=>{});
        sub = null;
      }
    }
    if(!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: adminUrlBase64ToUint8Array(ADMIN_PUSH_VAPID_KEY)
      });
    }
    const fbDb = window._fb?.db;
    if(fbDb && sub) {
      const subJson = JSON.parse(JSON.stringify(sub));
      const deviceKey = await adminSubKeyFromEndpoint(subJson.endpoint);
      fbDb.collection("admin_push_subscriptions").doc(uid)
        .collection("devices").doc(deviceKey)
        .set({ pushSubscription: subJson, updatedAt: Date.now() }).catch(()=>{});
    }
  } catch(e) {}
}

function LoginPage() {
  const [mode,setMode] = useState("login");
  const [email,setEmail] = useState("");
  const [pw,setPw] = useState("");
  const [error,setError] = useState("");
  const [loading,setLoading] = useState(false);

  // Fix (07.08.2026): Sicherheitsnetz gegen exakt das Muster, das uns wiederholt begegnet ist —
  // ein Firebase-Call, der nie auflöst (weder Erfolg noch Fehler). Ohne dieses Netz bliebe der
  // Button trotz der obigen .finally()/try-catch-Fixes hängen, falls das zugrunde liegende
  // Promise selbst niemals settled. Nach 15s wird der Button so oder so freigegeben.
  useEffect(() => {
    if(!loading) return;
    const t = setTimeout(() => {
      setLoading(false);
      setError("Das dauert ungewöhnlich lange. Bitte versuche es nochmals.");
    }, 15000);
    return () => clearTimeout(t);
  }, [loading]);

  const doLogin = () => {
    if(!email||!pw){setError("Bitte E-Mail und Passwort eingeben.");return;}
    setLoading(true);setError("");
    const fbAuth = window._fb?.auth||window.firebase?.auth();
    if(!fbAuth){setError("App wird geladen... kurz warten.");setLoading(false);return;}
    // Fix (07.08.2026): vorher nur .catch() ohne .then()/.finally() — auf dem Erfolgspfad
    // wurde `loading` nie zurückgesetzt, der Button blieb bei "Wird geladen…" hängen, falls
    // der Übergang zu AdminApp (via onAuthStateChanged in Root) auch nur kurz verzögert war.
    // index.html macht es robuster: setLoading(false) unbedingt nach try/await/catch, egal ob
    // Erfolg oder Fehler — 1:1 übernommen (.finally() als Äquivalent zum unbedingten Reset).
    const p = mode==="login"
      ? fbAuth.signInWithEmailAndPassword(email,pw)
      : fbAuth.createUserWithEmailAndPassword(email,pw);
    // Fix (20.08.2026): onAuthStateChanged in Root() feuert nach einem frischen Login manchmal
    // nicht zuverlässig (bekanntes Verhalten in installierten iOS-PWAs, siehe Kommentar in
    // Root()) — die App blieb dann auf der LoginPage stehen, obwohl der Login serverseitig
    // längst erfolgreich war (erst ein manueller Neustart der App zeigte das Dashboard).
    // Erzwungener Reload nach Erfolg umgeht das zuverlässig: Firebase liest die Session beim
    // Neuladen frisch aus IndexedDB, das funktioniert nachweislich robust (Kaltstart-Fall).
    p.then(()=>{ window.location.reload(); }).catch(e=>{
      const msgs={"auth/user-not-found":"E-Mail nicht gefunden.","auth/wrong-password":"Falsches Passwort.","auth/invalid-credential":"E-Mail oder Passwort falsch.","auth/email-already-in-use":"E-Mail bereits registriert.","auth/weak-password":"Passwort zu kurz (min. 6 Zeichen).","auth/invalid-email":"Ungültige E-Mail."};
      setError(msgs[e.code]||"Fehler: "+e.message);
      setLoading(false);
    });
  };

  const doReset = () => {
    if(!email){setError("Bitte zuerst E-Mail eingeben.");return;}
    const fbAuth=window._fb?.auth||window.firebase?.auth();
    if(fbAuth) fbAuth.sendPasswordResetEmail(email).then(()=>alert("Reset-E-Mail gesendet an: "+email)).catch(e=>setError(e.message));
  };

  return html`
    <div class="login-wrap" style=${{flexDirection:"column",alignItems:"center"}}>
      <div style=${{fontFamily:"'Exo 2',sans-serif",fontSize:".62rem",fontWeight:600,color:"#B8860B",letterSpacing:"0.5px",marginBottom:14}}>88445719</div>
      <div class="login-card" style=${{margin:0}}>
        <div class="login-logo">
          <${Logo} size=${64}/>
          <div style=${{textAlign:"center"}}>
            <div style=${{fontFamily:"'Manuale',serif",fontSize:"1.3rem",fontWeight:700,color:"var(--text)"}}>Raum für Selbstwirksamkeit</div>
            <div style=${{marginTop:6}}><span class="login-badge">Admin-Portal</span></div>
          </div>
        </div>

        ${error&&html`<div style=${{background:"var(--danger-pale)",border:"1px solid var(--danger-border)",borderRadius:10,padding:"10px 14px",fontSize:".83rem",color:"var(--danger)",marginBottom:14}}>${error}</div>`}

        <div class="form-row"><label class="label">E-Mail</label><input class="input" type="email" value=${email} onInput=${e=>setEmail(e.target.value)} placeholder="deine@email.ch"/></div>
        <div class="form-row"><label class="label">Passwort</label><input class="input" type="password" value=${pw} onInput=${e=>setPw(e.target.value)} placeholder="••••••••" onKeyDown=${e=>e.key==="Enter"&&doLogin()}/></div>

        <button onClick=${doLogin} disabled=${loading}
          style=${{width:"100%",padding:"12px",borderRadius:10,border:"none",background:"var(--teal)",color:"white",cursor:"pointer",fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:".92rem",opacity:loading?.6:1}}>
          ${loading?"Wird geladen…":mode==="login"?"Anmelden":"Registrieren"}
        </button>

        <div style=${{display:"flex",justifyContent:"space-between",marginTop:12,fontSize:".78rem"}}>
          <button onClick=${()=>{setMode(mode==="login"?"register":"login");setError("");}} style=${{background:"none",border:"none",cursor:"pointer",color:"var(--teal-dark)",fontWeight:700,fontFamily:"'Exo 2',sans-serif",fontSize:".78rem"}}>
            ${mode==="login"?"Konto erstellen":"Anmelden"}
          </button>
          ${mode==="login"&&html`<button onClick=${doReset} style=${{background:"none",border:"none",cursor:"pointer",color:"var(--muted)",fontFamily:"'Exo 2',sans-serif",fontSize:".78rem",textDecoration:"underline"}}>Passwort vergessen?</button>`}
        </div>
      </div>
    </div>`;
}

const ADMIN_HASH_TO_PAGE = { chat: "chat", doodle: "doodle", library: "library", impuls: "impuls", coachees: "coachees" };

function AdminApp({user}) {
  const [page,setPage] = useState("dashboard");
  // pendingChatId: aus einem Push-Deep-Link (#chat-<uid>) übernommene Coachee-UID, die
  // ChatPage beim Öffnen direkt anwählen soll (siehe applyHash unten + ChatPage-Prop openId).
  const [pendingChatId,setPendingChatId] = useState(null);
  // pendingSenderFilter: von der Home-Karte übernommene Diana/Rico-Auswahl — ChatPage
  // übernimmt diesen Wert als aktiven Toggle beim Öffnen, siehe DashboardPage-Kacheln.
  const [pendingSenderFilter,setPendingSenderFilter] = useState(null);
  // forceListToken (NEU, 11.08.2026, Rico-Meldung "Push öffnet manchmal direkt eine
  // Einzelkonversation statt der Liste"): setPage("chat") ist ein No-Op, wenn man beim
  // Push-Empfang bereits auf der Chat-Seite steht — ChatPage bleibt dann unverändert
  // gemountet und zeigt weiterhin die zuletzt geöffnete Einzelkonversation, statt zur
  // Liste zurückzuspringen. Ein simpler Zähler als zusätzliches Signal (statt Boolean,
  // damit auch zwei Pushes mit identischem Ziel hintereinander zuverlässig je einmal
  // zurücksetzen) löst das unabhängig vom aktuellen page-Wert aus.
  const [forceListToken,setForceListToken] = useState(0);
  // Gemeinsame Routing-Logik, sowohl für den normalen Hash-Weg (hashchange/Erst-Laden)
  // als auch für den Kaltstart-Fallback über Cache Storage (applyPendingDeepLink unten).
  const routeHash = (hash) => {
    // Fix (02.07.2026, Kapitel 33, identisch zu index.html): Kurzlebigen Crash-Recovery-
    // Eintrag hinterlegen, sobald ein gültiges Push-Ziel geroutet wird — greift nur, wenn
    // hardReload() später ohne eigenen Hash aufgerufen wird (siehe dortiger Kommentar).
    if(hash && (hash.startsWith("chat-") || ADMIN_HASH_TO_PAGE[hash])) {
      try { localStorage.setItem('rsw_admin_crash_recover_hash', JSON.stringify({ hash, ts: Date.now() })); } catch(e) {}
    }
    if(hash.startsWith("chat-")) {
      setPage("chat");
      setPendingChatId(hash.slice(5));
    } else if(hash === "chat") {
      setPage("chat");
      setForceListToken(t=>t+1);
    } else if(ADMIN_HASH_TO_PAGE[hash]) {
      setPage(ADMIN_HASH_TO_PAGE[hash]);
    }
  };
  // ── Hash-Routing: ermöglicht Deep-Links aus Push-Notifications (z.B. admin.html#doodle) ──
  // Fehlte bisher komplett — ein Push-Tap mit #doodle in der URL landete deshalb immer auf
  // der Default-Page (dashboard), statt direkt zur passenden Seite zu springen.
  // #chat-<uid> (NEU, 01.07.2026): landete bisher nur auf der Chat-Übersicht, ohne die
  // konkrete Coachee-Konversation zu öffnen — ChatPage verwaltet die aktive Konversation
  // über einen internen activeId-State, der ohne pendingChatId nie befüllt wurde (Fund 01.07.2026).
  useEffect(() => {
    const applyHash = () => routeHash(window.location.hash.replace("#",""));
    // Kaltstart-Fallback (NEU 01.07.2026): Bei komplett geschlossener App (v.a. iOS-PWA)
    // reicht der Browser die an clients.openWindow() übergebene URL nicht immer zuverlässig
    // weiter (bekannte WebKit-Einschränkung) — Rico beobachtete das konkret bei
    // #chat-<uid>: Landung auf der Startseite statt der Konversation, nur mobil reproduzierbar.
    // sw-admin.js legt das eigentliche Ziel deshalb zusätzlich im Cache Storage ab; hier wird
    // das beim Boot ausgelesen und nachträglich angewendet, unabhängig davon, ob der Hash in
    // der URL selbst angekommen ist. Freshness-Check (60s) verhindert, dass ein längst
    // erledigter Deep-Link bei einem späteren, regulären App-Start irrtümlich erneut greift.
    const applyPendingDeepLink = async (attempt) => {
      attempt = attempt || 0;
      if(!('caches' in window)) return;
      try {
        const cache = await caches.open('pending-deeplink');
        const resp = await cache.match('/pending');
        if(!resp) {
          // Fix (02.07.2026, Kapitel 32, identisch zu index.html): kurzer Retry gegen
          // das Timing-Fenster zwischen sw-admin.js' Cache-Write und client.focus().
          if(attempt < 4) setTimeout(() => applyPendingDeepLink(attempt + 1), 150);
          return;
        }
        const data = await resp.json();
        await cache.delete('/pending');
        // Fix (02.07.2026, Kapitel 32, identisch zu index.html): 60s-Fenster viel zu
        // knapp für reale Push-Nutzung, grosszügig auf 24h erweitert.
        if(Date.now() - (data.ts || 0) > 24*60*60*1000) return;
        const hash = (data.url || '').includes('#') ? data.url.split('#')[1] : '';
        if(hash) routeHash(hash);
      } catch(e) {}
    };
    // Fix 02.07.2026 (Kapitel 32): global exponieren, damit der visibilitychange-Handler
    // ganz oben im File sie bei kurzer Hintergrundzeit (kein Reload) direkt aufrufen kann.
    window.__swApplyPendingDeepLink = applyPendingDeepLink;
    applyHash();
    // Fix: Hash sofort nach der Anwendung aus der URL entfernen (via replaceState — löst
    // bewusst KEIN hashchange aus, kein Schleifenrisiko). Sonst bleibt er im Tab-/PWA-
    // Verlauf hängen: ein simples Neuladen oder Wiederöffnen landete dadurch immer wieder
    // auf der zuletzt besuchten Seite statt auf der Home-Seite, obwohl useState("dashboard")
    // das eigentlich als Standard vorsieht. Ein echter Push-Tap setzt den Hash bei jedem
    // Tap ohnehin frisch neu — davon unberührt.
    if(window.location.hash) {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }
    applyPendingDeepLink();
    window.addEventListener("hashchange", applyHash);
    return () => window.removeEventListener("hashchange", applyHash);
  }, []);
  const [coachees,setCoachees] = useState(INIT_COACHEES);
  const [library,setLibrary] = useState([]);
  const [doodles,setDoodles] = useState(INIT_DOODLES);
  const [pending,setPending]   = useState([]);
  const [deleted,setDeleted]   = useState([]);
  const totalUnread = coachees.reduce((a,c)=>a+(c.unread||0),0);

  // ── Sync-Fehler-Banner (NEU, Kapitel 175) ──
  // Rico meldete: Desktop-Admin zeigte Coachees/Nachrichten/Termine durchgehend als 0,
  // während dasselbe Konto auf dem Handy korrekte Werte zeigte. Root Cause: alle
  // onSnapshot-Listener unten schluckten Fehler (z.B. "permission-denied" bei
  // ungültiger/abgelaufener Session, oder Netzwerk-/VPN-Blockade Richtung
  // firestore.googleapis.com) bisher komplett lautlos (Error-Callback war `()=>{}`) —
  // weder Konsole noch Fehler-Log zeigten je etwas an. Jetzt: jeder fehlschlagende
  // Kern-Listener setzt syncError, ein Banner erscheint sichtbar auf jeder Seite.
  const [syncError,setSyncError] = useState(null);

  // ── Push-Notification-Setup: Service Worker registrieren automatisch, Erlaubnis aber
  // NUR per explizitem Button-Tap anfragen (siehe showAdminNotifBanner unten).
  // WICHTIG (Fund 30.06.2026): Auf iOS/iPadOS Safari kann ein normaler Browser-Tab
  // grundsätzlich KEINE Push-Berechtigung anfragen — nur als PWA installierte Seiten
  // dürfen das (display: standalone). UND selbst dort verlangt iOS bei vielen Versionen
  // eine direkte Nutzerinteraktion für Notification.requestPermission() — ein automatischer
  // Aufruf via setTimeout im useEffect wurde beobachtet, lautlos zu verpuffen: kein Prompt
  // erscheint, keine Fehlermeldung, Notification.permission bleibt einfach auf 'default'.
  // Ein expliziter Button-Tap garantiert die nötige Nutzerinteraktion zuverlässig.
  const [adminPushGranted, setAdminPushGranted] = useState(typeof Notification !== 'undefined' && Notification.permission === 'granted');
  const [showAdminInstallBanner, setShowAdminInstallBanner] = useState(false);
  const [showAdminNotifBanner, setShowAdminNotifBanner] = useState(false);
  useEffect(() => {
    if(isAdminIOS() && !isAdminPWA()) {
      // iOS + nicht installiert: Permission-Anfrage würde ins Leere laufen — Hinweis statt.
      setTimeout(() => setShowAdminInstallBanner(true), 2000);
      return;
    }
    registerAdminSW();
    if(typeof Notification !== 'undefined' && Notification.permission === 'default') {
      setTimeout(() => setShowAdminNotifBanner(true), 1500);
    }
  }, []);
  const handleEnableAdminPush = async () => {
    const granted = await requestAdminPushPermission();
    setAdminPushGranted(granted);
    setShowAdminNotifBanner(false);
  };
  useEffect(() => {
    if(adminPushGranted && user?.uid) subscribeAdminToPush(user.uid);
  }, [adminPushGranted, user?.uid]);


  // ── Termine-Badge: neue Coachee-Stimmen seit letztem Besuch ──
  // Votes haben keinen eigenen Zeitstempel (siehe Pitfall 40 / votes-Struktur), daher kein
  // direkter ts-Vergleich wie beim Chat möglich. Stattdessen: Gesamtzahl aller abgegebenen
  // Stimmen über alle offenen Doodles zählen und mit der beim letzten Besuch gespeicherten
  // Zahl vergleichen — die Differenz sind neu hinzugekommene Stimmen.
  const totalVotesNow = doodles
    .filter(d => d.status !== "closed")
    .reduce((sum,d) => sum + toSlotsArray(d.slots).reduce((s,slot) => s + Object.keys(slot?.votes||{}).length, 0), 0);
  const lastSeenVotes = Number(localStorage.getItem("doodleLastVotes") || totalVotesNow);
  const doodleUnread = Math.max(0, totalVotesNow - lastSeenVotes);
  useEffect(() => {
    if(page === "doodle") localStorage.setItem("doodleLastVotes", String(totalVotesNow));
  }, [page, totalVotesNow]);

  // ── Library Firebase Sync ──
  useEffect(() => {
    const firestore = db();
    if(!firestore) { setLibrary(INIT_LIBRARY); return; }
    const col = firestore.collection("library");
    let unsub;
    try {
      unsub = col.orderBy("createdAt","desc").onSnapshot(snap => {
        const items = snap.docs.map(d => ({id: d.id, ...d.data()}));
        setLibrary(items.length > 0 ? items : INIT_LIBRARY);
        setSyncError(null);
      }, (err) => { setLibrary(INIT_LIBRARY); setSyncError(err?.code||err?.message||"library"); });
    } catch(e) { setLibrary(INIT_LIBRARY); }
    return () => { if(unsub) unsub(); };
  }, []);

  // ── Doodles aus Firestore laden ──
  useEffect(() => {
    const firestore = db();
    if(!firestore) return;
    const unsub = firestore.collection("doodles").onSnapshot(snap => {
      setDoodles(snap.docs.map(d => ({...d.data(), id: d.id})));
      setSyncError(null);
    }, (err) => { setSyncError(err?.code||err?.message||"doodles"); });
    return () => unsub();
  }, []);

  // ── Auto-Löschung erledigter Doodles (Kapitel 110) ──
  // Rico-Wunsch: Sobald der/die Coachee(s) selbst "✓ Erledigt" getippt haben (bedeutet:
  // Termin(e) im eigenen Kalender eingetragen), soll der Doodle bei Diana/Rico automatisch
  // verschwinden — kein zusätzlicher Bestätigungsklick des Coaches mehr nötig. Bei mehreren
  // Empfängern (Termin-Set: Runder Tisch + Einzeltermine) müssen ALLE recipients dismissed
  // haben, bevor gelöscht wird. Löschung läuft rein clientseitig hier in der Admin-App (kein
  // Cloud-Function-Trigger nötig) — Coach hat laut Firestore-Rules ohnehin volles Schreibrecht.
  useEffect(() => {
    const firestore = db();
    if(!firestore) return;
    doodles.forEach(d => {
      const recip = d.recipients||[];
      const dismissed = d.dismissed||[];
      if(recip.length > 0 && recip.every(r => dismissed.includes(r))) {
        firestore.collection("doodles").doc(String(d.id)).delete().catch(()=>{});
      }
    });
  }, [doodles]);

  // ── Coachees aus Firestore laden ──
  useEffect(() => {
    const firestore = db();
    if(!firestore) return;
    const unsub = firestore.collection("users").onSnapshot(snap => {
      const list = snap.docs.map(d => {
        const data = d.data();
        const raw = data.activePhase;
        let phase = null;
        if(raw != null) {
          if(typeof raw === 'number') phase = raw;
          else if(typeof raw === 'string') phase = parseInt(raw,10)||null;
          else if(typeof raw.toNumber === 'function') phase = raw.toNumber();
          else if(typeof raw.valueOf === 'function') phase = parseInt(raw.valueOf(),10)||null;
        }
        const n = data.name||"";
        const parts = n.trim().split(/\s+/);
        const initials = parts.length>=2 ? (parts[0][0]+(parts[parts.length-1][0])).toUpperCase() : n.slice(0,2).toUpperCase();
        return { id: d.id, uid: d.id, ...data, activePhase: phase, initials, color: AVATAR_BG[0], unread: 0, messages: [] };
      });
      // Pitfall (Kapitel 63): Dieser Listener feuert bei JEDER Änderung an einem
      // users-Dokument (z.B. lastSeen-Update bei jedem Coachee-App-Start) und baute
      // die Liste bisher immer mit unread:0 neu auf — das überschrieb den vom separaten
      // Message-Listener (siehe unten) live berechneten unread-Wert wieder auf 0, oft
      // im selben Moment, in dem eine neue Nachricht eintraf (Coachee muss die App ja
      // offen haben, um zu senden → lastSeen ändert sich fast zeitgleich). Fix: unread
      // (und den mitgeführten messages-Cache) aus dem bisherigen State übernehmen statt
      // hart zurückzusetzen — der Message-Listener bleibt die einzige Quelle für unread.
      setCoachees(prev => {
        const prevMap = new Map(prev.map(c => [c.id, c]));
        return list.map(c => {
          const old = prevMap.get(c.id);
          return old ? { ...c, unread: old.unread || 0, messages: old.messages || [] } : c;
        });
      });
      setSyncError(null);
    }, (err) => { setSyncError(err?.code||err?.message||"users"); });
    return () => unsub();
  }, []);

  // ── Unread-Listener: pro Coachee letzte Nachricht beobachten ──
  // Fix (24.08.2026, Rico-Meldung "Nachricht auf Ricos Gerät bearbeitet, bleibt auf Dianas
  // Gerät trotzdem ungelesen"): lastRead/manualUnread lagen bisher NUR in localStorage — das ist
  // je Gerät getrennter Speicher. Zwei Admin-Geräte (Ricos und Dianas), die dieselben Firestore-
  // Chats anzeigen, hatten dadurch zwangsläufig zwei unabhängige "gelesen"-Zustände, die nie
  // synchronisierten. Fix: lastRead/manualUnread liegen jetzt geräteübergreifend in Firestore,
  // unter chats/{coacheeId}/adminMeta/read (Felder lastReadDiana/lastReadRico/manualUnreadDiana/
  // manualUnreadRico) — jedes Gerät liest UND schreibt denselben Dokument, ein "gelesen" auf
  // einem Gerät ist dadurch sofort per Snapshot-Listener auch auf dem anderen sichtbar.
  // adminFirstOpenTs dient nur noch als Einmal-Startwert, falls für einen Coachee überhaupt noch
  // kein adminMeta-Dokument existiert (allererster Kontakt) — danach ist der Firestore-Wert
  // massgeblich, nicht mehr das lokale Gerät.
  const adminFirstOpenTsRef = useRef(null);
  if(adminFirstOpenTsRef.current===null) {
    let stored = parseInt(localStorage.getItem('adminFirstOpenTs')||'0');
    if(!stored) { stored = Date.now(); localStorage.setItem('adminFirstOpenTs', stored); }
    adminFirstOpenTsRef.current = stored;
  }
  const unreadUnsubsRef = useRef({});
  const adminMetaCacheRef = useRef({});
  const messagesCacheRef = useRef({});
  // Fix (31.08.2026, Rico-Meldung "zeigt ganz kurz offene Nachrichten an und
  // verschwindet dann wieder"): msgUnsub und metaUnsub sind zwei unabhängige
  // onSnapshot-Listener ohne garantierte Reihenfolge. Feuerte bisher msgUnsub
  // zuerst (adminMetaCacheRef für diesen Coachee noch leer), rechnete recompute()
  // mangels echtem lastRead-Wert gegen den viel älteren Fallback
  // adminFirstOpenTsRef.current — eine längst gelesene Nachricht erschien dadurch
  // kurz fälschlich als neu ungelesen, bis metaUnsub kurz danach mit dem echten,
  // aktuelleren Firestore-Wert nachlieferte und auf 0 zurückrechnete. Fix:
  // metaLoadedRef merkt sich pro Coachee, ob der echte adminMeta-Wert schon
  // mindestens einmal geladen wurde — recompute() aus msgUnsub wird bis dahin
  // unterdrückt, sodass nie mit dem veralteten Fallback gerechnet wird.
  const metaLoadedRef = useRef({});
  useEffect(() => {
    const firestore = db();
    if(!firestore) return;
    // Alte Listener aufräumen
    Object.values(unreadUnsubsRef.current).forEach(pair=>pair.forEach(u=>u&&u()));
    unreadUnsubsRef.current = {};
    coachees.forEach(c => {
      const readRef = firestore.collection('chats').doc(c.id).collection('adminMeta').doc('read');
      const recompute = () => {
        const meta = adminMetaCacheRef.current[c.id] || {};
        const msgs = messagesCacheRef.current[c.id] || [];
        const result = {};
        [["Diana","unreadDiana"],["Rico","unreadRico"]].forEach(([who,field])=>{
          const lastRead = meta['lastRead'+who] != null ? meta['lastRead'+who] : adminFirstOpenTsRef.current;
          const unreadDocs = msgs.filter(m => m.from==='coachee' && (m.recipient||"Diana")===who && (m.ts||0) > lastRead);
          result[field] = unreadDocs.length;
          result[field+"OldestTs"] = unreadDocs.length ? Math.min(...unreadDocs.map(m=>m.ts||0)) : null;
          // Manuelle Markierung ("als ungelesen markieren"): überstimmt nur, wenn der reguläre
          // Zeitstempel-Vergleich 0 ergibt — lastRead{Diana|Rico} bleibt dabei unangetastet.
          const manualTs = meta['manualUnread'+who];
          if(manualTs && !result[field]) {
            result[field] = 1;
            result[field+"OldestTs"] = manualTs;
          }
        });
        setCoachees(cs=>cs.map(x=>x.id===c.id?{...x,unreadDiana:result.unreadDiana,unreadRico:result.unreadRico,unreadDianaOldestTs:result.unreadDianaOldestTs,unreadRicoOldestTs:result.unreadRicoOldestTs,unread:result.unreadDiana+result.unreadRico}:x));
      };
      const msgUnsub = firestore.collection('chats').doc(c.id).collection('messages')
        .orderBy('ts','desc').limit(5)
        .onSnapshot(snap => {
          messagesCacheRef.current[c.id] = snap.docs.map(d=>d.data());
          // Vor dem ersten echten adminMeta-Snapshot nicht rechnen (siehe Fix-Kommentar
          // oben) — sonst kurzes Flackern mit falschem "ungelesen"-Wert.
          if(metaLoadedRef.current[c.id]) recompute();
        }, (err)=>{ setSyncError(err?.code||err?.message||"messages"); });
      const metaUnsub = readRef.onSnapshot(snap => {
        if(!snap.exists) {
          // Allererster Kontakt mit diesem Coachee auf irgendeinem Admin-Gerät: einmalige,
          // geräteübergreifend geteilte Baseline anlegen, damit nicht die komplette bisherige
          // Historie rückwirkend als ungelesen zählt.
          readRef.set({lastReadDiana:adminFirstOpenTsRef.current, lastReadRico:adminFirstOpenTsRef.current}, {merge:true}).catch(()=>{});
          adminMetaCacheRef.current[c.id] = {lastReadDiana:adminFirstOpenTsRef.current, lastReadRico:adminFirstOpenTsRef.current};
        } else {
          adminMetaCacheRef.current[c.id] = snap.data();
        }
        metaLoadedRef.current[c.id] = true;
        recompute();
      }, (err)=>{ setSyncError(err?.code||err?.message||"adminMeta"); });
      unreadUnsubsRef.current[c.id] = [msgUnsub, metaUnsub];
    });
    return () => Object.values(unreadUnsubsRef.current).forEach(pair=>pair.forEach(u=>u&&u()));
  }, [coachees.length]);

  // ── Pending Coachees Sync ──
  useEffect(() => {
    const firestore = db();
    if(!firestore) return;
    const unsub = firestore.collection("users_pending").onSnapshot(snap => {
      setPending(snap.docs.map(d => ({docId: d.id, ...d.data()})));
    }, () => {});
    return () => unsub();
  }, []);

  // ── Deleted Coachees Sync ──
  useEffect(() => {
    const firestore = db();
    if(!firestore) return;
    const unsub = firestore.collection("users_deleted").orderBy("deletedAt","desc").onSnapshot(snap => {
      setDeleted(snap.docs.map(d => ({docId: d.id, ...d.data()})));
    }, () => {});
    return () => unsub();
  }, []);

  // ── Fehler-Log Sync (NEU 17.08.2026, Kapitel 128) ──
  // Zeigt Coachee-seitige JS-/Firestore-Fehler an, die index.html still im Hintergrund
  // nach error_logs schreibt (kein UI-Impact für den Coachee). Sortiert neueste zuerst.
  const [errorLogs, setErrorLogs] = useState([]);
  useEffect(() => {
    const firestore = db();
    if(!firestore) return;
    const unsub = firestore.collection("error_logs").orderBy("ts","desc").limit(200).onSnapshot(snap => {
      setErrorLogs(snap.docs.map(d => ({docId: d.id, ...d.data()})));
    }, () => {});
    return () => unsub();
  }, []);
  const openErrorCount = errorLogs.filter(e => !e.resolved).length;

  const NAV = [
    {id:"dashboard",icon:"home",label:"Home"},
    {id:"chat",icon:"chat",label:"Chat",badge:totalUnread},
    {id:"coachees",icon:"users",label:"Coachees",badge:pending.length+deleted.length},
    {id:"library",icon:"library",label:"Mediathek"},
    {id:"impuls",icon:"impuls",label:"Impulse"},
    {id:"doodle",icon:"calendar",label:"Termine",badge:doodleUnread},
    {id:"errors",icon:"alert",label:"Fehler-Log",badge:openErrorCount},
  ];

  // ── Homescreen-App-Icon-Badge (Badging API) ──
  // Summiert Chat-Unread, offene Doodle-Stimmen und gelöschte Coachees zur Prüfung für
  // die native App-Icon-Anzeige. "Noch nicht registriert" (pending) bewusst NICHT
  // eingerechnet (24.08.2026, Ricos Entscheid) — das ist im Coachees-Tab-Badge ohnehin
  // dauerhaft sichtbar und würde den App-Icon-Badge quasi permanent triggern. Zeigt die
  // echte Zahl statt fix "1" (24.08.2026) — abweichend von index.html, das weiterhin auf
  // "1" gedeckelt bleibt (Rico-Entscheid 10.08.2026, Kapitel 66/67), hier bewusst NICHT
  // angepasst. Keine Custom-Farbe möglich (Betriebssystem entscheidet), Chrome für
  // Android exponiert die API nicht — dank Feature-Detection dort ein harmloses No-Op.
  useEffect(() => {
    if(!('setAppBadge' in navigator)) return;
    const badgeTotal = totalUnread + doodleUnread + deleted.length;
    if(badgeTotal > 0) navigator.setAppBadge(badgeTotal).catch(() => {});
    else navigator.clearAppBadge().catch(() => {});
  }, [totalUnread, doodleUnread, deleted.length]);

  const doLogout = () => { (window._fb?.auth||window.firebase?.auth())?.signOut().catch(()=>{}); };

  return html`
    <div class="app-layout">
    ${showAdminNotifBanner && h("div", {
      style:{position:"fixed",bottom:0,left:0,right:0,zIndex:19999,padding:"14px 16px 18px",background:"#0f2927",borderTop:"2px solid #1D9E75",display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}
    },
      h("div",{style:{flex:1,minWidth:200,fontSize:".85rem",color:"#fff",lineHeight:1.4}},
        "Push-Benachrichtigungen aktivieren, um bei Coachee-Aktivität (z.B. Terminabstimmung) sofort informiert zu werden."
      ),
      h("div",{style:{display:"flex",gap:8,flexShrink:0}},
        h("button",{
          onClick: handleEnableAdminPush,
          style:{background:"#156e6e",color:"#fff",border:"none",borderRadius:8,padding:"9px 18px",fontSize:".85rem",fontWeight:600,cursor:"pointer"}
        },"Aktivieren"),
        h("button",{
          onClick:()=>setShowAdminNotifBanner(false),
          style:{background:"transparent",border:"1px solid rgba(255,255,255,0.3)",color:"rgba(255,255,255,0.7)",borderRadius:8,padding:"9px 14px",fontSize:".85rem",cursor:"pointer"}
        },"Später")
      )
    )}
    ${showAdminInstallBanner && h("div", {
      style:{position:"fixed",bottom:0,left:0,right:0,zIndex:19999,padding:"16px 16px 20px",background:"#0f2927",borderTop:"2px solid #1D9E75"}
    },
      h("div", {style:{maxWidth:480,margin:"0 auto"}},
        h("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:10}},
          h("div",{style:{width:32,height:32,borderRadius:8,background:"#156e6e",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}},
            h("svg",{width:16,height:16,viewBox:"0 0 100 100",fill:"none"},
              h("circle",{cx:50,cy:50,r:46,fill:"#eaed53"}),
              h("circle",{cx:57,cy:51,r:34,fill:"#9dd979"}),
              h("circle",{cx:66,cy:51,r:20,fill:"#62ba7a"})
            )
          ),
          h("div",{style:{fontWeight:700,fontSize:".95rem",color:"#fff",lineHeight:1.2}},
            "Admin-App installieren für Push-Benachrichtigungen"
          )
        ),
        h("div",{style:{fontSize:".8rem",color:"rgba(255,255,255,0.65)",marginBottom:12,lineHeight:1.5}},
          "iOS erlaubt Push-Benachrichtigungen nur für installierte Apps."
        ),
        // GEÄNDERT (07.08.2026): Bisher statischer Text "Tippe unten auf Teilen → Zum Home-
        // Bildschirm" für alle Browser gleich — passte nicht, wenn ein iOS-Drittanbieter-Browser
        // (Chrome/Edge für iOS) genutzt wird, der erst über ein "•••"-Menü zum Teilen-Icon führt.
        // Gleiche Drei-Wege-Erkennung wie in index.html (Android / echtes iOS-Safari / iOS-
        // Drittanbieter-Browser), damit der Hinweis immer zum tatsächlich sichtbaren Bildschirm passt.
        h("div",{style:{display:"flex",flexDirection:"column",gap:7,marginBottom:12}},
          (() => {
            const ua = navigator.userAgent || "";
            const isAndroid = /Android/i.test(ua);
            // GEÄNDERT (07.08.2026): Bisher zwischen "echtem Safari" (2 Schritte) und iOS-Drittanbieter-
            // Browsern (3 Schritte) unterschieden — laut Ricos wiederholtem Live-Test auf seinem echten
            // iPhone führt auch Safari erst über "•••". Deshalb keine Unterscheidung mehr, alle iOS-
            // Browser bekommen denselben Drei-Schritte-Ablauf, nur Android bleibt separat.

            const step = (n, ...parts) => h("div",{style:{display:"flex",alignItems:"center",gap:10}},
              h("div",{style:{width:22,height:22,borderRadius:"50%",background:"#1D9E75",color:"#fff",fontWeight:700,fontSize:".75rem",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},String(n)),
              h("span",{style:{fontSize:".82rem",color:"rgba(255,255,255,0.85)"}}, ...parts)
            );

            if (isAndroid) {
              return [
                step(1, "Tippe oben rechts auf ", h("span",{style:{fontWeight:700,color:"#fff"}},"⋮")," (drei Punkte)"),
                step(2, "Tippe auf ", h("span",{style:{fontWeight:700,color:"#fff"}},"«App installieren»")," (oder «Zum Startbildschirm hinzufügen»)")
              ];
            }
            return [
              step(1, "Tippe auf ", h("span",{style:{fontWeight:700,color:"#fff"}},"«•••»")," (drei Punkte, meist unten oder oben rechts)"),
              step(2, "Wähle ", h("span",{style:{fontWeight:700,color:"#fff"}},"«Teilen»")," ⎙"),
              step(3, "Tippe auf ", h("span",{style:{fontWeight:700,color:"#fff"}},"«Zum Home-Bildschirm»"), h("span",{style:{color:"rgba(255,255,255,0.5)",fontSize:".75rem"}}," (evtl. unter «Mehr anzeigen»)"))
            ];
          })()
        ),
        h("button",{
          onClick:()=>setShowAdminInstallBanner(false),
          style:{background:"transparent",border:"1px solid rgba(255,255,255,0.3)",color:"#fff",borderRadius:8,padding:"8px 16px",fontSize:".8rem",cursor:"pointer"}
        },"Verstanden")
      )
    )}

      <!-- Desktop sidebar -->
      <div class="sidebar">
        <div class="sb-logo" onClick=${()=>setPage("dashboard")}><${Logo} size=${40}/></div>
        <div class="sb-nav">
          ${NAV.map(n=>html`
            <div key=${n.id} class=${"sb-item"+(page===n.id?" active":"")} onClick=${()=>setPage(n.id)} title=${n.label}>
              <${Ic} name=${n.icon} size=${18}/>
              <span class="sb-item-label">${n.label}</span>
              ${(n.badge||0)>0&&html`<span class="sb-badge">${n.badge}</span>`}
            </div>`)}
        </div>
        <div class="sb-bottom">
          <button class="sb-reload-btn" title="App neu laden" onClick=${()=>window.location.reload()}>
            <${Ic} name="refresh" size=${15}/>
          </button>
          <div class="sb-avatar" title=${user?.email||"Admin"} style=${{fontSize:".6rem"}}>
            ${user?.photoURL?html`<img src=${user.photoURL} style=${{width:"100%",height:"100%",borderRadius:"50%",objectFit:"cover"}} alt=""/>`:user?.email?.[0]?.toUpperCase()||"A"}
          </div>
          <button class="sb-logout-btn" onClick=${doLogout}>
            <${Ic} name="logout" size=${14}/>
            <span>Logout</span>
          </button>
        </div>
      </div>

      <!-- Main content -->
      <div class="main-content">
        ${syncError&&html`
          <div style=${{background:"#FBEAE3",border:"1px solid #E8B4A0",borderRadius:10,padding:"10px 14px",margin:"0 0 14px",fontSize:".82rem",color:"#993C1D",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
            <span>⚠️ Daten konnten nicht geladen werden (Firestore: ${syncError}). Zahlen sind evtl. veraltet oder falsch — bitte neu laden oder Login prüfen.</span>
            <button onClick=${()=>window.location.reload()} style=${{background:"#993C1D",color:"#fff",border:"none",borderRadius:6,padding:"5px 10px",fontSize:".76rem",fontWeight:600,cursor:"pointer",flexShrink:0}}>Neu laden</button>
          </div>`}
        ${page==="dashboard"&&html`<${DashboardPage} coachees=${coachees} library=${library} doodles=${doodles} setPage=${setPage} user=${user} openSenderFilter=${name=>{setPendingSenderFilter(name);setPage("chat");}} openErrorCount=${openErrorCount}/>`}
        ${page==="chat"&&html`<${ChatPage} coachees=${coachees} setCoachees=${setCoachees} openId=${pendingChatId} clearOpenId=${()=>setPendingChatId(null)} presetSender=${pendingSenderFilter} clearPresetSender=${()=>setPendingSenderFilter(null)} forceListToken=${forceListToken}/>`}
        ${page==="coachees"&&html`<${CoacheesPage} coachees=${coachees} setCoachees=${setCoachees} setPage=${setPage} pending=${pending} setPending=${setPending} deleted=${deleted} setDeleted=${setDeleted}/>`}
        ${page==="library"&&html`<${LibraryPage} library=${library} setLibrary=${setLibrary}/>`}
        ${page==="impuls"&&html`<${ImpulsAdminPage}/>`}
        ${page==="doodle"&&html`<${DoodlePage} doodles=${doodles} setDoodles=${setDoodles} coachees=${coachees} adminUid=${user?.uid}/>`}
        ${page==="errors"&&html`<${ErrorLogPage} errorLogs=${errorLogs}/>`}
      </div>

      <!-- Bottom nav (mobile) — "errors" absichtlich ausgeschlossen (NEU 17.08.2026):
           erreichbar über Glocken-Icon im Dashboard-Header statt eigenem Leisten-Punkt,
           um die mobile Leiste nicht zu überfüllen (Ricos Feedback). Desktop-Sidebar
           behält den Punkt, da dort genug Platz ist. -->
      <nav class="bottom-nav">
        ${NAV.filter(n=>n.id!=="errors").map(n=>html`
          <div key=${n.id} class=${"bn-item"+(page===n.id?" active":"")} onClick=${()=>setPage(n.id)}>
            <${Ic} name=${n.icon} size=${24}/>
            <span class="bn-item-label">${n.label}</span>
            ${(n.badge||0)>0&&html`<span class="bn-badge">${n.badge}</span>`}
          </div>`)}
        <div class="bn-item" onClick=${doLogout}>
          <${Ic} name="logout" size=${24}/>
          <span class="bn-item-label">Logout</span>
        </div>
      </nav>
    </div>`;
}



function DashboardPage({coachees,library,doodles,setPage,user,openSenderFilter,openErrorCount}) {
  const hour = new Date().getHours();
  const greetWord = hour<12?"Guten Morgen":hour<18?"Guten Tag":"Guten Abend";
  // Diana und Rico teilen sich denselben Admin-Login (siehe Kongruenz-Doku) — eine
  // Erkennung, wer gerade eingeloggt ist, ist daher nicht zuverlässig möglich. Fix
  // (NEU 17.08.2026, Ricos Wunsch): feste Anrede "Diana & Rico" statt versuchtem
  // Auslesen von user.displayName/email (zeigte bisher immer nur "Rico").
  const greeting = greetWord + ", Diana & Rico";
  const openDoodles = doodles.filter(d=>d.status==="open").length;
  const unreadDianaTotal = coachees.reduce((a,c)=>a+(c.unreadDiana||0),0);
  const unreadRicoTotal = coachees.reduce((a,c)=>a+(c.unreadRico||0),0);
  const totalUnread = unreadDianaTotal + unreadRicoTotal;
  const msgHint = totalUnread===0
    ? html`<div class="stat-hint">ungelesen</div>`
    : html`<div style=${{display:"flex",gap:6,marginTop:2}}>
        ${unreadDianaTotal>0&&html`<div onClick=${e=>{e.stopPropagation();openSenderFilter("Diana");}}
            style=${{flex:"0 0 calc(50% - 3px)",maxWidth:"calc(50% - 3px)",display:"flex",alignItems:"center",justifyContent:"space-between",
              background:"#e0f5ee",color:"#1d5a8f",borderRadius:8,padding:"6px 10px",
              fontSize:".78rem",fontWeight:700,cursor:"pointer"}}>
            <span>${unreadDianaTotal} an Diana</span>
            <${Ic} name="chevron" size=${13} style=${{color:"#1d5a8f"}}/>
          </div>`}
        ${unreadRicoTotal>0&&html`<div onClick=${e=>{e.stopPropagation();openSenderFilter("Rico");}}
            style=${{flex:"0 0 calc(50% - 3px)",maxWidth:"calc(50% - 3px)",display:"flex",alignItems:"center",justifyContent:"space-between",
              background:"#e9f3dd",color:"#3b6d11",borderRadius:8,padding:"6px 10px",
              fontSize:".78rem",fontWeight:700,cursor:"pointer"}}>
            <span>${unreadRicoTotal} an Rico</span>
            <${Ic} name="chevron" size=${13} style=${{color:"#3b6d11"}}/>
          </div>`}
      </div>`;

  return html`
    <div class="page">
      <div style=${{display:"flex",alignItems:"center",gap:14,minWidth:0}}>
        <${Logo} size=${52}/>
        <div style=${{minWidth:0}}>
          <div style=${{fontFamily:"'Manuale',serif",fontSize:"1.3rem",fontWeight:700,color:"var(--text)"}}>${greeting}</div>
          <div style=${{fontSize:".88rem",color:"var(--muted)",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"calc(100vw - 120px)"}}>Admin-Portal · Raum für Selbstwirksamkeit</div>
        </div>
      </div>
      <div style=${{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginTop:14,paddingTop:10,paddingBottom:16,borderTop:"1px solid var(--border2)",borderBottom:"1px solid var(--border2)",marginBottom:16,gap:10}}>
        <div style=${{fontSize:".75rem",color:"var(--muted)",opacity:.7,lineHeight:1.5}}>
          <div>App v2026-09-01 11:14 · Doku v3.234</div>
          <div>2026-08-31 21:54</div>
        </div>
        <div style=${{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          <button class="dash-reload-btn" title="Fehler-Log" onClick=${()=>setPage("errors")} style=${{position:"relative",color:openErrorCount>0?"#993C1D":"var(--muted)"}}>
            <${Ic} name="alert" size=${17}/>
            ${openErrorCount>0&&html`<span style=${{position:"absolute",top:-3,right:-3,background:"#D85A30",color:"#fff",fontSize:9,fontWeight:700,minWidth:15,height:15,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>${openErrorCount}</span>`}
          </button>
          <button class="dash-reload-btn" title="App neu laden" onClick=${()=>window.location.reload()}>
            <${Ic} name="refresh" size=${17}/>
          </button>
        </div>
      </div>

      <div class="stat-grid" style=${{marginBottom:12}}>
        <div class="stat-card" onClick=${()=>setPage("coachees")} style=${{cursor:"pointer"}}>
          <div class="stat-label">Coachees</div>
          <div class="stat-value">${coachees.length}</div>
          <div class="stat-hint">${coachees.filter(c=>c.online).length} online</div>
        </div>
        <div class="stat-card" onClick=${()=>setPage("chat")} style=${{cursor:"pointer"}}>
          <div class="stat-label">Nachrichten</div>
          <div class="stat-value">${totalUnread}</div>
          ${msgHint}
        </div>
        <div class="stat-card" onClick=${()=>setPage("library")} style=${{cursor:"pointer"}}>
          <div class="stat-label">Mediathek</div>
          <div class="stat-value">${library.length}</div>
          <div class="stat-hint">Materialien</div>
        </div>
        <div class="stat-card" onClick=${()=>setPage("doodle")} style=${{cursor:"pointer"}}>
          <div class="stat-label">Termine</div>
          <div class="stat-value">${openDoodles}</div>
          <div class="stat-hint">offen</div>
        </div>
        <div class="stat-card" onClick=${()=>setPage("impuls")} style=${{cursor:"pointer"}}>
          <div class="stat-label">Tages-Impuls</div>
          <div class="stat-value"><${Ic} name="impuls" size=${20}/></div>
          <div class="stat-hint">verwalten</div>
        </div>
      </div>

      ${openDoodles>0&&html`
        <div class="card">
          <div class="flex-between">
            <div class="section-title">Offene Terminvorschläge</div>
            <button class="btn btn-ghost btn-sm" onClick=${()=>setPage("doodle")}>Alle anzeigen</button>
          </div>
          ${doodles.filter(d=>d.status==="open").map(d=>html`
            <div key=${d.id} style=${{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--border)"}}>
              <div>
                <div style=${{fontWeight:700,fontSize:".88rem"}}>${d.title}</div>
                <div style=${{fontSize:".73rem",color:"var(--muted)"}}>${d.slots?.length} Zeitvorschläge · ${d.recipients?.length} Coachees</div>
              </div>
              <span class="status-pill status-open">Offen</span>
            </div>`)}
        </div>`}

      <${QuoteEditor}/>
    </div>`;
}
