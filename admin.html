// ── CHAT PAGE ──
function ChatPage({coachees,setCoachees,openId,clearOpenId,presetSender,clearPresetSender,forceListToken}) {
  const [activeId,setActiveId] = useState(null);
  const [search,setSearch] = useState("");
  const [mobileView,setMobileView] = useState("list");
  const [mobileOpen,setMobileOpen] = useState(false);
  const [chatMessages,setChatMessages] = useState([]);
  const [sender,setSender] = useState("Diana");
  const chatUnsubRef = useRef(null);

  // forceListToken (NEU, 11.08.2026): erzwingt Rücksprung zur Liste, auch wenn ChatPage
  // wegen page==="chat" bereits gemountet war und eine Einzelkonversation offen stand —
  // ein reiner setPage("chat")-Aufruf beim Push-Empfang wäre sonst ein No-Op gewesen und
  // die alte Einzelkonversation wäre fälschlich sichtbar geblieben (Rico-Meldung "Push
  // öffnet manchmal direkt einen Chat statt der Liste"). 0 = Initialwert, wird ignoriert.
  const skipFirstForceListRef = useRef(true);
  useEffect(() => {
    if(skipFirstForceListRef.current) { skipFirstForceListRef.current = false; return; }
    if(!forceListToken) return;
    if(chatUnsubRef.current) { chatUnsubRef.current(); chatUnsubRef.current = null; }
    setActiveId(null);
    setMobileOpen(false);
  }, [forceListToken]);

  // Ohne Preset (z.B. normaler Tap auf das Chat-Icon im Nav statt auf eine Home-Kachel):
  // auf den Strang mit der am längsten wartenden Nachricht springen, statt immer bei "Diana"
  // zu starten. Nur einmalig beim ersten Laden der Coachee-Liste in dieser Sitzung.
  const initialSenderSetRef = useRef(false);

  // Von der Home-Karte übernommener Diana/Rico-Filter (Kachel "X an Diana/Rico" angetippt) —
  // übernimmt den Toggle-Wert direkt beim Öffnen des Chat-Tabs.
  // Bugfix 12.08.2026 (Rico-Meldung "Diana tippen → landet im Rico-Chat"): dieser Effect setzte
  // initialSenderSetRef nie auf true. Sobald danach unreadSignature sich änderte (praktisch
  // immer, da Firestore beim Laden erst aus Cache, dann vom Server liefert), griff der
  // "älteste-Nachricht-zuerst"-Effect unten trotzdem noch einmal und überschrieb die bewusste
  // Home-Auswahl still mit dem chronologisch ältesten Strang. Fix: Ref hier ebenfalls setzen,
  // damit eine explizite Home-Auswahl nie mehr nachträglich überstimmt werden kann.
  useEffect(() => {
    if(presetSender && (presetSender==="Diana"||presetSender==="Rico")) {
      initialSenderSetRef.current = true;
      setSender(presetSender);
      if(clearPresetSender) clearPresetSender();
    }
  }, [presetSender]);
  const unreadSignature = coachees.map(c=>(c.unreadDianaOldestTs||0)+'_'+(c.unreadRicoOldestTs||0)).join(',');
  useEffect(() => {
    if(initialSenderSetRef.current || presetSender || !coachees.length) return;
    let best = null, bestTs = null;
    coachees.forEach(c => {
      [["Diana","unreadDianaOldestTs"],["Rico","unreadRicoOldestTs"]].forEach(([who,field])=>{
        const ts = c[field];
        if(ts && (bestTs===null || ts<bestTs)) { bestTs=ts; best=who; }
      });
    });
    if(best) { initialSenderSetRef.current = true; setSender(best); }
  }, [unreadSignature]);

  // Pitfall (Kapitel 64): ChatPage wird beim Seitenwechsel komplett ausgehängt
  // (${page==="chat"&&html`...`}), der Message-Listener aus selectCoachee() wurde
  // dabei aber nie abgemeldet — lief im Hintergrund unbegrenzt weiter und setzte bei
  // jeder neuen Nachricht automatisch lastRead auf den neuesten Zeitstempel, egal ob
  // die Konversation gerade sichtbar war. Dadurch galt jede Nachricht des zuletzt
  // geöffneten Coachees sofort als gelesen — Badge/Karte zeigten nie ungelesene
  // Nachrichten für genau diesen Coachee. Fix: Listener beim Unmount von ChatPage
  // zuverlässig abmelden.
  useEffect(() => {
    return () => { if(chatUnsubRef.current) { chatUnsubRef.current(); chatUnsubRef.current = null; } };
  }, []);

  const [showFilter,setShowFilter]       = useState(false);
  const [filterCat,setFilterCat]         = useState(null);
  const [showBroadcast,setShowBroadcast] = useState(false);
  const [broadcastCat,setBroadcastCat]   = useState([]);
  const [broadcastMsg,setBroadcastMsg]   = useState("");
  const [broadcastRecip,setBroadcastRecip]           = useState([]);
  const [broadcastCatModeActive,setBroadcastCatModeActive] = useState(false);
  const [broadcastSearch,setBroadcastSearch]         = useState("");
  const filtered = coachees.filter(c=>{
    const nameMatch = (c.name||"").toLowerCase().includes(search.toLowerCase())||(c.topic||"").toLowerCase().includes(search.toLowerCase());
    if(!filterCat||filterCat==="Alle") return nameMatch;
    const cats = [...(Array.isArray(c.coaching)?c.coaching:(c.coaching?[c.coaching]:[])), ...(Array.isArray(c.gender)?c.gender:(c.gender?[c.gender]:[])), ...(c.categories||[])];
    return nameMatch && catMatches(cats, filterCat);
  });
  // Zwei getrennte Blöcke statt einer einzigen, sender-abhängigen Liste — sonst verschwindet
  // beim Öffnen über einen Diana- oder Rico-Push die jeweils andere wartende Nachricht
  // komplett aus dem Blick (Rico-Meldung 11.08.2026).
  const dianaWaiting = filtered.filter(c=>c.unreadDianaOldestTs).sort((a,b)=>a.unreadDianaOldestTs-b.unreadDianaOldestTs);
  const ricoWaiting = filtered.filter(c=>c.unreadRicoOldestTs).sort((a,b)=>a.unreadRicoOldestTs-b.unreadRicoOldestTs);
  const restCoachees = filtered.filter(c=>!c.unreadDianaOldestTs && !c.unreadRicoOldestTs);
  const active = coachees.find(c=>c.id===activeId);
  const filterCount = filterCat&&filterCat!=="Alle" ? coachees.filter(c=>{const cats=[...(Array.isArray(c.coaching)?c.coaching:(c.coaching?[c.coaching]:[])), ...(Array.isArray(c.gender)?c.gender:(c.gender?[c.gender]:[])), ...(c.categories||[])]; return catMatches(cats, filterCat);}).length : coachees.length;
  const getCatCoachees = cat => !cat ? coachees : coachees.filter(c=>{const cats=[...(Array.isArray(c.coaching)?c.coaching:(c.coaching?[c.coaching]:[])), ...(Array.isArray(c.gender)?c.gender:(c.gender?[c.gender]:[])), ...(c.categories||[])]; return catMatches(cats, cat);});
  // Empfänger sind seit Kapitel 101 einzeln an-/abwählbar (Checkbox-Liste, analog Termin-Set
  // Kapitel 98) — broadcastRecip ist die Quelle der Wahrheit, Zielgruppen-Buttons setzen sie nur vor.
  const broadcastRecipients = coachees.filter(c=>broadcastRecip.includes(c.id));
  const toggleBroadcastCat = cat => {
    setBroadcastCatModeActive(true);
    setBroadcastCat(prev=>{
      const next = cat===null ? [] : (prev.includes(cat)?prev.filter(x=>x!==cat):[...prev,cat]);
      const matching = next.length===0 ? coachees : coachees.filter(c=>{
        const cats=[...(Array.isArray(c.coaching)?c.coaching:(c.coaching?[c.coaching]:[])), ...(Array.isArray(c.gender)?c.gender:(c.gender?[c.gender]:[])), ...(c.categories||[])];
        return next.some(sel=>catMatches(cats, sel));
      });
      setBroadcastRecip(matching.map(c=>c.id));
      return next;
    });
  };
  const toggleManualBroadcastRecip = id => {
    setBroadcastCatModeActive(false);
    setBroadcastRecip(r=>r.includes(id)?r.filter(x=>x!==id):[...r,id]);
  };
  const sendBroadcast = () => {
    if(!broadcastMsg.trim()||!broadcastRecipients.length) return;
    const firestore = db();
    const now = new Date();
    const t = now.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
    const d = dateKeyFromTs(now.getTime());
    const recipientsSnapshot = [...broadcastRecipients];
    const textToSend = broadcastMsg.trim();
    setBroadcastMsg(""); setBroadcastCat([]); setBroadcastRecip([]); setBroadcastCatModeActive(false); setBroadcastSearch(""); setShowBroadcast(false);
    if(!firestore){ showToast("✗ Keine Verbindung zur Datenbank"); return; }
    const jobs = recipientsSnapshot.map(c=>{
      const msg={from:"admin",sender:"Diana",recipient:c.id,text:textToSend,time:t,date:d,ts:Date.now(),seen:false};
      return firestore.collection("chats").doc(c.id).collection("messages").add(msg);
    });
    Promise.allSettled(jobs).then(results=>{
      const failed = results.filter(r=>r.status==="rejected").length;
      if(failed===0){
        showToast("✓ Nachricht gesendet an "+recipientsSnapshot.length+" Coachee"+(recipientsSnapshot.length!==1?"s":""));
      } else {
        showToast("✗ "+failed+" von "+recipientsSnapshot.length+" Nachricht"+(recipientsSnapshot.length!==1?"en":"")+" fehlgeschlagen");
      }
    });
  };

    const selectCoachee = (id, who) => {
    const activeWho = who || sender;
    setActiveId(id);
    setChatMessages([]);
    setMobileOpen(true);
    const firestore = db();
    // lastRead nur für den aktuell aktiven Strang (Diana/Rico) setzen — der jeweils andere
    // Strang desselben Coachees bleibt unberührt, siehe Kapitel zu getrennten Unread-Zählern.
    // Fix 24.08.2026 (geräteübergreifende Sync): landet jetzt in Firestore statt localStorage,
    // siehe Kommentar beim Unread-Listener weiter oben.
    if(firestore) firestore.collection("chats").doc(id).collection("adminMeta").doc("read")
      .set({['lastRead'+activeWho]:Date.now(), ['manualUnread'+activeWho]:null}, {merge:true}).catch(()=>{});
    if(chatUnsubRef.current) { chatUnsubRef.current(); chatUnsubRef.current=null; }
    if(firestore && id) {
      const ref = firestore.collection("chats").doc(id).collection("messages").orderBy("ts","asc").limitToLast(80);
      chatUnsubRef.current = ref.onSnapshot(snap=>{
        const msgs = snap.docs.map(d=>({id:d.id,...d.data()}));
        setChatMessages(msgs);
        // lastRead des aktiven Strangs auf dessen jüngste Nachricht setzen → nur dieser Strang wird 0
        const threadMsgs = msgs.filter(m=>(m.from==="admin"?(m.sender||"Diana"):(m.recipient||"Diana"))===activeWho);
        if(threadMsgs.length) {
          const maxTs = Math.max(...threadMsgs.map(m=>m.ts||0));
          firestore.collection("chats").doc(id).collection("adminMeta").doc("read")
            .set({['lastRead'+activeWho]:maxTs}, {merge:true}).catch(()=>{});
        }
        const field = activeWho==="Rico" ? "unreadRico" : "unreadDiana";
        const oldestField = activeWho==="Rico" ? "unreadRicoOldestTs" : "unreadDianaOldestTs";
        setCoachees(cs=>cs.map(c=>{
          if(c.id!==id) return c;
          const updated = {...c,[field]:0,[oldestField]:null};
          updated.unread = (updated.unreadDiana||0)+(updated.unreadRico||0);
          return updated;
        }));
      }, ()=>{});
    }
  };

  // "Als ungelesen markieren" — wird vom Button im offenen Chat aufgerufen (siehe ChatWindow).
  // Rührt lastRead nicht an. Landet in Firestore (chats/{id}/adminMeta/read) statt localStorage,
  // damit die Markierung auf allen Admin-Geräten gleichzeitig sichtbar ist (siehe Kommentar beim
  // Unread-Listener weiter oben). Bewusst kein Un-Markieren-Zweig: Aufräumen passiert wie bei
  // echtem Unread nur durch erneutes Öffnen des Strangs (siehe selectCoachee()/sender-Effect oben).
  const markManualUnread = (id, who, name) => {
    const firestore = db();
    if(firestore) firestore.collection("chats").doc(id).collection("adminMeta").doc("read")
      .set({['manualUnread'+who]:Date.now()}, {merge:true}).catch(()=>{});
    const field = who==="Rico" ? "unreadRico" : "unreadDiana";
    const oldestField = who==="Rico" ? "unreadRicoOldestTs" : "unreadDianaOldestTs";
    setCoachees(cs=>cs.map(c=>{
      if(c.id!==id) return c;
      const updated = {...c,[field]:Math.max(c[field]||0,1),[oldestField]:c[oldestField]||Date.now()};
      updated.unread = (updated.unreadDiana||0)+(updated.unreadRico||0);
      return updated;
    }));
    showToast("✓ \""+name+"\" liegt jetzt bei \"An "+who+"\"");
  };

  // Schaltet man innerhalb eines bereits geöffneten Chats zwischen Diana/Rico um, muss der neu
  // aktive Strang ebenfalls als gelesen markiert werden — der obige onSnapshot-Listener in
  // selectCoachee() hält sonst den `sender`-Wert vom Zeitpunkt des Öffnens fest (Closure).
  useEffect(() => {
    if(!activeId || !chatMessages.length) return;
    const firestore = db();
    const threadMsgs = chatMessages.filter(m=>(m.from==="admin"?(m.sender||"Diana"):(m.recipient||"Diana"))===sender);
    const maxTs = threadMsgs.length ? Math.max(...threadMsgs.map(m=>m.ts||0)) : Date.now();
    if(firestore) firestore.collection("chats").doc(activeId).collection("adminMeta").doc("read")
      .set({['lastRead'+sender]:maxTs, ['manualUnread'+sender]:null}, {merge:true}).catch(()=>{});
    const field = sender==="Rico" ? "unreadRico" : "unreadDiana";
    const oldestField = sender==="Rico" ? "unreadRicoOldestTs" : "unreadDianaOldestTs";
    setCoachees(cs=>cs.map(c=>{
      if(c.id!==activeId) return c;
      const updated = {...c,[field]:0,[oldestField]:null};
      updated.unread = (updated.unreadDiana||0)+(updated.unreadRico||0);
      return updated;
    }));
  }, [sender]);

  // Push-Deep-Link (#chat-<uid>): öffnet automatisch die passende Coachee-Konversation,
  // sobald sowohl openId als auch die coachees-Liste (Firestore-Listener, kann nach dem
  // Mount noch nachladen) verfügbar sind. clearOpenId() danach, damit ein erneutes Öffnen
  // derselben Seite (z.B. manueller Klick auf einen anderen Coachee) nicht wieder überschrieben wird.
  useEffect(() => {
    if(openId && coachees.some(c=>c.id===openId)) {
      selectCoachee(openId);
      if(clearOpenId) clearOpenId();
    }
  }, [openId, coachees]);

  const sendMsg = (text, sender="Diana") => {
    if(!text.trim()||!activeId) return;
    const firestore = db();
    const now = new Date();
    const t = now.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
    const d = dateKeyFromTs(now.getTime());
    const msg={from:"admin",sender,recipient:activeId,text:text.trim(),time:t,date:d,ts:Date.now(),seen:false};
    if(firestore) {
      firestore.collection("chats").doc(activeId).collection("messages").add(msg).catch(()=>{});
      // Signal für Coachee-Push (wird von SW abgeholt wenn App im Hintergrund)
      firestore.collection("users").doc(activeId).update({ pushNeeded: true, pushMsg: text.trim().slice(0,80), pushTs: Date.now() }).catch(()=>{});
    }
  };

  const sendImg = (dataUrl, isVideo=false, sender="Diana") => {
    if(!activeId) return;
    const firestore = db();
    const now = new Date();
    const t = now.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
    const d = dateKeyFromTs(now.getTime());
    const msg={from:"admin",sender,recipient:activeId,imgSrc:dataUrl,isVideo,text:"",time:t,date:d,ts:Date.now()};
    if(firestore) firestore.collection("chats").doc(activeId).collection("messages").add(msg).catch(e=>showToast("✗ Senden fehlgeschlagen: " + e.message));
  };
  const sendFile = async (file, sender="Diana") => {
    if(!activeId) return;
    const firestore = db();
    if(!firestore) return;
    const fbStorage = window._fb?.storage;
    const now = new Date();
    const t = now.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
    const d = dateKeyFromTs(now.getTime());
    try {
      let fileData = file;
      if(fbStorage && file.url && file.url.startsWith('data:')) {
        // Base64 → Blob → Storage hochladen (analog Coachee-App)
        const resp = await fetch(file.url);
        const blob = await resp.blob();
        const path = 'chats/'+activeId+'/'+Date.now()+'_'+file.name;
        const ref  = fbStorage.ref(path);
        await ref.put(blob, {contentType: file.type || blob.type});
        const downloadUrl = await ref.getDownloadURL();
        fileData = {name: file.name, type: file.type, size: file.size||blob.size, isAudio: file.isAudio||false, url: downloadUrl, storagePath: path};
      }
      const msg={from:"admin",sender,recipient:activeId,file:fileData,text:"",time:t,date:d,ts:Date.now()};
      await firestore.collection("chats").doc(activeId).collection("messages").add(msg);
    } catch(e) { showToast("✗ Senden fehlgeschlagen: " + e.message); }
  };

  return html`
    <div style=${{display:"flex",flexDirection:"column",width:"100%",flex:1,minHeight:0,overflow:"hidden",height:"100%"}}>
      ${!mobileOpen
        ? html`
          <div style=${{display:"flex",flexDirection:"column",width:"100%",flex:1,minHeight:0,overflow:"hidden",height:"100%"}}>
            <div class="chat-list-header">
              <div style=${{display:"flex",alignItems:"center",gap:14,marginBottom:8}}>
                <${Logo} size=${52}/>
                <div>
                  <div style=${{fontFamily:"'Manuale',serif",fontSize:"1.3rem",fontWeight:700,color:"var(--text)"}}>Nachrichten</div>
                  <div style=${{fontSize:".88rem",color:"var(--muted)",marginTop:2}}>Gespräche mit Coachees</div>
                </div>
              </div>
              <div class="search-wrap">
                <span class="search-icon"><${Ic} name="search" size=${14}/></span>
                <input class="search-input" value=${search} onInput=${e=>setSearch(e.target.value)} placeholder="Coachee suchen…"/>
              </div>
              <div onClick=${()=>{setShowBroadcast(true);setBroadcastRecip(coachees.map(c=>c.id));}} style=${{display:"flex",alignItems:"center",gap:10,marginTop:8,background:"var(--sage-pale)",border:"1px solid var(--border)",borderRadius:10,padding:"9px 12px",cursor:"pointer"}}>
                <div style=${{width:30,height:30,borderRadius:8,background:"var(--teal)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <${Ic} name="send" size=${14} style=${{color:"#fff"}}/>
                </div>
                <div style=${{flex:1,minWidth:0}}>
                  <div style=${{fontSize:".82rem",fontWeight:700,color:"var(--forest)",fontFamily:"'Exo 2',sans-serif"}}>Neue Nachricht an Zielgruppe</div>
                  <div style=${{fontSize:".72rem",color:"var(--muted)",marginTop:1}}>Paare · Eltern · Einzel · Männer · Frauen · Alle</div>
                </div>
                <${Ic} name="chevron" size=${14} style=${{color:"var(--muted)",transform:"rotate(-90deg)",flexShrink:0}}/>
              </div>
            </div>
            ${showBroadcast&&h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.35)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"},onClick:e=>{if(e.target===e.currentTarget){setShowBroadcast(false);setBroadcastCat([]);setBroadcastMsg("");setBroadcastRecip([]);setBroadcastCatModeActive(false);setBroadcastSearch("");}}},
              h("div",{style:{background:"var(--surface)",borderRadius:"20px 20px 0 0",padding:"20px 18px 24px",width:"100%",maxWidth:480,maxHeight:"85vh",overflowY:"auto"}},
                h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}},
                  h("span",{style:{fontFamily:"'Manuale',serif",fontSize:"1.1rem",fontWeight:700,color:"var(--text)"}},"Neue Nachricht"),
                  h("button",{onClick:()=>{setShowBroadcast(false);setBroadcastCat([]);setBroadcastMsg("");setBroadcastRecip([]);setBroadcastCatModeActive(false);setBroadcastSearch("");},style:{background:"none",border:"none",cursor:"pointer",color:"var(--muted)",fontSize:"1.2rem"}},"✕")
                ),
                h("p",{style:{fontSize:".8rem",color:"var(--muted)",marginBottom:14,marginTop:2}},"Wähle eine Zielgruppe — die App selektiert automatisch."),
                h("p",{style:{fontSize:".72rem",fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}},"1 — Zielgruppe"),
                h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}},
                  ...["Paare","Einzel","Eltern","Männer","Frauen"].map(cat=>
                    h("div",{key:cat,
                      onClick:()=>toggleBroadcastCat(cat),
                      style:{height:40,borderRadius:9,border:"1.5px solid "+(broadcastCatModeActive&&broadcastCat.includes(cat)?"var(--teal)":"var(--border2)"),background:broadcastCatModeActive&&broadcastCat.includes(cat)?"var(--teal)":"var(--surface)",color:broadcastCatModeActive&&broadcastCat.includes(cat)?"#fff":"var(--text)",fontSize:".82rem",fontWeight:700,fontFamily:"'Exo 2',sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:6,cursor:"pointer",position:"relative"}},
                      cat,
                      broadcastCatModeActive&&broadcastCat.includes(cat)&&h("span",{style:{position:"absolute",top:3,right:6,fontSize:10,color:"var(--teal)"}},"✓")
                    )
                  ),
                  h("div",{key:"Alle",
                    onClick:()=>toggleBroadcastCat(null),
                    style:{height:40,borderRadius:9,border:"1.5px solid "+(broadcastCatModeActive&&broadcastCat.length===0?"var(--teal)":"var(--border2)"),background:broadcastCatModeActive&&broadcastCat.length===0?"var(--teal)":"var(--surface)",color:broadcastCatModeActive&&broadcastCat.length===0?"#fff":"var(--text)",fontSize:".82rem",fontWeight:700,fontFamily:"'Exo 2',sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:6,cursor:"pointer",gridColumn:"1 / -1"}},
                    "Alle"
                  )
                ),
                h("p",{style:{fontSize:".72rem",fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:2}},"2 — Empfänger"),
                h("p",{style:{fontSize:".74rem",color:"var(--muted)",marginTop:0,marginBottom:8}},broadcastRecipients.length+" Coachee"+(broadcastRecipients.length!==1?"s":"")+" ausgewählt"),
                h("div",{style:{position:"relative",marginBottom:8}},
                  h("div",{style:{position:"absolute",left:11,top:0,bottom:0,display:"flex",alignItems:"center",color:"var(--muted)",pointerEvents:"none"}},h(Ic,{name:"search",size:15})),
                  h("input",{class:"input",type:"text",value:broadcastSearch,onInput:e=>setBroadcastSearch(e.target.value),placeholder:"Coachee suchen…",style:{paddingLeft:34,width:"100%",boxSizing:"border-box"}})
                ),
                h("div",{style:{maxHeight:220,overflowY:"auto",marginBottom:14}},
                  ...coachees.filter(c=>c.name.toLowerCase().includes(broadcastSearch.trim().toLowerCase())).map(c=>{
                    const sel = broadcastRecip.includes(c.id);
                    return h("label",{key:c.id,style:{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:10,cursor:"pointer",marginBottom:6,border:"1.5px solid "+(sel?"var(--teal)":"var(--border2)"),background:sel?"var(--sage-pale)":"var(--surface)",userSelect:"none"}},
                      h("input",{type:"checkbox",checked:sel,onChange:()=>toggleManualBroadcastRecip(c.id),style:{width:20,height:20,accentColor:"var(--teal)",cursor:"pointer",flexShrink:0}}),
                      h("div",{style:{width:34,height:34,borderRadius:"50%",background:c.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:".7rem",fontWeight:700,color:"#fff",flexShrink:0}},c.initials),
                      h("span",{style:{fontSize:".9rem",fontWeight:sel?600:400,color:"var(--text)"}},c.name)
                    );
                  }),
                  broadcastSearch.trim()&&coachees.filter(c=>c.name.toLowerCase().includes(broadcastSearch.trim().toLowerCase())).length===0&&h("div",{style:{fontSize:".82rem",color:"var(--muted)",padding:"8px 2px"}},"Keine Coachees gefunden.")
                ),
                h("p",{style:{fontSize:".72rem",fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:6}},"3 — Nachricht"),
                h("textarea",{class:"textarea",rows:3,placeholder:"Nachricht verfassen…",value:broadcastMsg,onInput:e=>setBroadcastMsg(e.target.value),style:{width:"100%",marginBottom:10,boxSizing:"border-box",resize:"none"}}),
                h("button",{onClick:sendBroadcast,disabled:!broadcastMsg.trim()||broadcastRecipients.length===0,class:"btn btn-primary",style:{width:"100%",opacity:(!broadcastMsg.trim()||broadcastRecipients.length===0)?0.5:1}},
                  "An "+broadcastRecipients.length+" Coachee"+(broadcastRecipients.length!==1?"s":"")+" senden"
                )
              )
            )}
            <div class="conv-list" style=${{flex:1,overflowY:"auto"}}>
              ${(dianaWaiting.length>0||ricoWaiting.length>0)&&html`<div style=${{marginBottom:26}}>
                ${dianaWaiting.length>0&&html`<div style=${{marginBottom:ricoWaiting.length>0?12:0}}>
                  <div style=${{fontSize:".72rem",fontWeight:700,color:"#1d5a8f",textTransform:"uppercase",letterSpacing:".04em",marginBottom:6}}>An Diana</div>
                  <div style=${{display:"flex",flexDirection:"column",gap:6}}>
                    ${dianaWaiting.map(c=>html`<div key=${"d-"+c.id}
                      style=${{background:"#e0f5ee",borderRadius:9,padding:"12px 14px",display:"flex",
                        justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}
                      onClick=${()=>{setSender("Diana");selectCoachee(c.id,"Diana");}}>
                      <span style=${{fontWeight:700,fontSize:".92rem"}}>${c.name}</span>
                      <span style=${{fontSize:".8rem",color:"#1d5a8f",fontWeight:700}}>${new Date(c.unreadDianaOldestTs).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})}</span>
                    </div>`)}
                  </div>
                </div>`}
                ${ricoWaiting.length>0&&html`<div>
                  <div style=${{fontSize:".72rem",fontWeight:700,color:"#3b6d11",textTransform:"uppercase",letterSpacing:".04em",marginBottom:6}}>An Rico</div>
                  <div style=${{display:"flex",flexDirection:"column",gap:6}}>
                    ${ricoWaiting.map(c=>html`<div key=${"r-"+c.id}
                      style=${{background:"#e9f3dd",borderRadius:9,padding:"12px 14px",display:"flex",
                        justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}
                      onClick=${()=>{setSender("Rico");selectCoachee(c.id,"Rico");}}>
                      <span style=${{fontWeight:700,fontSize:".92rem"}}>${c.name}</span>
                      <span style=${{fontSize:".8rem",color:"#3b6d11",fontWeight:700}}>${new Date(c.unreadRicoOldestTs).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})}</span>
                    </div>`)}
                  </div>
                </div>`}
              </div>`}
              <div style=${{borderTop:(dianaWaiting.length>0||ricoWaiting.length>0)?"1px solid var(--border)":"none",
                paddingTop:(dianaWaiting.length>0||ricoWaiting.length>0)?8:0,marginBottom:8}}>
                <div style=${{fontSize:".72rem",fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".04em"}}>Kontakte</div>
              </div>
              ${restCoachees.map(c=>{
                return html`
                <div key=${c.id} class=${"conv-row"+(activeId===c.id?" active":"")}
                  style=${activeId===c.id?{background:"var(--surface2)"}:{}}
                  onClick=${()=>selectCoachee(c.id)}>
                  <div class="conv-info">
                    <div class="conv-name">${c.name}</div>
                    <div class="conv-preview">${c.topic}</div>
                  </div>
                </div>`;
              })}
            </div>
          </div>`
        : html`
          <div style=${{display:"flex",flexDirection:"column",width:"100%",flex:1,minHeight:0,overflow:"hidden"}}>
            ${active
              ? html`<${ChatWindow} coachee=${{...active,messages:chatMessages}} sender=${sender} setSender=${setSender} onSend=${sendMsg} onSendImg=${sendImg} onSendFile=${sendFile} onDeleteMsg=${async id=>{ const fs=db(); if(fs&&activeId) await fs.collection("chats").doc(activeId).collection("messages").doc(id).delete().catch(()=>{}); }} setLightbox=${()=>{}} onBack=${()=>{ if(chatUnsubRef.current){ chatUnsubRef.current(); chatUnsubRef.current=null; } setMobileOpen(false); }} onMarkUnread=${()=>{ markManualUnread(activeId,sender,active.name); if(chatUnsubRef.current){ chatUnsubRef.current(); chatUnsubRef.current=null; } setMobileOpen(false); }} mobileOpen=${true}/>`
              : html`<div style=${{display:"flex",alignItems:"center",justifyContent:"center",flex:1,flexDirection:"column",gap:12,color:"var(--muted)"}}>
                  <${Logo} size=${60}/>
                  <div style=${{fontFamily:"'Manuale',serif",fontSize:"1.1rem"}}>Wähle ein Gespräch</div>
                </div>`}
          </div>`}
    </div>
  `
}

function ChatWindow({coachee,sender,setSender,onSend,onSendImg,onSendFile,onDeleteMsg,onBack,onMarkUnread,mobileOpen}) {
  const [input,setInput]         = useState("");
  const [lightbox,setLightbox]   = useState(null);
  const [videoLightbox,setVideoLightbox] = useState(null);
  const [recording,setRecording]   = useState(false);
  const [fileViewer,setFileViewer]   = useState(null);
  const [showCamMenu,setShowCamMenu] = useState(false);
  const [msgMenu,setMsgMenu]       = useState(null);
  const bottomRef  = useRef(null);
  const textRef    = useRef(null);
  const chatImgRef = useRef(null);
  const attachRef  = useRef(null);
  const mediaRecRef = useRef(null);
  const chunksRef  = useRef([]);
  const longPressRef = useRef(null);

  const startLongPress = (msg, e) => {
    const touch = e.touches?.[0] || e;
    const x = touch.clientX; const y = touch.clientY;
    longPressRef.current = setTimeout(() => {
      setMsgMenu({id: msg.id, x, y, mine: msg.from==="admin", text: msg.text||""});
      if(navigator.vibrate) navigator.vibrate(30);
    }, 500);
  };
  const cancelLongPress = () => { if(longPressRef.current) clearTimeout(longPressRef.current); };
  const handleDeleteMsg = async () => {
    if(!msgMenu) return;
    const id = msgMenu.id;
    setMsgMenu(null);
    if(onDeleteMsg) await onDeleteMsg(id);
  };
  const handleCopyMsg = async () => {
    if(!msgMenu) return;
    const text = msgMenu.text || "";
    setMsgMenu(null);
    try { await navigator.clipboard.writeText(text); showToast("✓ Text kopiert"); }
    catch(e) { showToast("✗ Kopieren nicht möglich"); }
  };

  // Beim Öffnen eines Coachee-Chats (auch beim Wechsel zwischen Coachees) sofort ohne
  // Animation ans Ende springen — "smooth" allein liess Diana/Rico manchmal mitten in der
  // Historie landen statt bei der neuesten Nachricht, besonders bei langen Verläufen.
  // coachee.id UND sender als Trigger: sowohl Coachee-Wechsel als auch Diana/Rico-Tab-Wechsel
  // gelten als "neu öffnen" → kein Smooth-Scroll, sondern sofortiger Sprung ans Ende. Vorher
  // fehlte sender in den Dependencies — beim reinen Tab-Wechsel (gleicher Coachee, gleiche
  // Gesamt-Nachrichtenzahl) feuerte der Effekt dadurch gar nicht.
  const lastCoacheeIdRef = useRef(null);
  const lastSenderRef = useRef(sender);
  useEffect(()=>{
    const isNewChat = lastCoacheeIdRef.current !== coachee.id || lastSenderRef.current !== sender;
    bottomRef.current?.scrollIntoView({behavior: isNewChat ? "auto" : "smooth"});
    lastCoacheeIdRef.current = coachee.id;
    lastSenderRef.current = sender;
  },[coachee.messages.length, coachee.id, sender]);

  const filteredMessages = coachee.messages.filter(msg => {
    const ctx = msg.from==="admin" ? (msg.sender||"Diana") : (msg.recipient||"Diana");
    return ctx===sender;
  });

  const groups = filteredMessages.reduce((acc,msg)=>{
    const key = msg.ts ? dateKeyFromTs(msg.ts) : dateKeyFromTs(Date.now());
    if(!acc[key])acc[key]=[];
    acc[key].push(msg);
    return acc;
  },{});
  const groupsSorted = Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0]));

  const handleSend = () => { if(!input.trim())return; onSend(input,sender); setInput(""); if(textRef.current){textRef.current.style.height='auto'; textRef.current.style.overflowY='hidden';} };
  const handleKey  = e => {
    const isTouchOnly = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    if(e.key==="Enter"&&!e.shiftKey&&!isTouchOnly){e.preventDefault();handleSend();}
  };

  const handleChatImg = async e => {
    const files = e.target.files; if(!files||!files[0])return;
    for(let i=0;i<files.length;i++){
      const f=files[i];
      if(f.type.startsWith("video/")) {
        // For video: store blob URL directly (iOS can play blob URLs)
        const blobUrl = URL.createObjectURL(f);
        onSendImg(blobUrl, true, sender);
      } else {
        onSendImg(await readFile(f), false, sender);
      }
    }
    setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),50);
  };

  const handleAttach = async e => {
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{ onSendFile({url:ev.target.result,name:f.name,type:f.type,size:f.size,isAudio:false},sender); };
    r.readAsDataURL(f); e.target.value="";
  };

  const startRecording = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const mr = new MediaRecorder(stream);
      mediaRecRef.current = mr; chunksRef.current = [];
      mr.ondataavailable = ev => chunksRef.current.push(ev.data);
      mr.onstop = () => {
        const rawBlob = new Blob(chunksRef.current,{type: mr.mimeType || "audio/webm"});
        stream.getTracks().forEach(t=>t.stop());
        const sendAsDataUrl = (blob, name, type) => {
          const rdr = new FileReader();
          rdr.onload = ev2 => onSendFile({url:ev2.target.result,name,type,isAudio:true},sender);
          rdr.readAsDataURL(blob);
        };
        // Immer zu WAV re-encoden (Pitfall 36) — iOS-Safari-Coachees können den
        // ursprünglichen Aufnahme-Container (meist webm/ogg von Desktop-Browsern) sonst
        // nicht abspielen. Bei Dekodierfehler Fallback auf Original-Format.
        const arrReader = new FileReader();
        arrReader.onload = ev => {
          try {
            const ctx = new (window.AudioContext||window.webkitAudioContext)();
            ctx.decodeAudioData(ev.target.result.slice(0), decoded => {
              const wavBlob = encodeWav(decoded);
              ctx.close();
              sendAsDataUrl(wavBlob,"Sprachmemo.wav","audio/wav");
            }, () => sendAsDataUrl(rawBlob,"Sprachmemo."+(rawBlob.type.includes("mp4")?"m4a":"webm"),rawBlob.type||"audio/webm"));
          } catch(e) {
            sendAsDataUrl(rawBlob,"Sprachmemo."+(rawBlob.type.includes("mp4")?"m4a":"webm"),rawBlob.type||"audio/webm");
          }
        };
        arrReader.readAsArrayBuffer(rawBlob);
      };
      mr.start(); setRecording(true);
    } catch(err) { alert("Mikrofon-Zugriff nicht möglich."); }
  };

  const stopRecording = () => {
    if(mediaRecRef.current&&recording){ mediaRecRef.current.stop(); setRecording(false); }
  };

  const openFile = file => {
    try {
      const arr=file.url.split(","); const mime=arr[0].match(/:(.*?);/)[1];
      const bstr=atob(arr[1]); let n=bstr.length; const u8=new Uint8Array(n);
      while(n--)u8[n]=bstr.charCodeAt(n);
      const blob=new Blob([u8],{type:mime});
      const blobUrl=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=blobUrl; a.target="_blank"; a.rel="noopener";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(blobUrl),30000);
    } catch(e){ window.open(file.url,"_blank"); }
  };

  return html`
    <div class="chat-area">
      <div class="chat-topbar" style=${{padding:"18px 14px 22px",display:"flex",flexDirection:"column",alignItems:"stretch",gap:8}}>
        <div style=${{display:"flex",alignItems:"center",gap:10,width:"100%",flexShrink:"0"}}>
          <button onClick=${onBack} style=${{background:"none",border:"none",cursor:"pointer",
            display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px 0 0",color:"var(--text)"}}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div style=${{flex:1,minWidth:0}}>
            <div class="ct-name">${coachee.name}</div>
            <div class="ct-status">
              <span class=${"status-dot"+(coachee.online?"":" off")}/>
              ${coachee.online?"Online":(coachee.lastSeen?("Zuletzt: "+fmtDate(coachee.lastSeen)):"Aktiv")} · ${coachee.topic}
            </div>
          </div>
        </div>
        <div style=${{display:"flex",gap:8,width:"100%",flexShrink:"0"}}>
          ${["Diana","Rico"].map(name=>h("button",{
            key:name,
            onClick:()=>setSender(name),
            style:{flex:"1 1 0",height:"40px",maxHeight:"40px",flexShrink:"0",display:"flex",alignItems:"center",
              justifyContent:"center",gap:"7px",padding:"8px 18px",
              border:"1.5px solid "+(sender===name?(name==="Rico"?"#3b6d11":"#1d5a8f"):"var(--border2)"),
              borderRadius:"10px",
              background:sender===name?(name==="Rico"?"#e9f3dd":"#e0f5ee"):"transparent",
              color:sender===name?(name==="Rico"?"#3b6d11":"#1d5a8f"):"var(--muted)",
              fontFamily:"'Exo 2',sans-serif",fontSize:".83rem",fontWeight:700,
              cursor:"pointer",transition:"all .18s"}
          }, h(Ic,{name:"user",size:15}), " "+name))}
        </div>
        <button onClick=${onMarkUnread} style=${{width:"100%",height:"40px",maxHeight:"40px",flexShrink:"0",display:"flex",
          alignItems:"center",justifyContent:"center",borderRadius:9,cursor:"pointer",
          border:"1.5px solid "+(sender==="Rico"?"#3b6d11":"#1d5a8f"),
          background:sender==="Rico"?"#e9f3dd":"#e0f5ee",
          color:sender==="Rico"?"#3b6d11":"#1d5a8f",
          fontFamily:"'Exo 2',sans-serif",fontSize:".78rem",fontWeight:700}}>
          Als ungelesen markieren
        </button>
      </div>

      <div class="messages">
        ${groupsSorted.map(([date,msgs])=>html`
          <div key=${date}>
            <div class="date-divider">${formatDateKey(date)}</div>
            ${msgs.map((msg,i)=>{
              const isOut = msg.from==="admin";
              const isSelected = msgMenu?.id === msg.id;
              // Coachee-Nachrichten: sender=uid → coachee.name verwenden
              const rawSender = msg.sender||(isOut?"Diana":"");
              const prevSame = i>0&&msgs[i-1].from===msg.from&&((msgs[i-1].sender||(msgs[i-1].from==="admin"?"Diana":"")))===(msg.sender||(isOut?"Diana":""));
              const avatarColor = isOut ? (rawSender==="Rico" ? "#3b6d11" : "#1d5a8f") : "var(--teal)";
              const bubbleBg = rawSender==="Rico" ? "#e9f3dd" : "#e0f5ee";
              const row = html`
                <div key=${msg.id} class=${"msg-row "+(isOut?"out":"in")}
                  style=${{marginBottom:prevSame?1:8,alignItems:"flex-end",userSelect:"none"}}
                  onTouchStart=${e=>startLongPress(msg,e)}
                  onTouchEnd=${cancelLongPress}
                  onTouchMove=${cancelLongPress}
                  onMouseDown=${e=>startLongPress(msg,e)}
                  onMouseUp=${cancelLongPress}
                  onMouseLeave=${cancelLongPress}>
                  <div class="msg-bubble-wrap">
                    <div class="msg-bubble" style=${{
                        ...(isOut?{background:bubbleBg,color:avatarColor,border:"none"}:{}),
                        ...(isSelected?{transform:"scale(1.035)",boxShadow:"0 6px 18px rgba(0,0,0,.18)",position:"relative",zIndex:99995}:{})
                      }}>
                      ${msg.imgSrc&&!msg.isVideo&&html`<div class="msg-img-wrap"><img src=${msg.imgSrc} class="msg-img" alt="Foto" onClick=${()=>setLightbox(msg.imgSrc)}/></div>`}
                      ${msg.imgSrc&&msg.isVideo&&html`<div class="msg-img-wrap">
                        <div onClick=${()=>setVideoLightbox(msg.imgSrc)}
                          style=${{width:220,borderRadius:12,overflow:"hidden",background:"var(--forest)",
                            cursor:"pointer",display:"flex",alignItems:"center",gap:10,padding:"10px 12px"}}>
                          <div style=${{width:44,height:44,borderRadius:8,background:"rgba(255,255,255,.12)",
                            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7">
                              <polygon points="23 7 16 12 23 17 23 7"/>
                              <rect x="1" y="5" width="15" height="14" rx="2"/>
                            </svg>
                          </div>
                          <div style=${{flex:1,minWidth:0}}>
                            <div style=${{fontSize:".82rem",fontWeight:700,color:"white"}}>Video</div>
                            <div style=${{fontSize:".72rem",color:"rgba(255,255,255,.55)"}}>Tippen zum Abspielen</div>
                          </div>
                          <div style=${{width:30,height:30,borderRadius:"50%",background:"rgba(255,255,255,.15)",
                            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="white" stroke="none">
                              <polygon points="6,3 20,12 6,21"/>
                            </svg>
                          </div>
                        </div>
                      </div>`}
                      ${msg.file&&msg.file.isAudio&&html`
                        <div style=${{padding:"2px 0"}}>
                          <audio controls=${true} src=${msg.file.url}
                            style=${{height:34,maxWidth:220,borderRadius:20,display:"block"}}></audio>
                          <div style=${{fontSize:".68rem",opacity:.6,marginTop:3}}>Sprachmemo</div>
                        </div>`}
                      ${msg.file&&!msg.file.isAudio&&html`
                        <div onClick=${()=>openFile(msg.file)}
                          style=${{display:"flex",alignItems:"center",gap:8,cursor:"pointer",
                            padding:"6px 10px",background:"rgba(255,255,255,.15)",borderRadius:8,minWidth:160}}>
                          <${Ic} name="file" size=${20} style=${{flexShrink:0,opacity:.8}}/>
                          <div style=${{minWidth:0}}>
                            <div style=${{fontSize:".8rem",fontWeight:700,overflow:"hidden",
                              textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:160}}>${msg.file.name}</div>
                            <div style=${{fontSize:".68rem",opacity:.7}}>${(msg.file.type||"").split("/")[1]?.toUpperCase()||"Datei"}</div>
                          </div>
                          <${Ic} name="chevron" size=${14} style=${{flexShrink:0,opacity:.6}}/>
                        </div>`}
                      ${msg.text&&html`<span>${msg.text}</span>`}
                    </div>
                    <div class="msg-meta" style=${{justifyContent:isOut?"flex-end":"flex-start"}}>
                      <span class="msg-time-small">${msg.time}</span>
                      ${isOut&&msg.seen&&html`<span style=${{color:"var(--teal)",fontSize:".65rem"}}>✓✓</span>`}
                    </div>
                  </div>
                </div>`;
              return row;
            })}
          </div>`)}
        <div ref=${bottomRef}/>
      </div>

      <div class="chat-input-area">
        <input ref=${chatImgRef} type="file" accept="image/*,video/*" capture="environment"
          style=${{display:"none"}} onChange=${handleChatImg}/>
        <input id="lib-pick" type="file" accept="image/*,video/*"
          style=${{display:"none"}} onChange=${handleChatImg}/>
        <input ref=${attachRef} type="file"
          accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,application/*"
          style=${{display:"none"}} onChange=${handleAttach}/>
        <button class="attach-btn" onClick=${()=>setShowCamMenu(true)}><${Ic} name="camera" size=${18}/></button>
        <button class="attach-btn" onClick=${()=>attachRef.current?.click()}><${Ic} name="attach" size=${18}/></button>
        <button class="attach-btn"
          onClick=${recording?stopRecording:startRecording}
          style=${{color:recording?"var(--danger)":"var(--muted)",position:"relative"}}>
          <${Ic} name=${recording?"stop":"mic"} size=${18}/>
          ${recording&&html`<span style=${{position:"absolute",top:1,right:1,width:7,height:7,
            borderRadius:"50%",background:"var(--danger)",border:"2px solid var(--surface)"}}/>`}
        </button>
        <textarea ref=${textRef} class="input-box" rows=${1} value=${input}
          onInput=${e=>{
            setInput(e.target.value);
            const el=e.target;
            el.style.height='auto';
            el.style.height=Math.min(el.scrollHeight,156)+'px';
            el.style.overflowY=el.scrollHeight>156?'auto':'hidden';
          }} onKeyDown=${handleKey}
          onFocus=${()=>{
            setTimeout(()=>{
              if(textRef.current) textRef.current.scrollIntoView({block:"nearest",behavior:"smooth"});
              if(bottomRef.current) bottomRef.current.scrollIntoView({behavior:"smooth"});
            },350);
          }}
          autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"
          placeholder=${sender+" schreibt…"}/>
        <button class="send-btn" onClick=${handleSend} disabled=${!input.trim()}><${Ic} name="send" size=${17}/></button>
      </div>

      ${msgMenu&&html`
        <div style=${{position:"fixed",inset:0,zIndex:99996,background:"rgba(0,0,0,.25)"}}
          onClick=${()=>setMsgMenu(null)}>
          <div style=${{
            position:"fixed",

  const fmtDate = (iso) => {
    if(!iso) return "–";

    const diff = Math.floor((Date.now() - d.getTime()) / 86400000);
    if(diff === 0) return "heute";
    if(diff === 1) return "gestern";
    if(diff < 30) return "vor " + diff + " Tagen";
    if(diff < 365) return "vor " + Math.floor(diff/30) + " Monat(en)";
    return "vor " + Math.floor(diff/365) + " Jahr(en)";
  };

  const fmtDateTime = (iso) => {
    if(!iso) return "–";

      // gemeldeten Unzuverlässigkeit beim Auslösen der Phase-1-Willkommensnachricht). Jetzt
      // startet ein neuer Coachee ganz ohne activePhase — alle vier Kreise zeigen inaktiv,
      // der erste Tap auf Kreis 1 ist ein echter Phasenwechsel über den zuverlässigen
      // Original-Pfad (onActivePhaseChanged).
      createdAt:Date.now()
    };
    if(!firestore) { showToast("✗ Keine Verbindung zur Datenbank — bitte Seite neu laden."); return; }
    firestore.collection("users_pending").doc(emailNorm).set(pendingData)
      .then(() => {
        setShowEmail({name:fullname, email:emailNorm, pendingData});
        setShowAdd(false);
        setForm({firstname:"",lastname:"",email:"",notes:"",modell:"",coaching:[],kids:false,gender:[]});
      })
      .catch(err => {
        showToast("✗ Coachee konnte nicht angelegt werden: " + err.message + " — bist du mit deinem Coach-Konto eingeloggt?");
      });
  };

  const openEdit = (c) => { setEditId(c.id); setEditForm({firstname:c.name.split(" ")[0]||"",lastname:c.name.split(" ").slice(1).join(" ")||"",notes:c.notes||"",modell:c.modell||"",coaching:c.coaching||"",kids:c.kids||false,gender:c.gender||""}); };
  // Fix (03.08.2026, kritischer Fund "Coaching-Kategorie ändert sich nach Bearbeiten
  // nicht in Impulse"): saveEdit() und deleteCoachee() schrieben bisher AUSSCHLIESSLICH
  // in den lokalen React-State (setCoachees), nie nach Firestore. Der Live-Listener auf
  // users (Zeile ~1795) überschreibt diesen lokalen Stand beim nächsten Sync wieder mit
  // dem unveränderten Firestore-Dokument — betrifft ALLE Felder des Bearbeiten-Formulars
  // (Name, Notizen, Modell, Coaching, Geschlecht, Kids), nicht nur Coaching. Ebenso war
  // "Löschen" bisher folgenlos (kein echter Firestore-delete()). Beide jetzt mit echtem
  // Firestore-Schreibvorgang. Da "Löschen" dadurch neu tatsächlich destruktiv ist (vorher
  // war ein Klick darauf wirkungslos), analog zum bestehenden "Test zurücksetzen"-Muster
  // eine Zwei-Klick-Bestätigung ergänzt statt natives confirm().
  const [savingEdit,setSavingEdit] = useState(false);
  const [deleteConfirm,setDeleteConfirm] = useState(false);
  const saveEdit = () => {
    if(!editForm.firstname.trim()) return;
    const fullname=[editForm.firstname.trim(),editForm.lastname.trim()].filter(Boolean).join(" ");
    const initials=fullname.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
    const topic=[editForm.coaching,editForm.kids?"mit Kids":""].filter(Boolean).join(" ")||editForm.modell||"Coaching";
    const firestore = db();
    if(!firestore) { showToast("✗ Keine Verbindung zur Datenbank — bitte Seite neu laden."); return; }
    const updateData = {
      name: fullname, modell: editForm.modell||"", coaching: editForm.coaching||[],
      kids: !!editForm.kids, gender: editForm.gender||[], notes: editForm.notes||"",
      categories: [...(editForm.coaching||[]), ...(editForm.gender||[])]
    };
    // NEU (12.08.2026, Fund Rico "Rhythmus/Anzeige stimmt nach Coaching-Art-Änderung nicht
    // mehr"): packageType wurde bisher NUR bei Neuanlage aus coaching abgeleitet (Zeile
    // ~3095), beim Bearbeiten aber nie nachgezogen — der Impulse-Phasen-Tab und der
    // tatsächliche Tagesimpuls-Rhythmus (index.html, calcNextImpulseAt) lasen dadurch nach
    // einer Änderung (z.B. Paar → Einzel) weiterhin den alten packageType-Wert. Fix: hier
    // dieselbe Ableitung wie bei Neuanlage nachgezogen — "eltern" fällt auf "paar" (siehe
    // INTERVALS.paar-Label "Paar- / Elterncoaching"), sonst 1:1. Bewusst NUR ausserhalb der
    // Integrationsphase syncen — dort ist packageType fest auf "integration" gesetzt,
    // unabhängig von der Coaching-Art (siehe Kapitel 45.5), eine Coaching-Art-Änderung soll
    // eine laufende Integrationsphase nicht versehentlich zurück auf Transformation kippen.
    const existingCoachee = coachees.find(c => c.id === editId);
    if ((existingCoachee?.packageType || "") !== "integration") {
      const k = (editForm.coaching||[])[0]?.toLowerCase();
      updateData.packageType = k === "eltern" ? "paar" : (k || "einzel");
    }
    setSavingEdit(true);
    firestore.collection("users").doc(editId).set(updateData, { merge:true })
      .then(() => {
        setCoachees(cs=>cs.map(c=>c.id===editId?{...c,...updateData,initials,topic}:c));
        setEditId(null);
      })
      .catch(err => showToast("✗ Speichern fehlgeschlagen: " + err.message))
      .finally(() => setSavingEdit(false));
  };
  const deleteCoachee = async (id) => {
    if(!deleteConfirm) { setDeleteConfirm(true); setTimeout(()=>setDeleteConfirm(false),4000); return; }
    setDeleteConfirm(false);
    const firestore = db();
    if(!firestore) { showToast("✗ Keine Verbindung zur Datenbank — bitte Seite neu laden."); return; }
    const fbStorage = window._fb?.storage;
    try {
      // Chat-Nachrichten + zugehörige Storage-Dateianhänge löschen
      const msgsSnap = await firestore.collection("chats").doc(id).collection("messages").get();
      const jobs = [];
      msgsSnap.forEach(d => {
        const data = d.data();
        if(data.file?.storagePath && fbStorage) {
          jobs.push(fbStorage.ref(data.file.storagePath).delete().catch(()=>{}));
        }
        jobs.push(d.ref.delete().catch(()=>{}));
      });
      await Promise.all(jobs);

      // Tages-Impuls-Einträge löschen
      const impSnap = await firestore.collection("impulse_entries").where("uid","==",id).get();
      await Promise.all(impSnap.docs.map(d=>d.ref.delete().catch(()=>{})));

      // Erinnerungen ("Meine Impulse") löschen — benötigt erweiterte Firestore-Rule (isCoach())
      const remSnap = await firestore.collection("reminders").where("uid","==",id).get();
      await Promise.all(remSnap.docs.map(d=>d.ref.delete().catch(()=>{})));

      // Push-Geräte-Subscriptions löschen (users/{id}/devices/*) — NEU 15.08.2026
      // Bisher übersehene Unterkollektion (Kapitel 28.6-Muster: Firestore-Rules UND
      // Löschlogik behandeln Unterkollektionen nicht automatisch mit). Rein technischer
      // Datenrest ohne Coachee-sichtbaren Effekt, aber Teil einer vollständigen Löschung.
      const devSnap = await firestore.collection("users").doc(id).collection("devices").get();
      await Promise.all(devSnap.docs.map(d=>d.ref.delete().catch(()=>{})));

      // Profil zuletzt löschen
      await firestore.collection("users").doc(id).delete();
      setCoachees(cs=>cs.filter(c=>c.id!==id));
      setEditId(null);
      showToast("Coachee gelöscht — Auth-Account bitte manuell in Firebase Console entfernen");
    } catch(err) {
      showToast("✗ Löschen fehlgeschlagen: " + err.message);
    }
  };
  // Fix (03.08.2026, auf Ricos Wunsch): "Coaching" (Paar/Einzel/Eltern) ist inhaltlich
  // eine Einfachauswahl — ein Coachee hat genau eine Coaching-Art, nicht mehrere. Bisher
  // gemeinsam mit "Geschlecht" (das weiterhin Mehrfachauswahl bleibt) als Toggle-Array
  // behandelt, wodurch versehentlich mehrere/alle drei gleichzeitig aktiv sein konnten.
  // Datentyp bleibt bewusst ein Array (max. 1 Element) — sonst müssten alle Stellen, die
  // c.coaching bereits als Array lesen (ImpulsPhasenTab, Coachees-Liste, packageType-
  // Mapping bei Neuanlage), zusätzlich einen zweiten Datentyp (String) abfangen.
  // Fix (03.08.2026, Folgewunsch): Geschlecht ebenfalls auf Einfachauswahl umgestellt,
  // gleiches Muster/gleiche Begründung wie bei Coaching oben.
  const selBtn = (field,val) => setForm(f=>{
    if(field==="coaching"||field==="gender"){
      return {...f,[field]:(f[field]||[])[0]===val?[]:[val]};
    }
    return {...f,[field]:f[field]===val?"":val};
  });
  const selEditBtn = (field,val) => setEditForm(f=>{
    if(field==="coaching"||field==="gender"){
      return {...f,[field]:(f[field]||[])[0]===val?[]:[val]};
    }
    return {...f,[field]:f[field]===val?"":val};
  });

  const SelBtns = ({fields, form, onSel, items}) => html`
    <div style=${{display:"flex",gap:8,flexWrap:"wrap"}}>
      ${items.map(([label,icon])=>html`
        <div key=${label} class=${"sel-btn"+(form[fields]===label?" active":"")}
          style=${{flex:1,flexDirection:"column",gap:5,padding:"10px 8px",minWidth:80}}
          onClick=${()=>onSel(fields,label)}>
          ${icon}
          ${label}
        </div>`)}
    </div>`;

  const showEmailModal = showEmail ? h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}},
        h("div",{style:{background:"var(--surface)",borderRadius:18,padding:28,maxWidth:560,width:"100%",maxHeight:"90dvh",overflowY:"auto",boxShadow:"0 8px 40px rgba(0,0,0,.18)"}},
          h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}},
            h("div",{style:{fontFamily:"'Manuale',serif",fontSize:"1.15rem",fontWeight:700,color:"var(--text)"}},"Willkommens-E-Mail"),
            h("button",{onClick:()=>{setShowEmail(null);},style:{background:"none",border:"none",cursor:"pointer",color:"var(--muted)",fontSize:"1.3rem"}},"\u2715")
          ),
          h("div",{style:{background:"var(--sage-pale)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px",marginBottom:16,fontSize:".82rem",color:"var(--muted)",lineHeight:1.6}},
            h("strong",{style:{color:"var(--forest)",display:"block",marginBottom:6}},"\u2713 Nichts weiter zu tun"),
            h("span",null,"Der Coachee registriert sich beim ersten App-Start selbst mit "),
            h("strong",null,showEmail&&showEmail.email),
            h("span",null," und einem eigenen Passwort. Sein Zugang wird dabei automatisch freigeschaltet — du musst nichts mehr in der Firebase Console eintragen.")
          ),
          h("div",{className:"email-copy-area",style:{background:"var(--bg)",border:"1.5px solid var(--border)",borderRadius:12,padding:"16px 18px",fontFamily:"Georgia,serif",fontSize:".88rem",lineHeight:1.9,color:"var(--text)",whiteSpace:"pre-wrap",overflowWrap:"break-word",wordBreak:"break-word",userSelect:"all",marginBottom:16}},
            showEmail&&("Liebe/r "+showEmail.name+"\n\nHerzlich willkommen bei der App von Raum f\u00fcr Selbstwirksamkeit!\n\nWir freuen uns sehr, dich auf diesem Weg begleiten zu d\u00fcrfen. Deine pers\u00f6nliche Coaching-App ist jetzt f\u00fcr dich freigeschaltet.\n\nBevor du startest, schau dir gerne kurz an, wie die App funktioniert:\nhttps://dicostaempfli.github.io/selbstwirksamkeit-app/onboarding.html\n\nSo gelangst du zur App:\nhttps://dicostaempfli.github.io/selbstwirksamkeit-app/?neu=1\n\nRichte dort deinen Zugang ein — mit deiner E-Mail-Adresse ("+showEmail.email+") und einem Passwort deiner Wahl.\n\nWas dich erwartet:\n\u2022 Chat \u2014 direkte Verbindung zu uns zwischen den Sitzungen\n\u2022 Impulse \u2014 kleine, wiederkehrende Denkanst\u00f6sse vom Denken ins F\u00fchlen\n\u2022 Mediathek \u2014 \u00dcbungen und Inhalte zum Vertiefen\n\u2022 Termine \u2014 deine Coaching-Termine und Events auf einen Blick\n\nDie App ist bewusst einfach gehalten \u2014 kein Zeitfresser, sondern ein sanfter Anker im Alltag.\n\nFalls die Registrierung nicht klappen sollte: Schreib Rico kurz per WhatsApp eine (letzte) Nachricht. Anschliessend l\u00e4uft die gesamte Kommunikation \u00fcber die App — nicht mehr per WhatsApp oder SMS. So bleibt alles an einem Ort, gesch\u00fctzt und nur f\u00fcr dich und uns sichtbar.\n\nWir freuen uns auf den gemeinsamen Weg.\n\nHerzlich,\nDiana & Rico\n\nRaum f\u00fcr Selbstwirksamkeit\nwww.selbstwirksamkeit.ch")
          ),
          h("div",{style:{display:"flex",gap:10}},
            h("button",{
              onClick:()=>{
                const el=document.querySelector(".email-copy-area");
                if(el){try{navigator.clipboard.writeText(el.innerText).then(()=>showToast("\u2713 E-Mail kopiert!")).catch(()=>{});}catch(e){}}
              },
              style:{flex:1,height:42,background:"var(--teal)",color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontFamily:"'Exo 2',sans-serif",fontSize:".85rem",cursor:"pointer"}
            },"E-Mail-Text kopieren"),
            h("button",{onClick:()=>{setShowEmail(null);},style:{height:42,padding:"0 18px",background:"none",border:"1.5px solid var(--border2)",borderRadius:10,fontWeight:700,fontFamily:"'Exo 2',sans-serif",fontSize:".85rem",cursor:"pointer",color:"var(--muted)"}},"Schliessen")
          )
          )
        ) : null;
  return html`
    <div class="page" style=${{overflowX:"hidden"}}>
      <div style=${{marginBottom:24,display:"flex",alignItems:"center",gap:12}}>
        <${Logo} size=${44}/>
        <div style=${{flex:1,minWidth:0}}>
          <div style=${{fontFamily:"'Manuale',serif",fontSize:"1.2rem",fontWeight:700,color:"var(--text)"}}>Coachees</div>
          <div style=${{fontSize:".82rem",color:"var(--muted)",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Alle aktiven und ehemaligen Coachees.</div>
        </div>
        <button class="btn btn-primary btn-sm" style=${{flexShrink:0}} onClick=${()=>setShowAdd(true)}>
          <${Ic} name="plus" size=${15}/> Hinzufügen
        </button>
      </div>

      ${deletedSection}

      ${pendingSection}

      <div class="coachee-grid">
        ${[...coachees].sort((a,b)=>a.name.localeCompare(b.name,"de")).map(c=>html`
          <div key=${c.id} class="coachee-card">
            <div class="coachee-header">
              <div style=${{flex:1,minWidth:0}}>
                <div class="coachee-name">${c.name}</div>
                <div class="coachee-topic">${c.topic}</div>
                ${c.lastSeen&&h("div",{style:{fontSize:".72rem",color:"var(--muted2)",marginTop:1}}, "Aktiv: "+fmtDate(c.lastSeen))}
                <div class="coachee-meta">
                  ${hasVal(c.coaching)&&html`<span class="coachee-chip">${h("span",{style:{display:"flex"}},COACHING_ICON[(Array.isArray(c.coaching)?c.coaching[0]:c.coaching||"").toLowerCase()]||null)}${Array.isArray(c.coaching)?c.coaching.join(", "):c.coaching}${c.kids?" + Kids":""}</span>`}
                  ${c.modell&&html`<span class="coachee-chip">${h("span",{style:{display:"flex"}},MODELL_ICON[(c.modell||"").toLowerCase()]||null)}${c.modell}</span>`}
                  ${hasVal(c.gender)&&html`<span class="coachee-chip">${h("span",{style:{display:"flex"}},GENDER_ICON[(Array.isArray(c.gender)?c.gender[0]:c.gender||"").toLowerCase()]||null)}${Array.isArray(c.gender)?c.gender.join(", "):c.gender}</span>`}
                </div>
              </div>
              <div class="coachee-actions">
                <button class="btn btn-primary btn-sm" style=${{whiteSpace:"nowrap"}} onClick=${()=>setPage("chat")}><${Ic} name="chat" size=${13}/> Chat</button>
                <button class="btn btn-ghost btn-sm" style=${{whiteSpace:"nowrap"}} onClick=${()=>openEdit(c)}><${Ic} name="edit" size=${13}/> Edit</button>
              </div>
            </div>
          </div>`)}
      </div>

      ${showAdd&&html`
        <div class="overlay" onClick=${e=>{if(e.target===e.currentTarget)setShowAdd(false);}}>
          <div class="modal">
            <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
              <h2 class="modal-title" style=${{marginBottom:0}}>Neuen Coachee hinzufügen</h2>
              <button style=${{background:"none",border:"none",cursor:"pointer",color:"var(--muted)",padding:4,borderRadius:8,display:"flex"}} onClick=${()=>setShowAdd(false)}><${Ic} name="x" size=${20}/></button>
            </div>
            <div class="modal-preview">
              <div style=${{width:46,height:46,borderRadius:"50%",background:form.firstname?AVATAR_BG[[...form.firstname].length%AVATAR_BG.length]:AVATAR_BG[0],display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:".9rem",color:"var(--text)",flexShrink:0}}>
                ${[form.firstname,form.lastname].filter(Boolean).join(" ").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()||"?"}
              </div>
              <div style=${{flex:1,minWidth:0}}>
                <div style=${{fontWeight:700,fontSize:".92rem",color:form.firstname?"var(--text)":"var(--muted)"}}>
                  ${[form.firstname,form.lastname].filter(Boolean).join(" ")||"Name eingeben…"}
                </div>
                <div style=${{display:"flex",gap:5,marginTop:5,flexWrap:"wrap"}}>
                  ${form.modell&&html`<span style=${{fontSize:".65rem",fontWeight:700,background:"var(--teal)",color:"#fff",borderRadius:99,padding:"1px 7px"}}>${form.modell}</span>`}
                  ${(form.coaching||[]).length>0&&html`<span style=${{fontSize:".65rem",fontWeight:700,background:"var(--teal-pale)",color:"var(--teal-dark)",borderRadius:99,padding:"1px 7px"}}>${form.coaching.join(", ")}${form.kids&&!form.coaching.includes("Eltern")?" + Kids":""}</span>`}
                  ${(form.gender||[]).length>0&&html`<span style=${{fontSize:".65rem",fontWeight:700,background:"var(--surface2)",color:"var(--muted)",borderRadius:99,padding:"1px 7px"}}>${form.gender.join(", ")}</span>`}
                </div>
              </div>
            </div>
            <div class="form-grid" style=${{marginBottom:12}}>
              <div class="form-row" style=${{marginBottom:0}}>
                <label class="label">Vorname *</label>
                <input class="input" value=${form.firstname} onInput=${e=>setForm(f=>({...f,firstname:e.target.value}))} placeholder="Anna"/>
              </div>
              <div class="form-row" style=${{marginBottom:0}}>
                <label class="label">Nachname</label>
                <input class="input" value=${form.lastname} onInput=${e=>setForm(f=>({...f,lastname:e.target.value}))} placeholder="Meier"/>
              </div>
            </div>
            <div class="form-row">
              <label class="label">E-Mail *</label>
              <input class="input" type="email" value=${form.email} onInput=${e=>setForm(f=>({...f,email:e.target.value}))} placeholder="anna.meier@example.ch"/>
            </div>
            <div class="form-row">
              <label class="label">Bemerkungen</label>
              <textarea class="textarea" rows=${2} value=${form.notes} onInput=${e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Notizen zum Coachee…"/>
            </div>
            <div class="form-row">
              <label class="label">Modell</label>
              <div style=${{display:"flex",gap:8}}>
                ${[["Stunden",html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`],["Package",html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>`]].map(([label,icon])=>html`
                  <div key=${label} class=${"sel-btn"+(form.modell===label?" active":"")} style=${{flex:1,flexDirection:"column",gap:5,padding:"10px 8px"}} onClick=${()=>selBtn("modell",label)}>
                    ${icon} ${label}
                  </div>`)}
              </div>
            </div>
            <div class="form-row">
              <label class="label">Coaching</label>
              <div style=${{display:"flex",gap:8,flexWrap:"wrap"}}>
                ${[["Paar",html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>`],["Einzel",html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`],["Eltern",html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5" r="3"/><path d="M4 21v-2a4 4 0 014-4h0"/><circle cx="17" cy="8" r="2"/><path d="M14 21v-1.5a3 3 0 013-3h0a3 3 0 013 3V21"/></svg>`]].map(([label,icon])=>html`
                  <div key=${label} class=${"sel-btn"+((form.coaching||[]).includes(label)?" active":"")} style=${{flex:1,minWidth:"80px",flexDirection:"column",gap:5,padding:"10px 8px"}} onClick=${()=>selBtn("coaching",label)}>
                    ${icon} ${label}
                  </div>`)}
              </div>
            </div>
            <div class="form-row">
              <label class="label">Geschlecht</label>
              <div style=${{display:"flex",gap:8}}>
                ${[["Männlich",html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="14" r="6"/><path d="M22 2l-6 6M22 2h-6M22 2v6"/></svg>`],["Weiblich",html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M12 14v8M9 19h6"/></svg>`]].map(([label,icon])=>html`
                  <div key=${label} class=${"sel-btn"+((form.gender||[]).includes(label)?" active":"")} style=${{flex:1,flexDirection:"column",gap:5,padding:"10px 8px"}} onClick=${()=>selBtn("gender",label)}>
                    ${icon} ${label}
                  </div>`)}
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-ghost" onClick=${()=>setShowAdd(false)}>Abbrechen</button>
              <button class="btn btn-primary" onClick=${addCoachee} disabled=${!form.firstname.trim()||!form.email.trim()}>Erstellen & E-Mail anzeigen</button>
            </div>
          </div>
        </div>`}

      ${showEmailModal}

      ${editId&&html`
        <div class="coachee-edit-sheet" onClick=${e=>{if(e.target===e.currentTarget)setEditId(null);}}>
          <div class="coachee-edit-panel">
            <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
              <h2 class="modal-title" style=${{marginBottom:0}}>${editForm.firstname} ${editForm.lastname} bearbeiten</h2>

// Fix (28.08.2026, analog zu index.html, Rico-Meldung "Video bricht nach ca. 30 Sekunden ab"):
// ThumbSmall/ExpandedMedia waren bisher INNERHALB von LibraryPage definiert. Preact identifiziert
// eine Komponente über die Funktions-Referenz, nicht über den Namen — bei jedem Re-Render von
// LibraryPage (z.B. durch einen der vielen Firestore-onSnapshot-Listener in admin.html, die auch
// dann feuern, wenn die Mediathek offen ist) entstand dadurch jedes Mal eine NEUE Funktions-
// Identität für diese Komponenten. Das zwang Preact, das gerade aufgeklappte Item komplett zu
// unmounten und neu zu mounten — ein laufendes <video autoPlay> sprang dadurch bei jedem
// Re-Render hart zurück auf 0. Fix: beide Komponenten auf Modulebene (ausserhalb LibraryPage)
// definiert, damit ihre Identität über Re-Renders stabil bleibt; setPhotoOverlay wird dafür als
// Prop statt als Closure übergeben. Siehe Pflichtregel 46.
const urlHost = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch(e) { return null; } };

const ThumbSmall = ({item,sec}) => {
  if(item.type==='link'){
    if(item.thumbData) return html`
      <div style=${{width:'100%',height:'100%',position:'relative',overflow:'hidden'}}>
        <img src=${item.thumbData} style=${{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
        <div style=${{position:'absolute',bottom:2,right:3,background:'rgba(0,0,0,.6)',color:'white',borderRadius:5,width:16,height:16,display:'flex',alignItems:'center',justifyContent:'center'}}><${Ic} name="extlink" size=${9} style=${{color:'white'}}/></div>
      </div>`;
    const host=urlHost(item.fileUrl);
    return html`
      <div style=${{width:'100%',height:'100%',background:sec.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:5}}>
        ${host
          ? html`<img src=${'https://www.google.com/s2/favicons?sz=64&domain='+host} width="26" height="26"
              style=${{borderRadius:6}} onError=${e=>{e.target.style.display='none';e.target.nextSibling.style.display='flex';}}/>`
          : null}
        <div style=${{display:host?'none':'flex',width:26,height:26,alignItems:'center',justifyContent:'center'}}><${Ic} name="link" size=${18} style=${{color:sec.color}}/></div>
        ${host&&html`<div style=${{fontSize:'6.5px',fontWeight:700,color:sec.color,maxWidth:'90%',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${host}</div>`}
      </div>`;
  }
  if((item.type==='video'||item.type==='foto') && item.thumbData) return html`
    <div style=${{width:'100%',height:'100%',position:'relative',overflow:'hidden'}}>
      <img src=${item.thumbData} style=${{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
      ${item.type==='video'&&html`<div style=${{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div style=${{width:22,height:22,borderRadius:'50%',background:'rgba(255,255,255,.88)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="8" height="8" viewBox="0 0 24 24" fill="#156e6e"><path d="M5 3l14 9-14 9V3z"/></svg>
        </div>
      </div>`}
      ${item.duration&&html`<div style=${{position:'absolute',bottom:2,right:3,background:'rgba(0,0,0,.6)',color:'white',fontSize:'6px',fontWeight:700,padding:'1px 3px',borderRadius:3}}>${item.duration}</div>`}
    </div>`;
  return html`
    <div style=${{width:'100%',height:'100%',background:sec.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3}}>
      ${item.type==='audio'?html`
        <div style=${{display:'flex',alignItems:'center',gap:1.5,height:20}}>
          ${(item.thumbData?JSON.parse(item.thumbData):[.3,.6,.9,.5,.8,.4,.7,.5,.6,.4]).slice(0,10).map((h,i)=>html`
            <div key=${i} style=${{width:2.5,height:Math.round(h*18)+'px',background:sec.color,borderRadius:2,opacity:.8}}/>
          `)}
        </div>`:html`<${Ic} name=${sec.icon} size=${20} style=${{color:sec.color}}/>`}
      ${item.duration&&html`<div style=${{fontSize:'7px',fontWeight:700,color:sec.color}}>${item.duration}</div>`}
    </div>`;
};
const ExpandedMedia = ({item, sec, setPhotoOverlay}) => {
  if(item.type==='video') return html`

        ${item.fileUrl&&html`

            <${Ic} name="extlink" size=${13} style=${{color:'white'}}/> Öffnen
          </a>`}
      </div>`;
  }

  if(item.type==='audio') return html`
    <div style=${{padding:'16px 20px',background:sec.bg}}>
      <audio controls src=${item.fileUrl||''} style=${{width:'100%'}} onClick=${e=>e.stopPropagation()}/>
    </div>`;

  if(item.type==='dokus') return html`

      ${!item.fileUrl&&html`
        <div style=${{padding:'24px 16px',textAlign:'center',color:'var(--muted)',fontSize:'.85rem'}}>Keine Datei verfügbar</div>`}
      ${item.fileUrl&&html`
        <div style=${{display:'flex',justifyContent:'flex-end',padding:'8px 12px',background:'var(--surface)'}}>
          <a href=${item.fileUrl} target="_blank" rel="noopener" onClick=${e=>e.stopPropagation()}
            style=${{display:'flex',alignItems:'center',gap:5,padding:'5px 11px',background:'#156e6e',color:'white',borderRadius:7,fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:'.75rem',textDecoration:'none'}}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download

        </div>`}
    </div>`;

  return null;
};
