  const [fileName, setFileName]   = useState('');
  const [thumbData, setThumbData] = useState(null);
  const [duration, setDuration]   = useState('');
  const [uploading, setUploading] = useState(false);
  const [drag, setDrag]           = useState(false);
  const [linkUrl, setLinkUrl]     = useState('');
  const fileRef                   = useRef(null);
  const linkThumbRef              = useRef(null);

  const SECTIONS = [
    {type:'video', label:'Video',  icon:'play',   color:'#156e6e', bg:'#e0eded', border:'#b0d4d4'},
    {type:'audio', label:'Audio',  icon:'headphones', color:'#156e6e', bg:'#e0eded', border:'#b0d4d4'},
    {type:'foto',  label:'Fotos',  icon:'image',  color:'#156e6e', bg:'#e0eded', border:'#b0d4d4'},
    {type:'dokus', label:'Dokus',  icon:'file',   color:'#156e6e', bg:'#e0eded', border:'#b0d4d4'},
    {type:'link',  label:'Links',  icon:'link',   color:'#156e6e', bg:'#e0eded', border:'#b0d4d4'},
  ];

  const normalizeUrl = u => {
    const t = (u||'').trim();
    if(!t) return '';
    return /^https?:\/\//i.test(t) ? t : 'https://'+t;
  };

  const fmtDur = s => { const m=Math.floor(s/60),r=Math.round(s%60); return m+':'+(r<10?'0':'')+r; };
  const detectType = f => {
    if(f.type.startsWith('video')) return 'video';
    if(f.type.startsWith('audio')) return 'audio';
    if(f.type.startsWith('image')) return 'foto';
    return 'dokus';
  };

  const readFile = f => new Promise((res,rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = () => rej(new Error('Lesefehler'));
    r.readAsDataURL(f);
  });

  const extractVideoThumb = f => new Promise(res => {
    const objUrl = URL.createObjectURL(f);
    const vid = document.createElement('video');
    vid.muted=true; vid.playsInline=true; vid.preload='metadata';
    vid.onloadedmetadata = () => { vid.currentTime = Math.min(0.5, vid.duration*.1); };
    vid.onseeked = () => {
      try {
        const c=document.createElement('canvas');
        c.width=320; c.height=Math.round(vid.videoHeight/vid.videoWidth*320)||180;
        c.getContext('2d').drawImage(vid,0,0,c.width,c.height);
        res({thumb:c.toDataURL('image/jpeg',.75), dur:vid.duration});
      } catch(e){res({thumb:null,dur:vid.duration||0});}
      URL.revokeObjectURL(objUrl);
    };
    vid.onerror=()=>{URL.revokeObjectURL(objUrl);res({thumb:null,dur:0});};
    setTimeout(()=>{URL.revokeObjectURL(objUrl);res({thumb:null,dur:0});},8000);
    vid.src=objUrl;
  });

  const extractAudioWave = f => new Promise(res => {
    try {
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      const reader=new FileReader();
      reader.onload=e=>{
        ctx.decodeAudioData(e.target.result.slice(0),decoded=>{
          const data=decoded.getChannelData(0);
          const bars=40,step=Math.floor(data.length/bars),peaks=[];
          for(let i=0;i<bars;i++){let max=0;for(let j=0;j<step;j++)max=Math.max(max,Math.abs(data[i*step+j]||0));peaks.push(max);}
          const norm=Math.max(...peaks)||1;
          res({wave:peaks.map(p=>Math.max(.08,p/norm)),dur:decoded.duration});
          ctx.close();
        },()=>res({wave:null,dur:0}));
      };
      reader.onerror=()=>res({wave:null,dur:0});
      reader.readAsArrayBuffer(f);
    }catch(e){res({wave:null,dur:0});}
  });

  const handleFile = f => {
    if(!f) return;
    const t=detectType(f);
    setForm(v=>({...v,type:t,title:v.title||f.name.replace(/\.[^.]+$/,'')}));
    setFileName(f.name); setFileData(f); setThumbData(null); setDuration('');
    setUploading(true);
    if(t==='foto'){
      const objUrl=URL.createObjectURL(f);
      const img=new Image();
      img.onload=()=>{
        const maxW=400,scale=img.width>maxW?maxW/img.width:1;
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        setThumbData(c.toDataURL('image/jpeg',.6));
        URL.revokeObjectURL(objUrl); setUploading(false);
      };
      img.onerror=()=>{URL.revokeObjectURL(objUrl);showToast('Fehler beim Lesen');setUploading(false);};
      img.src=objUrl;
    } else if(t==='video'){
      extractVideoThumb(f).then(({thumb,dur})=>{
        if(thumb)setThumbData(thumb); if(dur)setDuration(fmtDur(dur)); setUploading(false);
      });
    } else if(t==='audio'){
      extractAudioWave(f).then(({wave,dur})=>{
        if(wave)setThumbData(JSON.stringify(wave)); if(dur)setDuration(fmtDur(dur)); setUploading(false);
      });
    } else { setUploading(false); }
    if(fileRef.current)fileRef.current.value='';
  };

  const handleInputChange = e => { handleFile(e.target.files[0]); e.target.value=''; };
  const handleDrop = e => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); };

  // Optionales Cover für Typ 'link' (z.B. Podcast-Episoden-Bild) — reine Bild-Auswahl,
  // unabhängig vom regulären handleFile()/fileData-Pfad, da hier keine Datei gespeichert
  // wird, sondern nur ein Vorschaubild neben der externen URL.
  const handleLinkThumb = f => {
    if(!f) return;
    const objUrl=URL.createObjectURL(f);
    const img=new Image();
    img.onload=()=>{
      const maxW=400,scale=img.width>maxW?maxW/img.width:1;
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      setThumbData(c.toDataURL('image/jpeg',.7));
      URL.revokeObjectURL(objUrl);
    };
    img.onerror=()=>{URL.revokeObjectURL(objUrl);showToast('Fehler beim Lesen des Bilds');};
    img.src=objUrl;
    if(linkThumbRef.current)linkThumbRef.current.value='';
  };

  // NEU (20.08.2026): editingItem liefert die bestehenden Firestore-Werte (fileUrl,
  // storagePath, uploadedAt, createdAt) als Fallback, wenn beim Bearbeiten keine neue
  // Datei gewählt wird — save() unten übernimmt sie dann unverändert statt sie zu leeren.
  const editingItem = editingId ? library.find(i=>i.id===editingId) : null;

  const resetForm = () => {
    setForm({title:'',desc:'',type:'audio',keywords:''});
    setFileData(null); setFileName(''); setThumbData(null); setDuration(''); setLinkUrl('');
  };

  // NEU (20.08.2026, Rico-Wunsch "Karte antippen = bearbeiten"): befüllt das Formular mit
  // den bestehenden Werten des angetippten Eintrags und öffnet dasselbe Modal wie beim
  // Hochladen — save() erkennt über editingId, dass ein bestehendes Dokument aktualisiert
  // statt ein neues angelegt werden muss.
  const openEdit = item => {
    setEditingId(item.id);
    setForm({title:item.title||'',desc:item.desc||'',type:item.type||'audio',keywords:item.keywords||''});
    setFileData(null);
    setFileName(item.fileName||'');
    setThumbData(item.thumbData||null);
    setDuration(item.duration||'');
    setLinkUrl(item.type==='link'?(item.fileUrl||''):'');
    setShowUpload(true);
  };

  const openCreate = () => { setEditingId(null); resetForm(); setShowUpload(true); };

  const closeModal = () => { setShowUpload(false); setEditingId(null); resetForm(); };

  const save = async () => {
    if(!form.title.trim()){showToast('Bitte Titel eingeben');return;}
    if(form.type==='link'&&!linkUrl.trim()){showToast('Bitte Link-URL eingeben');return;}
    const storage=window._fb?.storage, firestore=db();
    if(!firestore){showToast('Firebase nicht bereit');return;}
    setUploading(true);
    try {
      // Fallback auf die bestehenden Werte beim Bearbeiten, falls keine neue Datei gewählt
      // wurde (siehe editingItem oben) — vorher wurde hier beim Bearbeiten stets null
      // geschrieben und die Datei ging verloren.
      let fileUrl=editingItem?.fileUrl||null, storagePath=editingItem?.storagePath||null;
      if(form.type==='link'){
        fileUrl=normalizeUrl(linkUrl);
        storagePath=null;
      } else if(fileData&&storage){
        const safeName=fileName.replace(/[^a-zA-Z0-9._-]/g,'_');
        storagePath=`library/${Date.now()}_${safeName}`;
        const ref=storage.ref(storagePath);
        await ref.put(fileData);
        fileUrl=await ref.getDownloadURL();
      }
      const id=editingId||('lib_'+Date.now());
      const meta={id,...form,fileUrl:fileUrl||null,storagePath:storagePath||null,
        fileName:fileName||null,thumbData:thumbData||null,duration:duration||null,
        uploadedAt:editingItem?.uploadedAt||new Date().toLocaleDateString('de-CH'),
        createdAt:editingItem?.createdAt||Date.now()};
      await firestore.collection('library').doc(id).set(meta);
      showToast(editingId?'✓ Änderungen gespeichert':'✓ Material gespeichert');
    }catch(e){showToast('Fehler beim Speichern: '+(e.message||e.code||'unbekannt'));}
    finally{
      setUploading(false); setShowUpload(false); setEditingId(null);
      resetForm();
    }
  };

  const del = async id => {
    const firestore=db(),storage=window._fb?.storage;
    const item=library.find(i=>i.id===id);
    if(item?.storagePath&&storage){try{await storage.ref(item.storagePath).delete();}catch(e){}}
    if(firestore)firestore.collection('library').doc(String(id)).delete().catch(()=>{});
    setLibrary(l=>l.filter(i=>i.id!==id));
    if(openId===id)setOpenId(null);
    showToast('Material gelöscht');
  };

  const toggle = id => setOpenId(v=>v===id?null:id);

  const matches = item => !searchQ||
    item.title?.toLowerCase().includes(searchQ.toLowerCase())||
    item.desc?.toLowerCase().includes(searchQ.toLowerCase())||
    item.keywords?.toLowerCase().includes(searchQ.toLowerCase());

  const visibleSecTypes = SECTIONS.filter(sec => library.some(i=>i.type===sec.type&&matches(i))).map(sec=>sec.type);

  return html`
    <div class="page">
      <div style=${{marginBottom:20,display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
        <div>
          <div style=${{fontFamily:"'Manuale',serif",fontSize:'1.2rem',fontWeight:700,color:'var(--text)'}}>Mediathek</div>
          <div style=${{fontSize:'.82rem',color:'var(--muted)',marginTop:1}}>Materialien für deine Coachees.</div>
        </div>
        <button class="btn btn-primary btn-sm" style=${{flexShrink:0}} onClick=${openCreate}>
          <${Ic} name="upload" size=${15}/> Hochladen
        </button>
      </div>

      <input class="input" type="text" placeholder="Inhalte suchen…"
        value=${searchQ} onInput=${e=>setSearchQ(e.target.value)}
        style=${{width:'100%',padding:'9px 14px',marginBottom:16}}/>

      ${SECTIONS.map(sec=>{
        const items=library.filter(i=>i.type===sec.type&&matches(i));
        if(items.length===0) return null;
        const showDivider = visibleSecTypes.indexOf(sec.type) > 0;
        return html`
          ${showDivider && html`<div style=${{height:1,background:'var(--border)',margin:'22px 0'}}/>`}
          <div key=${sec.type} style=${{marginBottom:32}}>
            <div style=${{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <div style=${{width:28,height:28,borderRadius:7,background:sec.bg,border:'0.5px solid '+sec.border,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <${Ic} name=${sec.icon} size=${15} style=${{color:sec.color}}/>
              </div>
              <span style=${{fontFamily:"'Manuale',serif",fontWeight:700,fontSize:'.95rem',color:'var(--text)'}}>${sec.label}</span>
              <span style=${{fontSize:'.78rem',color:'var(--muted)'}}>${items.length}</span>
            </div>
            <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              ${items.map((item,idx)=>{
                const isOpen=openId===item.id;
                const isFoto=item.type==='foto';
                const openFoto=()=>setPhotoOverlay(item.fileUrl||item.thumbData);
                // GEÄNDERT (20.08.2026, Rico-Wunsch "Karte antippen = bearbeiten"): der
                // Titel-/Beschreibungsbereich der Karte öffnet jetzt das Bearbeiten-Modal.
                // Vorschau (Video/Audio/Link aufklappen bzw. Foto-Lightbox) bleibt weiterhin
                // über das Thumbnail-Bild, den Auf/Zu-Pfeil bzw. das Foto-Icon erreichbar.
                const onCardTap=()=>{ openEdit(item); };
                return html`
                  <div key=${item.id} style=${{gridColumn:isOpen?'1 / -1':'auto',background:'var(--surface)',border:'1px solid var(--border2)',boxShadow:'var(--shadow)',borderRadius:14,overflow:'hidden'}}>
                    <div style=${{position:'relative'}}>
                      <div style=${{width:'100%',height:isOpen?'auto':110,borderRadius:'14px 14px 0 0',overflow:'hidden',cursor:'pointer'}}
                        onClick=${()=>{if(isFoto){openFoto();} else if(!isOpen){toggle(item.id);}}}>
                        ${isOpen
                          ? html`<${ExpandedMedia} item=${item} sec=${sec} setPhotoOverlay=${setPhotoOverlay}/>`
                          : html`<${ThumbSmall} item=${item} sec=${sec}/>`}
                      </div>
                      ${isOpen&&html`
                        <div onClick=${e=>{e.stopPropagation();toggle(item.id);}}
                          style=${{position:'absolute',top:8,right:8,width:28,height:28,borderRadius:'50%',background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',zIndex:2}}>
                          <${Ic} name="x" size=${14} style=${{color:'white'}}/>
                        </div>`}
                    </div>
                    <div style=${{padding:'9px 11px 8px',cursor:'pointer'}} onClick=${onCardTap}>
                      <div style=${isOpen
                        ? {fontSize:'.9rem',fontWeight:700,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}
                        : {fontSize:'.82rem',fontWeight:700,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}
                      }>${item.title}</div>
                      ${/* GEÄNDERT (20.08.2026, Rico-Wunsch): in der Übersicht (geschlossen) nur 2 Zeilen der Beschreibung per line-clamp, Rest per "…" angedeutet, statt wie bisher nach der ersten Zeile abzuschneiden. Ist die Karte aufgeklappt (isOpen), wird die Beschreibung stattdessen vollständig gezeigt und wächst mit der Textlänge — bei sehr langem Text ab max. ~5 Zeilen intern scrollbar, damit das Grid-Layout nicht gesprengt wird. NACHTRAG (25.08.2026, Kapitel 173/174): im aufgeklappten Zustand sind Titel UND Beschreibung zusätzlich vergrössert (finale Grösse .9rem, Zwischenschritt 1rem war Rico zu gross), da beide bei voller Kartenbreite mehr Platz haben und Rico sie dort bewusst grösser/lesbarer wollte als in der 2-Spalten-Übersicht. */null}
                      <div style=${isOpen
                        ? {fontSize:'.9rem',color:'var(--muted)',marginTop:2,maxHeight:120,overflowY:'auto',whiteSpace:'pre-wrap',lineHeight:1.45}
                        : {fontSize:'.82rem',color:'var(--muted)',marginTop:2,minHeight:15,display:'-webkit-box',WebkitLineClamp:'2',WebkitBoxOrient:'vertical',overflow:'hidden'}
                      }>${[item.desc,item.duration].filter(Boolean).join(' · ')}</div>
                    </div>
                    <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 11px 10px'}}>
                      <span style=${{fontSize:'.68rem',color:'var(--muted)',opacity:.7}}>${item.uploadedAt||''}</span>
                      <div style=${{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
                        <div onClick=${e=>{e.stopPropagation();openEdit(item);}}
                          style=${{width:38,height:28,borderRadius:8,background:'var(--surface)',border:'0.5px solid var(--border2)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
                          <${Ic} name="edit" size=${14} style=${{color:'var(--muted)'}}/>
                        </div>
                        <div onClick=${e=>{e.stopPropagation();if(confirm('Material löschen?'))del(item.id);}}
                          style=${{width:50,height:28,borderRadius:8,background:'var(--danger-pale)',border:'0.5px solid var(--danger-border)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
                          <${Ic} name="trash" size=${14} style=${{color:'var(--danger-dark)'}}/>
                        </div>
                        ${!isFoto&&html`
                          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round" style=${{transform:isOpen?'rotate(180deg)':'rotate(0deg)',transition:'transform .2s',cursor:'pointer'}}
                            onClick=${e=>{e.stopPropagation();toggle(item.id);}}>
                            <polyline points="6 9 12 15 18 9"/>
                          </svg>`}
                        ${isFoto&&html`
                          <div onClick=${e=>{e.stopPropagation();openFoto();}} style=${{cursor:'pointer',display:'flex',alignItems:'center'}}>
                            <${Ic} name="image" size=${13} style=${{color:'var(--muted)'}}/>
                          </div>`}
                      </div>
                    </div>
                  </div>`;
              })}
            </div>
          </div>`;
      })}

      ${library.filter(matches).length===0&&html`
        <div style=${{textAlign:'center',padding:'44px',color:'var(--muted)'}}>
          <p>${searchQ?"Keine Treffer für '"+searchQ+"'":"Noch keine Materialien hochgeladen."}</p>
        </div>`}

      ${showUpload&&html`
        <div class="overlay" onClick=${e=>{if(e.target===e.currentTarget)closeModal();}}>
          <div class="modal" style=${{maxWidth:520}}>
            <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18}}>
              <h2 class="modal-title" style=${{marginBottom:0}}>${editingId?'Material bearbeiten':'Material hochladen'}</h2>
              <button style=${{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:4,borderRadius:8,display:'flex'}} onClick=${closeModal}><${Ic} name="x" size=${20}/></button>
            </div>
            ${form.type==='link'
              ? html`<div class="form-row"><label class="label">Link-URL *</label>
                  <input class="input" value=${linkUrl} onInput=${e=>setLinkUrl(e.target.value)}
                    placeholder="z.B. podcasts.apple.com/…"/>
                  <div style=${{fontSize:'.72rem',color:'var(--muted)',marginTop:4}}>Podcast-Folge, Artikel oder sonstiger Link — öffnet extern beim Antippen.</div>
                </div>
                <div class="form-row"><label class="label">Vorschaubild (optional)</label>
                  <input ref=${linkThumbRef} type="file" accept="image/*" style=${{display:'none'}}
                    onChange=${e=>handleLinkThumb(e.target.files[0])}/>
                  ${thumbData
                    ? html`<div style=${{display:'flex',alignItems:'center',gap:10}}>
                        <img src=${thumbData} style=${{width:56,height:56,borderRadius:9,objectFit:'cover',border:'0.5px solid var(--border2)'}}/>
                        <button type="button" class="btn btn-ghost btn-sm" onClick=${()=>linkThumbRef.current?.click()}>Anderes Bild</button>
                        <button type="button" class="btn btn-ghost btn-sm" onClick=${()=>setThumbData(null)}><${Ic} name="x" size=${13}/></button>
                      </div>`
                    : html`<button type="button" class="btn btn-ghost btn-sm" onClick=${()=>linkThumbRef.current?.click()}>
                        <${Ic} name="image" size=${14}/> Cover wählen — z.B. Podcast-Episoden-Bild
                      </button>`}
                  <div style=${{fontSize:'.72rem',color:'var(--muted)',marginTop:4}}>Ohne Bild wird automatisch das Favicon der Seite angezeigt.</div>
                </div>`
              : html`<div class=${'drop-zone'+(drag?' drag-over':'')}
              onDragOver=${e=>{e.preventDefault();setDrag(true);}}
              onDragLeave=${()=>setDrag(false)}
              onDrop=${handleDrop}
              onClick=${()=>fileRef.current?.click()}
              style=${{cursor:'pointer'}}>
              <input ref=${fileRef} type="file"
                accept="audio/*,video/*,image/*,.pdf,.doc,.docx,.txt,.xlsx,.ppt,.pptx"
                style=${{display:'none'}} onChange=${handleInputChange}/>
              ${(fileData||(editingId&&fileName))
                ? html`<div style=${{textAlign:'center'}}>
                    <${Ic} name="check" size=${24} style=${{color:'var(--forest)',marginBottom:6}}/>
                    <div style=${{fontWeight:700,color:'var(--text)',fontSize:'.88rem'}}>${fileName}</div>
                    ${duration&&html`<div style=${{fontSize:'.78rem',color:'var(--muted)',marginTop:3}}>Dauer: ${duration}</div>`}
                    ${editingId&&!fileData&&html`<div style=${{fontSize:'.72rem',color:'var(--muted)',marginTop:4}}>Zum Ersetzen neue Datei wählen</div>`}
                  </div>`
                : html`<div style=${{textAlign:'center',color:'var(--muted)'}}>
                    <${Ic} name="upload" size=${28} style=${{marginBottom:8,opacity:.5}}/>
                    <div style=${{fontSize:'.88rem'}}>Datei hierher ziehen oder antippen</div>
                    <div style=${{fontSize:'.75rem',marginTop:4,opacity:.6}}>Audio · Video · Bild · PDF · Dokument</div>
                  </div>`}
            </div>`}
            <div class="form-row"><label class="label">Titel *</label>
              <input class="input" value=${form.title} onInput=${e=>setForm(f=>({...f,title:e.target.value}))} placeholder="Titel des Materials"/></div>
            <div class="form-row"><label class="label">Beschreibung</label>
              <textarea class="textarea" rows=${1} ref=${autoGrowTextarea} value=${form.desc}
                onInput=${e=>{setForm(f=>({...f,desc:e.target.value}));autoGrowTextarea(e.target);}}
                placeholder="Kurze Beschreibung…" style=${{width:'100%',boxSizing:'border-box',minHeight:38,resize:'none'}}/></div>
            ${form.type!=='link' && !fileData && /^https?:\/\//i.test((form.title+' '+form.desc).trim())&&html`
              <div style=${{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',background:'#fdf3e0',border:'0.5px solid #ecd8a8',borderRadius:8,marginBottom:14}}>
                <${Ic} name="link" size=${14} style=${{color:'#8a6a1f',flexShrink:0}}/>
                <span style=${{fontSize:'.75rem',color:'#7a5c17',flex:1}}>Das sieht nach einem Link aus, nicht nach einer Datei.</span>
                <button type="button" class="btn btn-ghost btn-sm" onClick=${()=>{
                  const url=((form.title+' '+form.desc).match(/https?:\/\/\S+/i)||[''])[0];
                  setLinkUrl(url); setForm(f=>({...f,type:'link'}));
                }}>Zu Link wechseln</button>
              </div>`}
            <div class="form-row"><label class="label">Keywords</label>
              <input class="input" value=${form.keywords} onInput=${e=>setForm(f=>({...f,keywords:e.target.value}))} placeholder="z.B. atem, körper, entspannung"/></div>
            <div class="form-row"><label class="label">Typ</label>
              <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}>
                ${[['audio','Audio','headphones'],['video','Video','play'],['foto','Foto','image'],['dokus','Doku','file'],['link','Link','link']].map(([id,label,icon])=>html`
                  <div key=${id} class=${'sel-btn'+(form.type===id?' active':'')} style=${{flex:1,minWidth:80,flexDirection:'column',gap:6,padding:'10px 8px'}} onClick=${()=>setForm(f=>({...f,type:id}))}>

function ImpulsBibliothekTab() {
  const [jsonText, setJsonText]     = useState("");
  const [preview, setPreview]       = useState(null);
  const [parseErr, setParseErr]     = useState("");
  const [importing, setImporting]   = useState(false);
  const [importOk, setImportOk]     = useState(false);
  const [existing, setExisting]     = useState(null);
  const [loadingEx, setLoadingEx]   = useState(true);

  useEffect(() => {
    const firestore = db();
    if (!firestore) { setLoadingEx(false); return; }
    firestore.collection("settings").doc("impulse_library").get()
      .then(doc => { if (doc.exists) setExisting(doc.data()); })
      .catch(() => {})
      .finally(() => setLoadingEx(false));
  }, []);

  const handleParse = () => {
    setParseErr("");
    setPreview(null);
    try {
      const parsed = JSON.parse(jsonText.trim());
      if (!parsed.phases || !Array.isArray(parsed.phases)) throw new Error("Kein 'phases'-Array gefunden.");
      const counts = parsed.phases.map(p => ({ id: p.id, title: p.title, count: (p.impulse || []).length }));
      setPreview({ parsed, counts });
    } catch(e) {
      setParseErr("JSON-Fehler: " + e.message);
    }
  };

  const handleImport = () => {
    if (!preview) return;
    const firestore = db();
    if (!firestore) return;
    setImporting(true);
    const data = { ...preview.parsed, importedAt: Date.now() };
    firestore.collection("settings").doc("impulse_library").set(data)
      .then(() => {
        setImportOk(true);
        setExisting(data);
        setJsonText("");
        setPreview(null);
        setTimeout(() => setImportOk(false), 3000);
      })
      .catch(e => setParseErr("Firestore-Fehler: " + e.message))
      .finally(() => setImporting(false));
  };

  return html`
    <div>
      <p style=${{color:"var(--muted)",fontSize:".9rem",marginBottom:8}}>Impuls-Bibliothek aus JSON importieren. Das JSON wird unter <code>settings/impulse_library</code> gespeichert.</p>
      <p style=${{color:"var(--muted)",fontSize:".82rem",marginBottom:24}}>NEU (06.08.2026): Jeder Impuls kann optional ein Feld <code>page</code> mit der zugehörigen Workbook-Seite enthalten (z.B. <code>"page": 34</code>) — der Coachee sieht dann "Siehe Workbook Seite 34" statt der allgemeinen Phasen-Seitenspanne. Ohne <code>page</code>-Feld bleibt der bisherige Fallback (Phasen-Spanne) aktiv.</p>

      ${loadingEx ? html`<div style=${{color:"var(--muted)",marginBottom:16}}>Prüfe bestehende Bibliothek…</div>` : existing ? html`
        <div class="card" style=${{marginBottom:24,borderLeft:"3px solid var(--teal)"}}>
          <div style=${{fontSize:".82rem",fontWeight:700,color:"var(--teal)",marginBottom:6}}>✓ Bibliothek vorhanden</div>
          <div style=${{fontSize:".82rem",color:"var(--muted)"}}>Version: ${existing.version || "–"} · Importiert: ${existing.importedAt ? new Date(existing.importedAt).toLocaleDateString("de-CH") : "–"}</div>
          <div style=${{marginTop:8,display:"flex",flexWrap:"wrap",gap:6}}>
            ${(existing.phases || []).map(p => html`
              <span key=${p.id} style=${{background:"var(--surface-2,#f3f4f6)",borderRadius:6,padding:"3px 10px",fontSize:".78rem",color:"var(--text)"}}>Phase ${p.id}: ${(p.impulse||[]).length} Impulse</span>
            `)}
          </div>
        </div>` : html`
        <div class="card" style=${{marginBottom:24,borderLeft:"3px solid var(--muted)"}}>
          <div style=${{fontSize:".82rem",color:"var(--muted)"}}>Noch keine Bibliothek in Firestore gefunden.</div>
        </div>`}

      <div class="card" style=${{marginBottom:16}}>
        <div class="card-title" style=${{marginBottom:12}}>JSON einfügen</div>
        <textarea
          class="form-input"
          rows="10"
          placeholder='{"version":"1.0","phases":[{"id":1,"title":"...","impulse":[{"id":"...","text":"...","hint":"...","page":12}]}]}'
          value=${jsonText}
          onInput=${e => { setJsonText(e.target.value); setPreview(null); setParseErr(""); }}
          style=${{width:"100%",resize:"vertical",fontFamily:"monospace",fontSize:".8rem",boxSizing:"border-box",marginBottom:12}}
        ></textarea>
        <button class="btn btn-secondary" onClick=${handleParse} disabled=${!jsonText.trim()} style=${{marginRight:10}}>Vorschau prüfen</button>
        ${parseErr && html`<div style=${{color:"var(--danger)",fontSize:".82rem",marginTop:8}}>${parseErr}</div>`}
      </div>

      ${preview && html`
        <div class="card" style=${{marginBottom:16,borderLeft:"3px solid var(--forest)"}}>
          <div class="card-title" style=${{marginBottom:10,color:"var(--forest)"}}>Vorschau</div>
          <div style=${{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
            ${preview.counts.map(c => html`
              <span key=${c.id} style=${{background:"var(--accent-pale)",borderRadius:6,padding:"4px 12px",fontSize:".82rem",color:"var(--teal)",fontWeight:700}}>Phase ${c.id} — ${c.title}: ${c.count} Impulse</span>
            `)}
          </div>
          <button class="btn btn-primary" onClick=${handleImport} disabled=${importing || importOk}>
            ${importing ? "Importiere…" : importOk ? "✓ Erfolgreich importiert!" : "Jetzt importieren"}
          </button>
        </div>`}
    </div>`;
}

function ImpulsPhasenTab() {
  const [coachees, setCoachees] = useState([]);
  const [loading, setLoading]   = useState(true);
  const [saving, setSaving]     = useState({});
  const [saved, setSaved]       = useState({});
  // NEU (06.08.2026, Kapitel 47, Trigger 2): eigener Ladezustand für den neuen
  // "Tagesimpuls-Plan starten"-Button, analog zu saving/resetting.
  const [starting, setStarting]         = useState({});

  // Fix (03.08.2026, Layout-Angleichung an Coachees-Seite): gleiche relative
  // Zeitformatierung wie in CoacheesPage, damit "Aktiv: heute" hier identisch aussieht.
  const fmtDate = (iso) => {
    if(!iso) return null;
    const d = new Date(iso);
    const diff = Math.floor((Date.now() - d.getTime()) / 86400000);
    if(diff === 0) return "heute";
    if(diff === 1) return "gestern";
    if(diff < 30) return "vor " + diff + " Tagen";
    if(diff < 365) return "vor " + Math.floor(diff/30) + " Monat(en)";
    return "vor " + Math.floor(diff/365) + " Jahr(en)";
  };

  // NEU (20.08.2026, Fund Rico "genaues Startdatum + Datum des letzten/24. Impulses der
  // Integrationsphase fehlen"): reines Datum ohne Uhrzeit, für "Tagesimpuls-Plan: aktiv
  // seit ..." (beide Phasenarten, auf Ricos Wunsch vereinheitlicht) sowie für die neuen
  // Integrationsphase-Fortschrittszeilen unten. Bewusst eine eigene, separate Funktion statt
  // fmtDate() umzubauen — fmtDate() bleibt unverändert für "Aktiv: ..." (lastSeen), das
  // weiterhin die bisherige relative Formatierung ("heute"/"vor X Tagen") zeigen soll.
  const fmtDateAbs = (iso) => {
    if(!iso) return null;
    try { return new Date(iso).toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'}); }
    catch(e){ return null; }
  };

  // GEÄNDERT (20.08.2026, Rico-Wunsch "gleiches Muster auch für Transformationsphase 1–4"):
  // ursprünglich nur für die Integrationsphase gebaut (Kapitel 151), jetzt auf alle Phasen
  // verallgemeinert — baut die Fortschritts-/Abschluss-Zeile phasenunabhängig (funktioniert
  // identisch für Transformationsphase 1–4 wie für Integrationsphase/Phase 5). Bewusst als
  // h()-Aufruf statt html`` (Pre-Output-Checkliste, Punkt 1: kein nested html`` innerhalb
  // eines &&-Ausdrucks) — wird unten unconditional (für beide Phasenarten) eingebunden.
  const phaseStatusLine = (prog, fmt) => {
    let text = "Noch kein Impuls ausgelöst";
    let done = false;
    if (prog && prog.total && prog.count) {
      if (prog.count >= prog.total) {
        text = "Alle " + prog.total + " Impulse abgeschlossen am " + fmt(prog.lastAt);
        done = true;
      } else {
        text = "Impuls " + prog.count + " von " + prog.total + " · zuletzt ausgelöst am " + fmt(prog.lastAt);
      }
    }
    return h("div", {style:{marginTop:6,fontSize:".76rem",color: done ? "var(--forest)" : "var(--muted)"}}, text);
  };

  useEffect(() => {
    const firestore = db();
    if (!firestore) { setLoading(false); return; }
    // GEÄNDERT (12.08.2026, Fund Rico "Anzeige nach Coaching-Art-Änderung veraltet"): von
    // einmaligem .get() auf einen echten Live-Listener (onSnapshot) umgestellt, analog zum
    // bereits bestehenden Muster in CoacheesPage (Zeile ~1880) — vorher musste der Phasen-Tab
    // neu geöffnet werden, um z.B. eine gerade in saveEdit() korrigierte packageType-Änderung
    // zu sehen. Läuft weiterhin auf die gesamte users-Collection, wie bisher.
    const unsub = firestore.collection("users").onSnapshot(snap => {
      const list = snap.docs.map(d => {
        const data = d.data();
        const raw = data.activePhase;
        let phase = null;
        if (raw != null) {
          if (typeof raw === 'number') phase = raw;
          else if (typeof raw === 'string') phase = parseInt(raw, 10) || null;
          else if (typeof raw.toNumber === 'function') phase = raw.toNumber();
          else if (typeof raw.valueOf === 'function') phase = parseInt(raw.valueOf(), 10) || null;
        }
        const n = data.name||"";
        const parts = n.trim().split(/\s+/);
        const initials = parts.length>=2 ? (parts[0][0]+(parts[parts.length-1][0])).toUpperCase() : n.slice(0,2).toUpperCase();
        return { uid: d.id, ...data, activePhase: phase, initials };
      });
      setCoachees(list);
      setLoading(false);
    }, () => setLoading(false));
    return () => unsub();
  }, []);

  // GEÄNDERT (20.08.2026, Rico-Wunsch "gleiches Muster auch für Transformationsphase 1–4"):
  // Bibliothek einmalig laden — ursprünglich nur Phase 5 (Integrationsphase), jetzt ALLE
  // Phasen (1–5) als Map id→{ids,total}, Grundlage für den Fortschritt "Impuls X von Y"
  // weiter unten, phasenunabhängig. Bewusst kein Live-Listener nötig, die Bibliothek ändert
  // sich nicht im laufenden Admin-Betrieb.
  const [libraryPhases, setLibraryPhases] = useState(null); // {[phaseId]: {ids:Set, total:number}} | null
  useEffect(() => {
    const firestore = db();
    if (!firestore) return;
    firestore.collection("settings").doc("impulse_library").get()
      .then(doc => {
        if (!doc.exists) return;
        const map = {};
        (doc.data().phases || []).forEach(p => {
          const impulse = p.impulse || [];
          map[p.id] = { ids: new Set(impulse.map(i => i.id)), total: impulse.length };
        });
        setLibraryPhases(map);
      })
      .catch(() => {});
  }, []);

  // GEÄNDERT (20.08.2026): pro Coachee mit bereits gestartetem Tagesimpuls-Plan einmalig
  // ermitteln, wie viele der Impulse SEINER aktuell aktiven Phase (egal ob Transformations-
  // phase 1–4 oder Integrationsphase/Phase 5) bereits ausgelöst wurden und wann der jüngste
  // davon war — ursprünglich nur für Integrationsphase gebaut (Kapitel 151), auf Ricos
  // Wunsch jetzt phasenunabhängig. Analog zur bestehenden phaseImpulseCount-Logik in
  // index.html (ImpulsPage), hier aber serverseitig für die Admin-Übersicht nachgebaut, da
  // admin.html impulse_entries bisher nirgends lädt. "Ausgelöst" = createdAt des
  // impulse_entries-Eintrags (wann der Impuls dem Coachee angeboten wurde), nicht das
  // spätere Abschlussdatum — auf Ricos Wunsch, siehe Kapitel 150.
  const [phaseProgress, setPhaseProgress] = useState({}); // uid -> {count, total, lastAt}
  useEffect(() => {
    if (!libraryPhases) return;
    const firestore = db();
    if (!firestore) return;
    const targets = coachees.filter(c => c.activePhase && c.impulsPlanStartedAt && libraryPhases[c.activePhase] && libraryPhases[c.activePhase].total);
    targets.forEach(c => {
      const info = libraryPhases[c.activePhase];
      firestore.collection("impulse_entries").where("uid","==",c.uid)
        .orderBy("createdAt","desc").limit(40).get()
        .then(snap => {
          const matched = snap.docs.filter(d => info.ids.has(d.data().impulsId));
          const count = matched.length;
          const lastAt = count ? matched[0].data().createdAt : null; // desc sortiert, erster Treffer = jüngster
          setPhaseProgress(p => ({...p, [c.uid]: { count, total: info.total, lastAt }}));
        })
        .catch(() => {});
    });
    // eslint-disable-next-line
  }, [libraryPhases, coachees.map(c => c.uid+"|"+c.activePhase+"|"+c.impulsPlanStartedAt).join(",")]);

  // GEÄNDERT (06.08.2026, Kapitel 51): Bug gefunden — impulsPlanStartedAt blieb bei einem
  // Phasenwechsel von der VORHERIGEN Phase stehen, wodurch die Karte weiterhin "Tagesimpuls-
  // Plan: aktiv seit [altes Datum]" zeigte statt wieder den Button "Tagesimpuls-Plan
  // starten" für die neue Phase. Fix: impulsPlanStartedAt wird bei jedem echten
  // Phasenwechsel explizit auf null zurückgesetzt.
  // GEÄNDERT (13.08.2026): Der frühere Guard brach bei Klick auf die BEREITS aktive Phase
  // komplett ab (kein Firestore-Write) — das verhinderte auch den einzigen Fall, in dem ein
  // erneuter Klick auf die aktive Phase sinnvoll ist: die Willkommensnachricht manuell
  // (erneut) auszulösen, z.B. bei einem brandneuen Coachee (activePhase ist von Anfang an 1,
  // ein "echter" Wechsel findet nie statt) oder wenn ein Push verpasst wurde. Fix: Klick auf
  // die aktive Phase schreibt jetzt stattdessen nur `phaseWelcomeRequestedAt` (neues Feld,
  // siehe functions/index.js `onPhaseWelcomeRequested`) — activePhase/impulsPlanStartedAt
  // bleiben unangetastet, ein laufender Tagesimpuls-Plan wird also NICHT zurückgesetzt.
  const setPhase = (uid, phase) => {
    const firestore = db();
    if (!firestore) return;
    const current = coachees.find(c => c.uid === uid);
    const isRepeat = current && current.activePhase === phase;
    setSaving(s => ({...s, [uid]: true}));
    const payload = isRepeat
      ? { phaseWelcomeRequestedAt: Date.now() }
      : { activePhase: phase, impulsPlanStartedAt: null };
    firestore.collection("users").doc(uid).set(payload, { merge: true })
      .then(() => {
        if (!isRepeat) {
          setCoachees(cs => cs.map(c => c.uid === uid ? {...c, activePhase: phase, impulsPlanStartedAt: null} : c));
        }
        setSaved(s => ({...s, [uid]: true}));
        setTimeout(() => setSaved(s => ({...s, [uid]: false})), 1800);
      })
      .catch(() => {})
      .finally(() => setSaving(s => ({...s, [uid]: false})));
  };

  const setPackage = (uid, pkg) => {
    const firestore = db();
    if (!firestore) return;
    firestore.collection("users").doc(uid).set({ packageType: pkg }, { merge: true })
      .then(() => setCoachees(cs => cs.map(c => c.uid === uid ? {...c, packageType: pkg} : c)))
      .catch(() => {});
  };

  // NEU (20.08.2026, Fund "Integrationsphase liefert keine Inhalte/keinen Start-Auslöser"):
  // Vorher schrieb der "Integrationsphase"-Button NUR packageType — activePhase blieb dabei
  // unangetastet (meist noch auf der letzten Transformationsphase-Nummer, z.B. 4), wodurch
  // index.html weiterhin Transformationsphase-4-Inhalte auslieferte statt des dedizierten
  // Integrationsphase-Pools (Bibliotheks-Phase-ID 5, siehe Projektdoku Kapitel 145) UND keine
  // der beiden bestehenden Cloud Functions (onActivePhaseChanged/onImpulsPlanStarted) je
  // feuerte, da beide ausschliesslich auf activePhase/impulsPlanStartedAt reagieren, nie auf
  // packageType. Fix: Integrationsphase wird jetzt intern wie eine reguläre Phase 5 behandelt
  // (analog zu setPhase oben) — dadurch greifen automatisch derselbe Willkommens-Push-
  // Mechanismus, dieselbe Bibliotheks-Zuordnung und derselbe "Tagesimpuls-Plan starten"-Trigger
  // wie bei den Phasen 1–4, ohne neue serverseitige Logik ausser der Textanpassung in
  // onActivePhaseChanged/onPhaseWelcomeRequested (siehe funktions-seitige Anpassung, separat
  // an Rico kommuniziert, da functions/index.js nicht Teil dieses Repos ist).
  const setIntegrationPhase = (uid) => {
    const firestore = db();
    if (!firestore) return;
    const current = coachees.find(c => c.uid === uid);
    const isRepeat = current && current.activePhase === 5 && current.packageType === "integration";
    setSaving(s => ({...s, [uid]: true}));
    const payload = isRepeat
      ? { phaseWelcomeRequestedAt: Date.now() }
      : { packageType: "integration", activePhase: 5, impulsPlanStartedAt: null };
    firestore.collection("users").doc(uid).set(payload, { merge: true })
      .then(() => {
        setCoachees(cs => cs.map(c => c.uid === uid
          ? (isRepeat ? {...c, packageType: "integration"} : {...c, packageType: "integration", activePhase: 5, impulsPlanStartedAt: null})
          : c));
        setSaved(s => ({...s, [uid]: true}));
        setTimeout(() => setSaved(s => ({...s, [uid]: false})), 1800);
      })
      .catch(() => {})
      .finally(() => setSaving(s => ({...s, [uid]: false})));
  };

  // NEU (06.08.2026, Kapitel 47, Trigger 2): getrennt vom Phasenwechsel (setPhase oben) —
  // schreibt impulsPlanStartedAt, was die neue Cloud Function onImpulsPlanStarted auslöst
  // und dort nextImpulseAt auf 1-2 Tage in die Zukunft setzt. Bewusst ein bewusster, von
  // Diana/Rico manuell ausgelöster zweiter Schritt (siehe Projektdoku Kapitel 47.1), erst
  // nachdem die erste Sitzung in der neuen Phase stattgefunden hat.
  const startImpulsPlan = (uid) => {
    const firestore = db();
    if (!firestore) return;
    setStarting(s => ({...s, [uid]: true}));
    const ts = Date.now();
    firestore.collection("users").doc(uid).set({ impulsPlanStartedAt: ts }, { merge: true })
      .then(() => {
        setCoachees(cs => cs.map(c => c.uid === uid ? {...c, impulsPlanStartedAt: ts} : c));
      })
      .catch(() => {})
      .finally(() => setStarting(s => ({...s, [uid]: false})));
  };

  const INTERVALS = {
    einzel:      { label: "Einzelcoaching",        sub: "4 Impulse · 2 Wochen · 2x/Woche, zufälliger Tag",  color: "var(--pkg-einzel)" },
    paar:        { label: "Paar- / Elterncoaching", sub: "4 Impulse · 4 Wochen · 1x/Woche, zufälliger Tag",  color: "var(--pkg-paar)" },
    integration: { label: "Integrationsphase",      sub: "1 Impuls/Woche · zufälliger Tag · 6 Monate",      color: "var(--pkg-integration)" }
  };

  // Fix (03.08.2026, Kapitel "Transformations-/Integrationsphase"): Coaching-Art (Einzel/
  // Paar/Eltern) kommt bereits aus der Coachee-Erfassung (Bearbeiten-Formular, "COACHING"-
  // Feld) — dort ist laut Rico nur EIN Wert wählbar, kein Mehrfach-Stacking nötig. Diese
  // Info wird hier nur noch read-only als Icon-Chip angezeigt (kein Button mehr, nicht
  // anklickbar), damit sie nicht doppelt erfasst werden muss. Einzige noch aktive
  // Auswahl pro Coachee ist der Umschalter Transformationsphase/Integrationsphase, da
  // NUR dieser die tatsächlich ausgespielten Tages-Impulse beeinflusst (packageType).
  const COACHING_ICON = {
    einzel: html`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
    paar:   html`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>`,
    eltern: html`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5" r="3"/><path d="M4 21v-2a4 4 0 014-4h0"/><circle cx="17" cy="8" r="2"/><path d="M14 21v-1.5a3 3 0 013-3h0a3 3 0 013 3V21"/></svg>`
  };
  // Basis-Package (einzel/paar) aus der Coaching-Art ableiten — "Eltern" fällt unter
  // dasselbe Package wie "Paar" (siehe INTERVALS.paar-Label "Paar- / Elterncoaching").
  const deriveBaseType = (c) => {
    const raw = Array.isArray(c.coaching) ? c.coaching[0] : c.coaching;
    const key = (raw || "").toLowerCase();
    return key === "paar" || key === "eltern" ? "paar" : "einzel";
  };

  if (loading) return html`<div style=${{color:"var(--muted)",padding:"40px 0",textAlign:"center"}}>Lade Coachees…</div>`;

  // NEU (12.08.2026): Tagesimpulse/Phasenwechsel sind konzeptionell nur für Package-Coachees
  // gedacht (Stunden-Coachees haben keinen Phasenwechsel-Bedarf) — daher hier gefiltert auf
  // Coachees, die beim Erfassen mit Modell "Package" angelegt wurden.
  const packageCoachees = coachees.filter(c => (c.modell || "").toLowerCase() === "package");

  if (!packageCoachees.length) return html`
    <div class="card" style=${{marginTop:16}}>
      <div style=${{color:"var(--muted)",fontSize:".9rem"}}>Keine Package-Coachees gefunden. Dieser Tab zeigt nur Coachees mit Modell "Package" (Stunden-Coachees benötigen keinen Phasenwechsel). Stelle sicher dass die Firestore Rules deployed sind und Coachees sich mindestens einmal eingeloggt haben.</div>
    </div>`;

  return html`
    <div>
      <p style=${{color:"var(--muted)",fontSize:".9rem",marginBottom:24}}>Wähle Package-Typ und aktive Phase pro Coachee. Nur Package-Coachees werden hier angezeigt.</p>
      ${packageCoachees.map(c => {
        const phase = c.activePhase || null;
        const baseType = deriveBaseType(c);
        const pkg = c.packageType || baseType;
        const isIntegration = pkg === "integration";
        const coachingRaw = Array.isArray(c.coaching) ? c.coaching[0] : c.coaching;
        const coachingKey = (coachingRaw || "").toLowerCase();
        const coachingLabel = coachingRaw || "—";
        const isSaving = saving[c.uid];
        const isSaved = saved[c.uid];
        const name = c.name || c.email || c.uid.slice(0,8);
        const interval = INTERVALS[pkg];
        const isStarting = starting[c.uid];
        return html`
          <div key=${c.uid} class="coachee-card" style=${{marginBottom:12}}>
            <div style=${{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:12,marginBottom:12}}>
              <div style=${{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
                <div style=${{minWidth:0}}>
                  <div style=${{fontWeight:700,fontSize:".92rem",color:"var(--text)"}}>${name}</div>
                  <div style=${{fontSize:".74rem",color:"var(--muted)"}}>${c.lastSeen?("Aktiv: "+fmtDate(c.lastSeen)):"App noch nicht geöffnet"}</div>
                </div>
              </div>
            </div>

            <!-- Read-only Chip: Coaching-Art (aus Coachee-Erfassung, hier nicht änderbar) -->
            <div style=${{display:"flex",gap:8,marginBottom:12}}>
              <div style=${{display:"flex",alignItems:"center",gap:5,background:"var(--teal-pale)",borderRadius:8,padding:"5px 10px"}}>
                ${COACHING_ICON[coachingKey] ? h("span",{style:{color:"var(--teal-dark)",display:"flex"}},COACHING_ICON[coachingKey]) : null}
                <span style=${{fontSize:".72rem",fontWeight:700,color:"var(--teal-dark)"}}>${coachingLabel}</span>
              </div>
            </div>

            <!-- Umschalter: einzige noch aktive Auswahl — steuert packageType direkt.
                 GEÄNDERT (20.08.2026, Rico-Vorgabe "Rückweg von Integrationsphase zu
                 Transformationsphase nicht erwünscht, sonst Verwirrung"): Rückweg jetzt
                 bewusst in der Admin-UI gesperrt, nicht nur ein Anzeige-Detail — Gesamtcheck
                 hatte gezeigt, dass ein Klick auf "Transformationsphase" bei bereits aktiver
                 Integrationsphase NUR packageType umschreibt, activePhase/impulsPlanStartedAt
                 aber unverändert auf 5 stehen liess: der Coachee bekam serverseitig
                 weiterhin Integrationsphase-Inhalte, während die Karte bereits irreführend
                 "Phase 5 aktiv" unter dem Transformationsphase-Label zeigte. Fix: sobald
                 isIntegration true ist, ist der "Transformationsphase"-Button deaktiviert
                 (disabled, kein onClick-Effekt, eigener erklärender Tooltip) — ein Rückweg
                 ist so aus der Admin-Oberfläche heraus gar nicht mehr möglich. -->
            <div style=${{display:"flex",gap:6,marginBottom:12}}>
              <button onClick=${() => { if (!isIntegration) setPackage(c.uid, baseType); }} disabled=${isIntegration}
                title=${isIntegration ? "Rückweg von Integrationsphase zu Transformationsphase ist nicht vorgesehen" : "Transformationsphase"}
                style=${{
                  flex:1, padding:"9px 0", borderRadius:9, border:"1.5px solid",
                  borderColor: !isIntegration ? "var(--forest-dark)" : "var(--border2)",
                  background: !isIntegration ? "var(--forest)" : "transparent",
                  color: !isIntegration ? "#fff" : "var(--muted)",
                  fontSize:".8rem", fontWeight:700,
                  cursor: isIntegration ? "not-allowed" : "pointer",
                  opacity: isIntegration ? .5 : 1,
                  transition:"all .15s"
                }}
              >Transformationsphase</button>
              <button onClick=${() => setIntegrationPhase(c.uid)} disabled=${isSaving}
                title=${isIntegration ? "Willkommensnachricht für Integrationsphase erneut senden" : "Integrationsphase"}
                style=${{
                  flex:1, padding:"9px 0", borderRadius:9, border:"1.5px solid",
                  borderColor: isIntegration ? "var(--forest-dark)" : "var(--border2)",
                  background: isIntegration ? "var(--forest)" : "transparent",
                  color: isIntegration ? "#fff" : "var(--muted)",
                  fontSize:".8rem", fontWeight:700, cursor:"pointer", transition:"all .15s"
                }}
              >Integrationsphase</button>
            </div>

            ${!isIntegration && html`
              <div style=${{display:"flex",gap:6,alignItems:"center",flexWrap:"nowrap",marginBottom:10}}>
                ${[1,2,3,4].map(n => {
                  const isActive = phase == n;
                  return html`
                    <button key=${n} onClick=${() => setPhase(c.uid, n)} disabled=${isSaving}
                      title=${isActive ? "Willkommensnachricht für Phase " + n + " erneut senden" : "Phase " + n}
                      style=${{
                        width:38, height:38, borderRadius:"50%",
                        border: isActive ? "2.5px solid var(--forest-dark)" : "1px solid var(--border2)",
                        background: isActive ? "var(--forest)" : "transparent",
                        color: isActive ? "#fff" : "var(--muted)",
                        fontWeight:500, fontSize:"14px", cursor:"pointer",
                        transition:"all .15s", display:"flex", alignItems:"center", justifyContent:"center",
                        flexShrink:0
                      }}
                    >${n}</button>`;
                })}
                ${isSaved && html`<span style=${{fontSize:".78rem",color:"var(--forest)",fontWeight:700,marginLeft:4}}>✓</span>`}
              </div>
              <!-- NEU (16.08.2026): Statuszeile ersetzt den bisherigen Send-Badge — zeigt
                   textuell statt per Icon-Overlay, ob für die aktuell aktive Phase bereits
                   eine Willkommensnachricht ausgelöst wurde. Bezieht sich rein auf phase
                   (gesetzt = mindestens einmal ausgelöst, da setPhase bei echtem Wechsel
                   immer sofort einen Push sendet), kein neues Feld nötig. -->
              <div style=${{fontSize:".78rem",color: phase ? "var(--forest)" : "var(--muted)",marginBottom:10}}>
                ${phase ? "Willkommensnachricht gesendet" : "Willkommensnachricht noch nicht gesendet"}
              </div>`}

            <!-- GEÄNDERT (20.08.2026, Fehlermeldung Rico "zwei Icons, wofür, Anordnung falsch"):
                 Der separate Wiederholen-Icon-Button ist entfernt — er war ohnehin redundant:
                 der "Integrationsphase"-Button oben hat keinen disabled-Zustand und ruft bei
                 erneutem Klick (auch wenn bereits aktiv) exakt dieselbe setIntegrationPhase()-
                 Funktion mit identischem isRepeat-Zweig auf, genau wie ein erneuter Klick auf
                 einen bereits aktiven Phasenkreis bei Phase 1–4. Kein Funktionsverlust. Rico
                 zusätzlich: die "gesendet"-Rückmeldung ist ohnehin nur eine serverseitige
                 Auslöse-Bestätigung, keine echte Zustellbestätigung beim Coachee — daher hier
                 bewusst nicht durch ein neues Icon ersetzt, sondern ersatzlos vereinfacht. -->
            ${isIntegration && html`
              <div style=${{fontSize:".78rem",color: phase === 5 ? "var(--forest)" : "var(--muted)",marginBottom:10}}>
                ${phase === 5 ? "Willkommensnachricht gesendet" : "Willkommensnachricht noch nicht gesendet"}
              </div>`}

            <!-- Anmerkungszeile unten bleibt erhalten (auf Ricos Wunsch) -->
            <div style=${{display:"flex",alignItems:"center",gap:8,paddingTop:8,borderTop:"1px solid var(--border)"}}>
              <div style=${{width:8,height:8,borderRadius:"50%",background:interval.color,flexShrink:0}}></div>
              <div style=${{fontSize:".78rem",color:"var(--muted)"}}>${interval.sub}${isIntegration ? (phase === 5 ? " · Integrationsphase aktiv" : " · Noch nicht gestartet") : (phase ? " · Phase " + phase + " aktiv" : " · Keine Phase gewählt")}</div>
            </div>

            <!-- NEU (06.08.2026, Kapitel 47, Trigger 2): getrennt vom Phasenwechsel — startet
                 den eigentlichen Tagesimpuls-Rhythmus erst, wenn Diana/Rico bewusst klicken
                 (nach Workbook-Bearbeitung + erster Sitzung der neuen Phase). GEÄNDERT
                 (20.08.2026): vorher nur für Transformationsphase sichtbar (!isIntegration &&
                 phase) — die Integrationsphase brauchte denselben bewussten Start-Schritt
                 genauso (phase ist jetzt bei Integrationsphase intern 5, siehe
                 setIntegrationPhase oben), daher reicht die Bedingung "phase" allein. -->
            ${phase && html`
              <div style=${{marginTop:10,paddingTop:10,borderTop:"1px solid var(--border)"}}>
                ${c.impulsPlanStartedAt && html`
                  <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                    <span style=${{fontSize:".78rem",color:"var(--forest)"}}>Tagesimpuls-Plan: aktiv seit ${fmtDateAbs(c.impulsPlanStartedAt)}</span>
                    ${h(Ic,{name:"check",size:15,style:{color:"var(--forest)"}})}
                  </div>
                  ${phaseStatusLine(phaseProgress[c.uid], fmtDateAbs)}`}
                ${!c.impulsPlanStartedAt && html`
                  <button onClick=${() => startImpulsPlan(c.uid)} disabled=${isStarting}
                    style=${{
                      width:"100%", padding:"9px 0", borderRadius:9, border:"none",
                      background:"var(--forest)", color:"#fff", fontSize:".8rem", fontWeight:700,
                      cursor: isStarting ? "default" : "pointer", display:"flex", alignItems:"center",
                      justifyContent:"center", gap:6
                    }}
                  >${h(Ic,{name:"play",size:14})}${isStarting ? "Wird gestartet…" : "Tagesimpuls-Plan starten"}</button>`}
              </div>`}
          </div>`;
      })}
    </div>`;
}

// Zeigt Coachee-seitige JS-/Firestore-Fehler, die index.html still im Hintergrund
// nach error_logs schreibt. Kein Coachee-UI betroffen — reine Admin-Ansicht.
function ErrorLogPage({errorLogs}) {
  const [showResolved,setShowResolved] = useState(false);
  const markResolved = (docId) => {
    const firestore = db();
    if(!firestore) return;
    firestore.collection("error_logs").doc(docId).update({resolved:true}).catch(()=>{});
  };
  const visible = errorLogs.filter(e => showResolved || !e.resolved);
  const openCount = errorLogs.filter(e => !e.resolved).length;
  const fmtTs = ts => { try { return new Date(ts).toLocaleString("de-CH",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); } catch(e) { return ""; } };

  return html`
    <div class="page">
      <div style=${{marginBottom:20,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div style=${{display:"flex",alignItems:"center",gap:10}}>
          <${Ic} name="alert" size=${20} style=${{color:"#993C1D"}}/>
          <div style=${{fontFamily:"'Manuale',serif",fontSize:"1.2rem",fontWeight:700,color:"var(--text)"}}>Fehler-Log</div>
          ${openCount>0&&html`<span style=${{fontSize:".75rem",fontWeight:700,padding:"3px 10px",borderRadius:20,background:"#F5C4B3",color:"#4A1B0C"}}>${openCount} offen</span>`}
        </div>
        <label style=${{display:"flex",alignItems:"center",gap:6,fontSize:".82rem",color:"var(--muted)",cursor:"pointer"}}>
          <input type="checkbox" checked=${showResolved} onChange=${e=>setShowResolved(e.target.checked)}/>
          Erledigte anzeigen
        </label>
      </div>

      ${visible.length===0&&html`
        <div class="card" style=${{textAlign:"center",color:"var(--muted)",padding:"32px 16px"}}>
          Keine ${showResolved?"":"offenen "}Fehlermeldungen.
        </div>`}

      <div style=${{display:"flex",flexDirection:"column",gap:8}}>
        ${visible.map(e => {
          const statusEl = e.resolved
            ? html`<span style=${{fontSize:12,color:"#3b6d11",display:"flex",alignItems:"center",gap:4}}><${Ic} name="check" size=${13}/> Erledigt</span>`
            : html`<button class="btn btn-ghost btn-sm" onClick=${()=>markResolved(e.docId)}>Als erledigt markieren</button>`;
          const contextEl = e.context ? html`<b>${e.context}:</b> ` : "";
          return html`
          <div key=${e.docId} class="card" style=${{padding:"10px 14px",opacity:e.resolved?0.55:1}}>
            <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
              <div style=${{display:"flex",alignItems:"center",gap:8}}>
                <span style=${{fontSize:11,fontFamily:"monospace",padding:"2px 8px",borderRadius:6,background:e.resolved?"var(--border2)":"#F0997B",color:e.resolved?"var(--muted)":"#4A1B0C",fontWeight:700}}>${e.errorCode||"?"}</span>
                <span style=${{fontSize:13,color:"var(--text)"}}>${e.name||e.uid||"Unbekannt"}</span>
              </div>
              <span style=${{fontSize:12,color:"var(--muted)"}}>${fmtTs(e.ts)}</span>
            </div>
            <div style=${{fontSize:13,color:"var(--text)",opacity:.85,marginTop:6,lineHeight:1.5,wordBreak:"break-word"}}>
              ${contextEl}${e.message||""}
            </div>
            <div style=${{display:"flex",justifyContent:"flex-end",marginTop:8}}>
              ${statusEl}
            </div>
          </div>`;
        })}
      </div>
    </div>`;
}

function DoodlePage({doodles,setDoodles,coachees,adminUid}) {
  const [showCreate,setShowCreate] = useState(false);
  const [showResults,setShowResults] = useState(null);
  const [showConfirmed,setShowConfirmed] = useState(null);
  const [selectedSlots,setSelectedSlots] = useState([]); // Mehrfachauswahl im Ergebnisse-Modal (Kapitel 98.2)
  const [newTitle,setNewTitle] = useState("");
  const [newDesc,setNewDesc] = useState("");
  const [newSlots,setNewSlots] = useState([]); // {dt, audience, note} — audience: null|"gemeinsam"|uid (Kapitel 98, Termin-Set)
  const [blockDt,setBlockDt] = useState({}); // Entwurfs-Datum pro Block ("all"|"gemeinsam"|uid)
  const [blockTitle,setBlockTitle] = useState({}); // Entwurfs-Titel pro Block (Kapitel 98.3)
  const [blockNote,setBlockNote] = useState({}); // Entwurfs-Bemerkung pro Block (Kapitel 98.4)
  const [selRecip,setSelRecip] = useState([]);
  const [doodleCat,setDoodleCat] = useState([]);
  const [catModeActive,setCatModeActive] = useState(false);
  const [recipSearch,setRecipSearch] = useState("");

  const localDtStr = (d) => { const pad=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); };
  const defaultDt = () => { const d=new Date(); d.setDate(d.getDate()+1); d.setHours(10,0,0,0); return localDtStr(d); };

  // Termin-Set (Kapitel 98): bei genau 2 ausgewählten Empfängern (Paar) wird die Terminliste in drei Blöcke
  // aufgeteilt — Runder Tisch (beide) + je ein Einzeltermin-Block. Sonst wie bisher ein einzelner Block.
  const isPair = selRecip.length===2;
  const blockDefs = isPair ? [
    {key:"gemeinsam",label:"Runder Tisch",icon:"users",audience:"gemeinsam"},
    {key:selRecip[0],label:"Einzeltermin "+(coachees.find(c=>c.id===selRecip[0])?.name||""),icon:"user",audience:selRecip[0]},
    {key:selRecip[1],label:"Einzeltermin "+(coachees.find(c=>c.id===selRecip[1])?.name||""),icon:"user",audience:selRecip[1]},
  ] : [
    {key:"all",label:"Zeitvorschläge",icon:null,audience:null}
  ];

  const addSlotToBlock = (block) => {
    const dt = blockDt[block.key] || defaultDt();
    if(!dt) return;
    if(newSlots.some(s=>s.dt===dt && s.audience===block.audience)) return;
    setNewSlots(s=>[...s,{dt,audience:block.audience,note:(blockNote[block.key]||"").trim(),title:(blockTitle[block.key]||"").trim()}]);
    const d=new Date(dt); d.setHours(d.getHours()+2);
    setBlockDt(bd=>({...bd,[block.key]:localDtStr(d)}));
    setBlockTitle(bt=>({...bt,[block.key]:""}));
    setBlockNote(bn=>({...bn,[block.key]:""}));
  };

  const getCoacheeCats = c => [...(Array.isArray(c.coaching)?c.coaching:(c.coaching?[c.coaching]:[])), ...(Array.isArray(c.gender)?c.gender:(c.gender?[c.gender]:[])), ...(c.categories||[])];

  const toggleDoodleCat = cat => {
    setCatModeActive(true);
    setDoodleCat(prev=>{
      const next = cat===null ? [] : (prev.includes(cat)?prev.filter(x=>x!==cat):[...prev,cat]);
      const matching = next.length===0 ? coachees : coachees.filter(c=>next.some(sel=>catMatches(getCoacheeCats(c), sel)));
      setSelRecip(matching.map(c=>c.id));
      return next;
    });
  };

  // Manuelle Checkbox-Änderung in "Senden an": deaktiviert den Kategorie-Modus,
  // damit Alle/Paare/Einzel... nicht mehr fälschlich als aktiv markiert bleiben.
  const toggleManualRecip = id => {
    setCatModeActive(false);
    setSelRecip(r=>r.includes(id)?r.filter(x=>x!==id):[...r,id]);
  };

  const createDoodle = () => {
    if(!newTitle.trim()||newSlots.length<1||selRecip.length<1) return;
    const nd={id:"d"+Date.now(),title:newTitle.trim(),desc:newDesc.trim()||"Wähle alle möglichen Termine aus.",status:"open",recipients:[...selRecip],
      slots:newSlots.map(s=>({dt:s.dt,votes:{},note:(s.note||"").trim(),...(s.title&&s.title.trim()?{title:s.title.trim()}:{}),...(s.audience?{audience:s.audience}:{})}))};
    setShowCreate(false);setNewTitle("");setNewDesc("");setNewSlots([]);setBlockDt({});setBlockTitle({});setBlockNote({});setSelRecip([]);setDoodleCat([]);setCatModeActive(false);setRecipSearch("");
    setDoodles(ds=>[nd,...ds]);
    const firestore = db();
    if(firestore){
      firestore.collection("doodles").doc(String(nd.id)).set(nd)
        .then(()=>showToast("✓ Terminvorschlag erstellt"))
        .catch(e=>{ setDoodles(ds=>ds.filter(d=>d.id!==nd.id)); showToast("✗ Terminvorschlag konnte nicht gespeichert werden: "+(e&&e.message||"Fehler")); });
    } else {
      setDoodles(ds=>ds.filter(d=>d.id!==nd.id));
      showToast("✗ Keine Verbindung zur Datenbank");
    }
  };

  const bestSlotIdx = d => {
    let best=-1,bestCount=-1;
    toSlotsArray(d.slots).forEach((s,i)=>{
      if(!s) return;
      const yes=Object.values(s.votes||{}).filter(v=>v==="yes").length;
      if(yes>bestCount){bestCount=yes;best=i;}
    });
    return best;
  };

  const toggleSelectedSlot = i => setSelectedSlots(s=>s.includes(i)?s.filter(x=>x!==i):[...s,i]);

  // Mehrfachbestätigung (Kapitel 98.2): Admin kann beliebig viele Termine gleichzeitig bestätigen —
  // z.B. mehrere tatsächlich stattfindende Termine innerhalb eines Doodles. Gilt für alle Doodles,
  // unabhängig davon, ob sie über das Termin-Set (Runder Tisch/Einzeltermine) getaggt sind.
  const confirmSelectedSlots = (did) => {
    if(selectedSlots.length<1) return;
    const doodle = doodles.find(x=>x.id===did);
    const sorted = [...selectedSlots].sort((a,b)=>a-b);
    setDoodles(ds=>ds.map(x=>x.id===did?{...x,status:"closed",confirmedSlots:sorted}:x));
    const firestore = db();
    if(firestore) firestore.collection("doodles").doc(String(did)).update({status:"closed",confirmedSlots:sorted}).catch(()=>{});
    setShowResults(null);setSelectedSlots([]);
    showToast("✓ "+sorted.length+" Termin"+(sorted.length===1?"":"e")+" bestätigt");
  };

  const resultDoodle = doodles.find(d=>d.id===showResults);

  return html`
    <div class="page">
      <div class="doodle-header" style=${{marginBottom:24}}>
        <div style=${{display:"flex",alignItems:"center",gap:12,minWidth:0}}>
          <${Logo} size=${44}/>
          <div style=${{minWidth:0}}>
            <div style=${{fontFamily:"'Manuale',serif",fontSize:"1.2rem",fontWeight:700,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Termine & Events</div>
            <div style=${{fontSize:".82rem",color:"var(--muted)",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Terminvorschläge koordinieren.</div>
          </div>
        </div>
        <div class="doodle-header-btn-wrap">
          <button style=${{background:"var(--teal)",color:"#fff",border:"none",borderRadius:10,padding:"9px 12px",fontSize:".75rem",fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:5,flexShrink:0}} onClick=${()=>{setBlockDt({all:defaultDt()});setShowCreate(true);}}><${Ic} name="plus" size=${13}/> Neuer Doodle</button>
        </div>
      </div>

      ${doodles.length===0&&html`<div style=${{textAlign:"center",padding:"48px",color:"var(--muted)"}}><p>Noch kein Terminvorschlag erstellt.</p></div>`}

      ${doodles.filter(d=>!(d.dismissed||[]).includes(adminUid)).map(d=>{

      ${/* RESULTS MODAL */showResults&&resultDoodle&&(()=>{

// Datum-Hilfsfunktionen — cross-browser sicher
const dateKeyFromTs = ts => { const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const formatDateKey = key => { try { const p=key.split('-'); const d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); const months=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember']; return d.getDate()+'. '+months[d.getMonth()]+' '+d.getFullYear(); } catch(e){return key;} };
function Root() {
  const [user,setUser]     = useState(null);
  const [ready,setReady]   = useState(false);

  useEffect(()=>{
    let unsub;
    let settled = false;
    const finish = (u) => {
      if(settled) return;
      settled = true;
      if(u !== undefined) setUser(u);
      setReady(true);
    };
    // Fix (07.08.2026, 2. Runde): Erster Versuch (Retry auf `window._fb.auth`) griff zu kurz —
    // `firebase.auth()` liefert praktisch sofort ein Auth-Objekt zurück, der Retry-Fallback
    // wurde also nie erreicht. Das eigentliche Hängenbleiben passiert INNERHALB von Firebase:
    // `onAuthStateChanged` feuert manchmal nie ein erstes Mal, wenn das interne Lesen des
    // persistierten Login-Status (IndexedDB, `setPersistence(LOCAL)`) blockiert — bekanntes
    // Verhalten bei als Home-Bildschirm-App installierten iOS-PWAs (Safari-Standalone-Modus).
    // Deshalb jetzt ein UNBEDINGTER Sicherheits-Timeout zusätzlich zum Retry: `ready` wird so
    // oder so nach spätestens 8s freigegeben, unabhängig davon, ob `onAuthStateChanged` je
    // feuert. Gleiches Watchdog-Prinzip wie der bestehende äussere Kaltstart-Watchdog (Kapitel 32),
    // hier zusätzlich innerhalb der Komponente für genau diesen inneren Hänger.
    const safetyTimeout = setTimeout(() => finish(null), 8000);
    const tryAuth = (attempts) => {
      const auth = window._fb?.auth;
      if(auth) {
        // Handle redirect result first (Google Sign-In on mobile)
        auth.getRedirectResult().catch(()=>{});
        unsub = auth.onAuthStateChanged(u=>{ finish(u); });
      } else if(attempts < 20) {
        setTimeout(()=>tryAuth(attempts+1), 300);
      } else {
        // Firebase-Skripte konnten nicht geladen werden — App trotzdem freigeben statt endlos zu laden
        finish(null);
      }
    };
    tryAuth(0);
    return ()=>{ clearTimeout(safetyTimeout); if(unsub) unsub(); };
  },[]);

  if(!ready) return html`
    <div style=${{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"var(--bg)",gap:16}}>
      <div style=${{fontFamily:"'Exo 2',sans-serif",fontSize:".72rem",fontWeight:600,color:"#B8860B",letterSpacing:"1px"}}>88445719</div>
      <${Wordmark} dark=${true} height=${52}/>
      <svg width="36" height="36" viewBox="0 0 36 36" style=${{animation:"spin .8s linear infinite",willChange:"transform"}}>
        <circle cx="18" cy="18" r="15" fill="none" stroke="var(--border)" stroke-width="3"/>
        <circle cx="18" cy="18" r="15" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-dasharray="23.5 70.6"/>
      </svg>
      <p style=${{color:"var(--muted)",fontSize:".84rem"}}>Admin-Portal lädt…</p>
    </div>`;

  if(!user) return html`<${LoginPage}/>`;

  return html`<${AdminApp} user=${user}/>`;
}

// ── Fehler-Overlay (analog index.html, Kapitel 44.6) ──
window._showAdminCrashScreen = function(errorInfo) {
  var root = document.getElementById('root');
  if(!root) return;
  root.innerHTML = '';
  var div = document.createElement('div');
  div.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f8f6f0;padding:32px 24px;text-align:center;font-family:Arial,sans-serif';
  div.innerHTML = '<div style="font-size:52px;margin-bottom:16px">⚠️</div>'
    + '<div style="font-size:1.2rem;font-weight:700;color:#1C1914;margin-bottom:10px">Etwas ist schiefgelaufen</div>'
    + '<div style="font-size:.85rem;color:#6B7280;line-height:1.6;max-width:300px;margin-bottom:24px">Die App hat einen unerwarteten Fehler. Bitte lade sie neu — das löst meistens das Problem.</div>'
    + '<button onclick="hardReload()" style="background:#156e6e;color:#fff;border:none;border-radius:10px;padding:11px 28px;font-size:.9rem;font-weight:600;cursor:pointer">App neu laden</button>'
    + '<div style="margin-top:20px;font-size:.72rem;color:#9CA3AF">Bleibt das Problem? info@selbstwirksamkeit.ch</div>'
    + (errorInfo ? '<div style="margin-top:22px;width:100%;max-width:340px;text-align:left;font-family:monospace;font-size:.68rem;color:#7A756B;background:#EFECE5;border:0.5px solid #D0CBC4;border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text">' + String(errorInfo).replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' : '');
  root.appendChild(div);
};

document.getElementById('root').innerHTML = '';
render(h(Root,null), document.getElementById('root'));
window._rswAdminAppRendered = true;
