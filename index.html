  // angenommener, noch nicht reflektierter Impuls vorliegt (step===1 — dieselbe
  // Datenlage, die auch ohne Push zu Step 1 führt). Gleiches Warten-auf-echte-Daten-
  // Muster wie oben (Pitfall 42): impuls/step starten beim Kaltstart als Platzhalter.
  useEffect(() => {
    if(!pendingReflexionPopup) return;
    if(!impuls) return;
    if(step === 1) setShowReflexionPopup(true);
    if(setPendingReflexionPopup) setPendingReflexionPopup(false);
  }, [pendingReflexionPopup, impuls, step]);

  useEffect(() => {
    // Fix (10.08.2026, Pitfall 69): Sobald der Willkommens-Screen in diesem Mount einmal
    // gezeigt wurde, darf dieser Effect bei einem erneuten Durchlauf (ausgelöst durch eine
    // spätere activeImpuls-Änderung, siehe welcomeShownRef-Deklaration oben) NICHTS mehr
    // überschreiben — weder den Dismiss-Fall (step 6) noch die normale Impuls-Ladelogik.
    // Der Screen bleibt bis zum expliziten "Alles klar"-Klick (setPage → Unmount) stabil.
    if (welcomeShownRef.current) return;
    // Fix: localStorage-Check zuerst — unabhängig von Firestore
    // WICHTIG: Bei Push-Tap (pendingImpulsPopup, Hash #impulse-tages) NICHT auf den
    // lokalen Dismiss-Flag verlassen — der Push selbst ist das autoritative Signal,
    // dass gerade ein frischer Impuls ansteht (z.B. nach Admin-Phasenwechsel). Sonst
    // würde ein früherer "Heute nicht"-Klick im Tagesverlauf jeden weiteren Push für
    // den Rest des Tages stumm verschlucken (step===6 → kompletter Render-Abbruch,
    // impuls wird nie aus Firestore geladen).
    const todayStr2 = new Date().toISOString().split("T")[0];
    const dismissedKey = "impuls_dismissed_" + (user?.uid || "guest");
    const dismissedDate = localStorage.getItem(dismissedKey);
    if (dismissedDate === todayStr2 && !pendingImpulsPopup) { setStep(6); return; }

    const fbDb = window._fb?.db;
    if (!fbDb || !user?.uid) return;
    const todayStr = new Date().toISOString().split("T")[0];
    // Fix (10.08.2026, Pitfall 71): users/{uid}.get() ohne source-Angabe kann beim
    // Kaltstart über Push-Tap (schwaches Netz, Firestore-Verbindung noch nicht
    // etabliert) stillschweigend einen veralteten lokalen Cache-Wert statt des
    // frischen Server-Stands liefern. Das führte dazu, dass activePhase nach einem
    // Admin-Phasenwechsel kurzzeitig noch die ALTE Phase zeigte, der
    // phaseWelcomeSeen_-Vergleich dadurch fälschlich KEINEN Mismatch erkannte und
    // statt des Willkommens-Screens der alte Tagesimpuls der vorherigen Phase
    // erschien — bis ein späterer Effect-Durchlauf (activeImpuls-Änderung) den
    // inzwischen korrekten Server-Wert nachlieferte. Gleiches Prinzip wie
    // Kapitel 34.2: ein echter Push-Tap ist ein autoritatives, aktuelles Signal
    // und muss einen veralteten Cache-Stand überstimmen — daher hier gezielt
    // {source:'server'} erzwingen, aber NUR im Push-Fall (pendingImpulsPopup),
    // mit Fallback auf den normalen (cache-fähigen) .get() falls wirklich offline.
    const userDocPromise = pendingImpulsPopup
      ? fbDb.collection("users").doc(user.uid).get({source:"server"})
          .catch(() => fbDb.collection("users").doc(user.uid).get())
      : fbDb.collection("users").doc(user.uid).get();
    // Fix: settings/impulse_library und users/{uid} sind voneinander unabhängig —
    // parallel per Promise.all statt verschachtelt sequenziell laden. Spart einen
    // vollen Firestore-Round-Trip, spürbar v.a. bei Kaltstart über Push-Tap auf
    // schwachem Netz (nur impulse_entries hängt wirklich von activePhase ab und
    // bleibt daher als dritter, abhängiger Schritt bestehen).
    Promise.all([
      fbDb.collection("settings").doc("impulse_library").get(),
      userDocPromise
    ])
      .then(([doc, uDoc]) => {
        const getData = (data) => {
          const uData = uDoc.exists ? uDoc.data() : {};
          const activePhase = uData.activePhase || 1;
          const nextImpulseAt = uData.nextImpulseAt || 0;
          setActivePhaseNum(activePhase);

          // NEU (06.08.2026, Variante A): Willkommens-Screen bei Phasenwechsel. Ein rein
          // lokaler localStorage-Vergleich (kein neues Firestore-Feld nötig) — sobald die
          // gespeicherte "zuletzt gesehene Phase" von der aktuellen activePhase abweicht,
          // wird einmalig der Willkommens-Screen (step===7) gezeigt statt des normalen
          // Tagesimpuls-Flows. Fehlt der Flag komplett (bestehende Coachees vor diesem
          // Update, oder allererster App-Start), wird er nur gesetzt, OHNE den Screen zu
          // zeigen — kein rückwirkendes/verfrühtes "Willkommen" für längst laufende Phasen.
          const phaseSeenKey = "phaseWelcomeSeen_" + (user?.uid || "guest");
          const seenPhase = localStorage.getItem(phaseSeenKey);
          if (seenPhase === null) {
            localStorage.setItem(phaseSeenKey, String(activePhase));
          } else if (Number(seenPhase) !== activePhase) {
            localStorage.setItem(phaseSeenKey, String(activePhase));
            setWelcomePhase(activePhase);
            setStep(7);
            welcomeShownRef.current = true; // Fix (10.08.2026, Pitfall 69): siehe Deklaration oben —
              // ab hier ignoriert dieser Effect jeden weiteren Durchlauf in diesem Mount.
            if (setPendingImpulsPopup) setPendingImpulsPopup(false);
            return;
          }

          const phase = (data.phases || []).find(p => p.id === activePhase);
          const impulse = phase ? (phase.impulse || []) : [];
          fbDb.collection("impulse_entries").where("uid","==",user.uid)
            .orderBy("createdAt","desc").limit(30).get()
            .then(snap => {
              const done = snap.docs.map(d => d.data().impulsId).filter(Boolean);
              // NEU (12.08.2026): done nur auf die Impuls-IDs der AKTUELLEN Phase eingrenzen —
              // Grundlage für die Pause-Logik in saveAndFinish(), siehe phaseImpulseCount-State.
              const doneInPhase = done.filter(id => impulse.some(imp => imp.id === id)).length;
              setPhaseImpulseCount({ done: doneInPhase, total: impulse.length });
              // NEU (13.08.2026, Kapitel 88): Phase fertig = alle Impulse der aktuellen Phase
              // bereits absolviert. Direkt aus done/impulse berechnet statt aus dem
              // nextImpulseAt-Pausierungs-Sentinel (der nur den Push-Rhythmus steuert, siehe
              // Kapitel 87) — bleibt so robust, auch wenn pendingImpulsPopup gerade true ist
              // oder nextImpulseAt aus älteren Daten vor diesem Fix stammt.
              const phaseFinished = impulse.length > 0 && doneInPhase >= impulse.length;
              const next = impulse.find(imp => !done.includes(imp.id)) || impulse[0];
              setImpuls(next || null);
              const todayEntry = snap.docs.find(d => d.data().date === todayStr);
              if (todayEntry) {
                const s = todayEntry.data().status;
                if (s === "active") {
                  setStep(1); setActiveEntryRef(todayEntry.ref);
                  // Fix (03.08.2026, Fund "Tagesimpulse stimmen nicht überein"): impuls-State
                  // wurde bisher NICHT auf den tatsächlich aktiven Eintrag zurückgesetzt, sondern
                  // blieb auf dem einige Zeilen weiter oben berechneten "next" (nächster, noch
                  // nicht in impulse_entries vorhandener Impuls aus der Phasen-Bibliothek) stehen
                  // — dieser next-Wert ist bewusst korrekt für step===0 (nächster anzubietender
                  // Impuls), aber falsch für step===1 (hier muss der HEUTE bereits angenommene
                  // Impuls angezeigt werden). Home-Karte zeigte dadurch einen anderen Text als
                  // der Tages-Impuls-Tab. Analog zum bereits korrekten Fallback-Pfad (Zeile
                  // ~3174) wird impuls jetzt explizit auf den todayEntry-Text gesetzt.
                  setImpuls({ id: todayEntry.data().impulsId, text: todayEntry.data().impulsText, hint: "", page: todayEntry.data().impulsPage || null });
                }
                else if (pendingImpulsPopup) {
                  // Fix (02.07.2026, Kapitel 35, Fund "Admin-Phasenwechsel-Push erscheint
                  // trotz nextImpulseAt-Fix weiterhin nicht, wenn heute schon getestet wurde"):
                  // Ein bereits abgeschlossener/abgelehnter heutiger Tageseintrag (done/skipped/
                  // closed_no_reflexion) wurde bisher UNBEDINGT ausgewertet — noch bevor geprüft
                  // wurde, ob gerade ein neuer, admin-ausgelöster Push angekommen ist. Jeder
                  // frühere Entscheid desselben Tages (auch aus reinen Testzwecken) blockierte
                  // dadurch jeden weiteren Phasenwechsel-Push, komplett unabhängig vom bereits
                  // behobenen nextImpulseAt-Fall. Gleiches Prinzip wie dort: der Push selbst ist
                  // das autoritative, aktuellere Signal — Step 0 zeigt den frischen, neu
                  // geladenen Impuls (impuls-Variable spiegelt bereits die NEUE Phase wider),
                  // ImpulsPushPopup erscheint darauf über seinen eigenen step===0-Effect.
                  // Status "active" bewusst ausgenommen: ein noch offener, bereits angenommener
                  // Impuls soll nicht stillschweigend überschrieben werden.
                  setStep(0);
                }
                else if (s === "done") setStep(4);
                else if (s === "skipped") setStep(6);
                else setStep(5);
              } else if (phaseFinished) {
                // NEU (13.08.2026, Kapitel 88): Statt auf den (dann bereits erneut angebotenen)
                // ersten Impuls der Phase zurückzufallen, wird der bestehende neutrale
                // Warte-Zustand gezeigt (Step 5, "Alles klar. Der nächste Impuls kommt.") — exakt
                // derselbe Zustand wie im regulären Zwischen-Impuls-Rhythmus, bewusst OHNE eigenen
                // "Phase abgeschlossen"-Hinweis (Rico-Entscheid: das muss der Coachee nicht sehen).
                // Bewusst vor der nextImpulseAt-Prüfung und ohne deren pendingImpulsPopup-
                // Ausnahme, damit der Zustand unabhängig vom Pausierungs-Sentinel greift.
                setStep(5);
              } else if (nextImpulseAt > Date.now() && !pendingImpulsPopup) {
                // Fix (02.07.2026, Kapitel 34, Fund "Admin löst Tages-Impuls per Phasenwechsel
                // aus, Push kommt an, aber App zeigt 'Alles klar. Der nächste Impuls kommt.'
                // statt des neuen Impulses"): nextImpulseAt ist eine reine Client-Pacing-Sperre
                // für den REGULÄREN Zyklus (nach Abschluss 2-9 Tage in die Zukunft gesetzt,
                // siehe calcNextImpulseAt/saveAndFinish) — kennt aber keinen Push-Kontext. Ein
                // Admin-Phasenwechsel ist ein bewusstes Override und darf diese alte Sperre nicht
                // respektieren, sonst verschluckt Step 5 den frischen Impuls lautlos, obwohl der
                // Push korrekt zum Tages-Impuls-Tab geroutet hat. Gleiches Prinzip wie Pitfall 43
                // (lokaler Dismiss-Flag) — der Push selbst ist das autoritative, aktuellere Signal.
                setStep(5);
              }
            }).catch(() => {
              // Fix (02.07.2026, Fund "Aktiver Impuls zeigt Accept/Decline statt
              // 'Ich habe die Erfahrung gemacht'" + Folgefund "nach 'Nein, heute nicht'
              // bei der Reflexion zeigt Tages-Impuls-Tab wieder Accept/Decline"): Diese
              // Query kombiniert where(uid)+orderBy(createdAt) auf unterschiedlichen
              // Feldern — das braucht praktisch immer einen Firestore-Composite-Index
              // (anders als reine Gleichheitsfilter-Kombinationen, siehe Kapitel 30.9).
              // Fehlt der Index, schlägt die Query fehl. Der erste Fallback-Versuch
              // deckte nur den Status "active" über die activeImpuls-Prop ab — bei allen
              // anderen Status (done, skipped, closed_no_reflexion) blieb step beim
              // Default (0) hängen, die Prop kennt nämlich ausschliesslich "active"
              // (eigener Listener der Home-Karte, filtert selbst auf status=="active").
              // Jetzt eine eigene, robuste Ersatz-Query: reine Gleichheitsfilter
              // (uid+date, kein orderBy) — braucht keinen Composite-Index, deckt alle
              // Status ab, unabhängig vom Ausgang der eigentlichen Query oben.
              fbDb.collection("impulse_entries").where("uid","==",user.uid).where("date","==",todayStr).limit(1).get()
                .then(snap2 => {
                  if (!snap2.empty) {
                    const doc2 = snap2.docs[0];
                    const s2 = doc2.data().status;
                    if (s2 === "active") {
                      setStep(1); setActiveEntryRef(doc2.ref);
                      setImpuls({ id: doc2.data().impulsId, text: doc2.data().impulsText, hint: "", page: doc2.data().impulsPage || null });
                    } else if (pendingImpulsPopup) {
                      // Fix (02.07.2026, Kapitel 35): identischer Bypass wie im primären
                      // Query-Pfad oben — zusätzlich HIER wichtig: setImpuls NICHT mit dem
                      // alten doc2-Eintrag überschreiben, sonst zeigt das Push-Popup den
                      // Text des früheren (heute schon abgeschlossenen) Impulses statt des
                      // frisch geladenen Impulses der NEUEN Phase (bereits weiter oben via
                      // setImpuls(next || null) korrekt gesetzt).
                      setStep(0);
                    } else if (s2 === "done") {
                      setStep(4);
                      setImpuls({ id: doc2.data().impulsId, text: doc2.data().impulsText, hint: "", page: doc2.data().impulsPage || null });
                    } else if (s2 === "skipped") {
                      setStep(6);
                      setImpuls({ id: doc2.data().impulsId, text: doc2.data().impulsText, hint: "", page: doc2.data().impulsPage || null });
                    } else {
                      setStep(5);
                      setImpuls({ id: doc2.data().impulsId, text: doc2.data().impulsText, hint: "", page: doc2.data().impulsPage || null });
                    }
                  } else {
                    setImpuls(impulse[0] || null);
                  }
                })
                .catch(() => setImpuls(impulse[0] || null));
            });
        };
        if (doc.exists) getData(doc.data());
        else if (activeImpuls === null) { setStep(6); return; }
        else setImpuls({ id:"fallback", text:"Beobachte heute eine Situation, in der du automatisch reagiert hast — Ärger, Rückzug, Anspannung. Halte danach kurz inne: Was war der Reiz? Was war deine Reaktion?", hint:"Nur beobachten, nicht bewerten." });
      }).catch(() => {
        setImpuls({ id:"fallback", text:"Beobachte heute eine Situation, in der du automatisch reagiert hast — Ärger, Rückzug, Anspannung. Halte danach kurz inne: Was war der Reiz? Was war deine Reaktion?", hint:"Nur beobachten, nicht bewerten." });
      });
  }, [user, activeImpuls]);

  const todayStr = new Date().toISOString().split("T")[0];
  const dateStr  = new Date().toLocaleDateString("de-CH", { weekday:"long", day:"numeric", month:"long" });

  // NEU (06.08.2026): Workbook-Seitenhinweis pro Tagesimpuls. Zeigt die exakte Seite
  // (impuls.page), falls in der Bibliothek für diesen Impuls hinterlegt — sonst Fallback
  // auf die Phasen-Seitenspanne aus PHASE_INFO (für Impulse ohne eigenes page-Feld,
  // z.B. noch nicht aktualisierte Bibliothekseinträge).
  const workbookLabel = (imp) => {
    if (imp && imp.page) return `Siehe Workbook Seite ${imp.page}`;
    const info = PHASE_INFO[activePhaseNum] || PHASE_INFO[1];
    return `Siehe Workbook Seite ${info.pageStart}–${info.pageEnd}`;
  };

  const handleAnnehmen = () => {
    const fbDb = window._fb?.db;
    if (fbDb && user?.uid && impuls) {
      fbDb.collection("impulse_entries").add({
        uid: user.uid, date: todayStr, impulsId: impuls.id,
        impulsText: impuls.text, impulsPage: impuls.page || null, status: "active", createdAt: Date.now()
      }).catch(() => {});
    }
    // Fix: App-weiten activeImpuls-State sofort setzen, analog zu handleHeuteNicht()
    // (die dort schon setActiveImpuls(null) aufruft). Ohne das verlässt sich die
    // "Aktiver Impuls"-Karte auf der Home-Seite ausschliesslich auf DashboardPages
    // eigenen Firestore-Listener — der läuft aber nur, während Home gerade gemountet
    // ist, und verpasst die Änderung, solange man auf der Impuls-Seite bleibt. Erst ein
    // kompletter App-Neustart baute den Listener bisher zuverlässig neu auf.
    if (setActiveImpuls) setActiveImpuls({ uid: user?.uid, date: todayStr, impulsId: impuls.id, impulsText: impuls.text, status: "active" });
    // Fix: Ein früherer "Heute nicht"-Klick am selben Tag darf eine spätere, echte
    // Annahme nicht mehr überstrahlen — sonst blockiert der alte Dismiss-Flag jede
    // weitere Navigation zum Tages-Impuls (z.B. über die "Aktiver Impuls"-Karte auf
    // der Home-Seite), obwohl gerade ein aktiver Impuls existiert.
    localStorage.removeItem("impuls_dismissed_" + (user?.uid || "guest"));
    // Fix (02.07.2026, Fund per Screenshot): Bisher setStep(0.5) — eine Zwischenseite
    // ("Gut. Der Impuls begleitet dich heute...") mit eigenem "Ich bin bereit"-Button.
    // Direkter Sprung zu Home, analog zum selben Fix bei "Nein, heute nicht" — die
    // "Aktiver Impuls"-Karte auf Home zeigt den Tages-Impuls sofort an (activeImpuls
    // wird direkt oben gesetzt). Behebt nebenbei einen Race: setActiveImpuls() änderte
    // die activeImpuls-Prop, was den step-bestimmenden useEffect (Dependency
    // [user, activeImpuls]) erneut auslöste und das gerade gesetzte Step 0.5 mit dem neu
    // aus Firestore geladenen Step 1 überschrieb (genau das zeigte der zweite Screenshot).
    if (setPage) setPage("dashboard"); else setStep(0.5);
  };

  // "Später": schreibt eine Snooze-Zeit in users/{uid}, die Cloud Function
  // checkImpulsSnooze prüft das alle 10 Minuten und schickt nach 1h einen neuen Push
  // (#impulse-tages-snoozed) — dort erscheint dasselbe Popup nochmal, aber ohne
  // "Später"-Option (popupIsSnoozed steuert das, s. Push-Deep-Link-useEffect oben).
  // Der Tagesimpuls selbst bleibt unverändert im Hintergrund stehen (kein Statuswechsel,
  // keine Firestore-Schreibung auf impulse_entries) — "Später" ist reine Terminierung,
  // keine Entscheidung.
  const handleSpaeter = () => {
    const fbDb = window._fb?.db;
    if (fbDb && user?.uid) {
      fbDb.collection("users").doc(user.uid).update({
        impulsSnoozeAt: Date.now() + 60 * 60 * 1000
      }).catch(() => {});
    }
    setShowPushPopup(false);
    // Direkt zur Home-Seite statt auf der unveränderten Tages-Impuls-Seite landen zu
    // lassen — sonst wirkt es, als wäre "Später" wirkungslos geblieben (Rico-Feedback).
    if (setPage) setPage("dashboard");
  };

  const handleHeuteNicht = () => {
    // localStorage-Flag setzen — sofort, unabhängig von Firestore
    const todayStr3 = new Date().toISOString().split("T")[0];
    const dismissedKey = "impuls_dismissed_" + (user?.uid || "guest");
    localStorage.setItem(dismissedKey, todayStr3);
    if (setActiveImpuls) setActiveImpuls(null);
    setActiveEntryRef(null);
    setStep(6);
    const fbDb = window._fb?.db;
    if (fbDb && user?.uid) {
      fbDb.collection("impulse_entries")
        .where("uid","==",user.uid).where("date","==",todayStr).get()
        .then(snap => {
          snap.docs.forEach(doc => {
            if (doc.data().status === "active") {
              doc.ref.update({ status: "skipped", closedAt: Date.now() }).catch(() => {});
            }
          });
        }).catch(() => {});
    }
    setTimeout(() => { if (setPage) setPage("dashboard"); }, 1800);
  };

  const handleNeinHeute = () => {
    const fbDb = window._fb?.db;
    if (fbDb && user?.uid) {
      fbDb.collection("impulse_entries")
        .where("uid","==",user.uid).where("date","==",todayStr).where("status","==","active").limit(1).get()
        .then(snap => { if (!snap.empty) snap.docs[0].ref.update({ status:"closed_no_reflexion", closedAt: Date.now() }); })
        .catch(() => {});
    }
    // Fix (02.07.2026, Fund per Screenshot): "Nein, heute nicht" führte bisher auf Step 5
    // ("Alles klar. Der nächste Impuls kommt.") — eine Zwischenseite ohne jede Aktion, auf
    // der man hängen blieb, ohne dass sie automatisch weiterleitet. Direkter Sprung zu
    // Home statt toter Zwischenseite.
    if (setPage) setPage("dashboard"); else setStep(5);
  };

  const calcNextImpulseAt = (packageType) => {
    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1) + min);
    // GEÄNDERT (12.08.2026, neue Phasen-Struktur): Einzel neu 2 Impulse/Woche im Schnitt
    // (rand(2,5), Ø 3.5 Tage statt bisher rand(2,3), Ø 2.5 Tage). Paar neu 1 Impuls/Woche im
    // Schnitt (rand(4,10), Ø 7 Tage statt bisher rand(4,7), Ø 5.5 Tage). Integration bewusst
    // unverändert (rand(5,9)) — Rico-Vorgabe "alle anderen Parameter nicht verändern".
    const days = packageType === "paar" ? rand(4,10) : packageType === "integration" ? rand(5,9) : rand(2,5);
    return Date.now() + days * 24 * 60 * 60 * 1000;
  };

  const saveAndFinish = () => {
    setSaving(true);
    const fbDb = window._fb?.db;
    if (fbDb && user?.uid) {
      const update = { status:"done", reflexion: reflexion.trim(), koerper: koerper, closedAt: Date.now() };
      // NEU (12.08.2026, neue Phasen-Struktur): War dies der letzte Impuls der aktuellen Phase
      // (phaseImpulseCount.total aus der Bibliothek, z.B. 4), wird KEIN neuer nextImpulseAt mehr
      // berechnet — die Phase pausiert bis Diana/Rico manuell die nächste Phase setzen
      // (onActivePhaseChanged in functions/index.js setzt dann wieder einen aktiven Wert).
      // Gleicher "pausiert"-Sentinel-Wert (+100 Jahre) wie dort, damit checkDailyImpulse in der
      // Zwischenzeit sicher nichts auslöst.
      const PAUSED_UNTIL_PHASE_CHANGE = Date.now() + 100 * 365 * 24 * 60 * 60 * 1000;
      const doneAfterThis = phaseImpulseCount.done + 1;
      const phaseFinished = phaseImpulseCount.total > 0 && doneAfterThis >= phaseImpulseCount.total;
      fbDb.collection("impulse_entries")
        .where("uid","==",user.uid).where("date","==",todayStr).where("status","==","active").limit(1).get()
        .then(snap => {
          if (!snap.empty) snap.docs[0].ref.update(update).catch(() => {});
          else if (impuls) fbDb.collection("impulse_entries").add({ uid:user.uid, date:todayStr, impulsId:impuls.id, impulsText:impuls.text, ...update, createdAt: Date.now() }).catch(() => {});
          fbDb.collection("users").doc(user.uid).get().then(uDoc => {
            const pkg = uDoc.exists ? (uDoc.data().packageType || "einzel") : "einzel";
            const nextImpulseAt = phaseFinished ? PAUSED_UNTIL_PHASE_CHANGE : calcNextImpulseAt(pkg);
            fbDb.collection("users").doc(user.uid).update({ nextImpulseAt }).catch(() => {});
          }).catch(() => {});
        }).catch(() => {}).finally(() => { setSaving(false); setStep(4); });
    } else { setSaving(false); setStep(4); }
  };

  if (step === 6) return null;

  // NEU (06.08.2026, Variante A): Willkommens-Screen nach Phasenwechsel. Bewusst VOR dem
  // !impuls-Ladehinweis platziert — der Screen braucht keinen geladenen Tagesimpuls, der
  // eigentliche erste Impuls der neuen Phase folgt separat im gewohnten Rhythmus.
  if (step === 7) {
    const info = PHASE_INFO[welcomePhase] || PHASE_INFO[1];
    // GEÄNDERT (07.08.2026): Weder height:"100%" noch calc(100dvh - Xpx) lieferten laut
    // Ricos wiederholtem Live-Test eine echte Zentrierung — Ursache ist der in diesem Projekt
    // bereits dokumentierte Pitfall "position:fixed innerhalb von overflow:hidden-Eltern
    // bricht" (siehe Portal-Pattern-Kommentar bei ImpulsPushPopup). Da .impulse-tab-wrap und
    // #app beide overflow:hidden haben, konnte KEIN CSS-Ansatz innerhalb der normalen
    // Komponenten-Hierarchie zuverlässig auf die volle Bildschirmhöhe zentrieren. Fix: Step 7
    // läuft jetzt komplett über das bestehende Portal (#overlay-portal, liegt als
    // Geschwister-Element ausserhalb von #app) mit echtem position:fixed;inset:0 — dieselbe
    // Technik, die bei ImpulsPushPopup bereits nachweislich zuverlässig funktioniert.
    return h(Portal, null,
      h("div", {style:{position:"fixed", inset:0, background:"var(--bg)", zIndex:9998, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"32px 36px", boxSizing:"border-box", textAlign:"center"}},
        h("div", {style:{maxWidth:520, width:"100%"}},
          h("div", {style:{width:56, height:56, borderRadius:"50%", background:"var(--sage-pale)", display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 20px"}},
            h(Ic, {name:"impuls", size:26, style:{color:"var(--teal)"}})
          ),
          h("p", {style:{fontFamily:"'Manuale',serif", fontSize:"1.15rem", fontWeight:700, color:"var(--text)", marginBottom:10}}, `Willkommen in Phase ${welcomePhase}`),
          h("p", {style:{fontSize:".95rem", color:"var(--muted)", lineHeight:1.6, marginBottom:28}}, info.title),

  if (!impuls) return html`<div class="content-main" style=${{display:"flex",alignItems:"center",justifyContent:"center",minHeight:200}}><div style=${{color:"var(--muted)",fontSize:".9rem"}}>Lade…</div></div>`;

function LibraryPage({library, pendingLibraryId, clearPendingLibraryId, uid}) {
  const [openId, setOpenId] = useState(null);
  const [searchQ, setSearchQ] = useState('');
  const [photoOverlay, setPhotoOverlay] = useState(null);
  const [highlightId, setHighlightId] = useState(null);
  const itemRefs = useRef({});

  // ── "Neu"-Badge pro Item (NEU 01.08.2026, Option B) ──
  // Bleibt sichtbar, bis genau DIESES Item angetippt wurde — nicht nur bis die Mediathek
  // einmal geöffnet wird. Persistiert pro Coachee in localStorage, damit es App-Neustarts
  // übersteht. Beim allerersten Einsatz dieses Features (kein gespeicherter Wert vorhanden)
  // gilt der aktuelle Bestand als bereits gesehen, damit nicht der ganze Altbestand aufblitzt.
  const seededRef = useRef(false);
  const [seenIds, setSeenIds] = useState(new Set());
  useEffect(() => {
    if(!uid || seededRef.current) return;
    try {
      const key = 'librarySeenIds_'+uid;
      const stored = localStorage.getItem(key);
      if(stored !== null) {
        seededRef.current = true;
        try { setSeenIds(new Set(JSON.parse(stored))); } catch(e) { setSeenIds(new Set()); }
      } else if(library.length > 0) {
        seededRef.current = true;
        const ids = library.map(i=>i.id);
        localStorage.setItem(key, JSON.stringify(ids));
        setSeenIds(new Set(ids));
      }
    } catch(e) {}
  }, [uid, library]);
  const markSeen = (id) => {
    if(!uid || seenIds.has(id)) return;
    setSeenIds(prev => {
      const next = new Set(prev); next.add(id);
      try { localStorage.setItem('librarySeenIds_'+uid, JSON.stringify([...next])); } catch(e) {}
      return next;
    });
  };

  // ── Mediathek-Push-Deep-Link: zum neuen Item scrollen und kurz hervorheben ──
  // (NEU 01.08.2026) Vorher landete ein Push-Tap immer nur auf der allgemeinen Übersicht —
  // der Coachee musste selbst herausfinden, welches Item neu war. Wartet, bis sowohl die
  // Item-ID als auch die (ggf. erst asynchron geladene) library-Liste vorhanden sind.
  useEffect(() => {
    if(!pendingLibraryId) return;
    const exists = library.some(i => String(i.id) === String(pendingLibraryId));
    if(!exists) return;
    const targetId = pendingLibraryId;
    // Fix (01.08.2026): scrollIntoView erst nach kurzer Verzögerung aufrufen — direkt beim
    // Mount ist das Layout der Seite (Header, Suchfeld, Sektionsköpfe) auf iOS Safari teils
    // noch nicht final berechnet, wodurch die Zielposition falsch bestimmt wird und die
    // Seite stattdessen ans Ende scrollt (Fund von Rico, Live-Test).
    const scrollTimer = setTimeout(() => {
      const el = itemRefs.current[targetId];
      if(el) {
        el.scrollIntoView({behavior:'smooth', block:'center'});
        setHighlightId(targetId);
        setTimeout(() => setHighlightId(id => id === targetId ? null : id), 6000);
      }
      clearPendingLibraryId && clearPendingLibraryId();
    }, 350);
    return () => clearTimeout(scrollTimer);
  }, [pendingLibraryId, library]);

  const SECTIONS = [
    {type:'video', label:'Video',  icon:'play',   color:'#156e6e', bg:'#e0eded', border:'#b0d4d4'},
    {type:'audio', label:'Audio',  icon:'headphones', color:'#156e6e', bg:'#e0eded', border:'#b0d4d4'},
    {type:'foto',  label:'Fotos',  icon:'image',  color:'#156e6e', bg:'#e0eded', border:'#b0d4d4'},
    {type:'dokus', label:'Dokus',  icon:'file',   color:'#156e6e', bg:'#e0eded', border:'#b0d4d4'},
    {type:'link',  label:'Links',  icon:'link',   color:'#156e6e', bg:'#e0eded', border:'#b0d4d4'},
  ];

  const urlHost = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch(e) { return null; } };

  const matches = item => !searchQ ||
    item.title?.toLowerCase().includes(searchQ.toLowerCase()) ||
    item.desc?.toLowerCase().includes(searchQ.toLowerCase()) ||
    item.keywords?.toLowerCase().includes(searchQ.toLowerCase());

  const toggle = id => setOpenId(v => v === id ? null : id);

  const ThumbSmall = ({item, sec}) => {
    if(item.type==='link'){
      if(item.thumbData) return html`
        <div style=${{width:'100%',height:'100%',position:'relative',overflow:'hidden'}}>
          <img src=${item.thumbData} style=${{width:'100%',height:'100%',objectFit:'cover',display:'block',borderRadius:9}}/>
          <div style=${{position:'absolute',bottom:2,right:3,background:'rgba(0,0,0,.6)',color:'white',borderRadius:5,width:16,height:16,display:'flex',alignItems:'center',justifyContent:'center'}}><${Ic} name="extlink" size=${9} style=${{color:'white'}}/></div>
        </div>`;
      const host = urlHost(item.fileUrl);
      return html`
        <div style=${{width:'100%',height:'100%',background:sec.bg,borderRadius:9,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:5}}>
          ${host
            ? html`<img src=${'https://www.google.com/s2/favicons?sz=64&domain='+host} width="26" height="26"
                style=${{borderRadius:6}} onError=${e=>{e.target.style.display='none';e.target.nextSibling.style.display='flex';}}/>`
            : null}
          <div style=${{display:host?'none':'flex',width:26,height:26,alignItems:'center',justifyContent:'center'}}><${Ic} name="link" size=${18} style=${{color:sec.color}}/></div>
          ${host&&html`<div style=${{fontSize:'6.5px',fontWeight:700,color:sec.color,maxWidth:'90%',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${host}</div>`}
        </div>`;
    }
    if((item.type==='video'||item.type==='foto') && item.thumbData) return html`
      <div style=${{width:'100%',height:'100%',position:'relative',overflow:'hidden'}}>
        <img src=${item.thumbData} style=${{width:'100%',height:'100%',objectFit:'cover',display:'block',borderRadius:9}}/>
        ${item.type==='video'&&html`<div style=${{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style=${{width:22,height:22,borderRadius:'50%',background:'rgba(255,255,255,.88)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="8" height="8" viewBox="0 0 24 24" fill="#156e6e"><path d="M5 3l14 9-14 9V3z"/></svg>
          </div>
        </div>`}
        ${item.duration&&html`<div style=${{position:'absolute',bottom:2,right:3,background:'rgba(0,0,0,.6)',color:'white',fontSize:'6px',fontWeight:700,padding:'1px 3px',borderRadius:3}}>${item.duration}</div>`}
      </div>`;
    return html`
      <div style=${{width:'100%',height:'100%',background:sec.bg,borderRadius:9,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3}}>
        ${item.type==='audio' ? html`
          <div style=${{display:'flex',alignItems:'center',gap:1.5,height:20}}>
            ${(item.thumbData?JSON.parse(item.thumbData):[.3,.6,.9,.5,.8,.4,.7,.5,.6,.4]).slice(0,10).map((h,i)=>html`
              <div key=${i} style=${{width:2.5,height:Math.round(h*18)+'px',background:sec.color,borderRadius:2,opacity:.8}}/>
            `)}
          </div>` : html`<${Ic} name=${sec.icon} size=${20} style=${{color:sec.color}}/>`}
        ${item.duration&&html`<div style=${{fontSize:'7px',fontWeight:700,color:sec.color}}>${item.duration}</div>`}
      </div>`;
  };

  const ExpandedMedia = ({item, sec}) => {
    if(item.type==='video') return html`
      <div style=${{width:'100%',aspectRatio:'16/9',background:'#111',position:'relative'}}>
        ${item.fileUrl&&html`<video controls autoPlay src=${item.fileUrl} poster=${item.thumbData||''} style=${{width:'100%',height:'100%',display:'block',objectFit:'contain'}}/>`}
        ${item.duration&&html`<div style=${{position:'absolute',bottom:8,left:10,background:'rgba(0,0,0,.7)',color:'white',fontSize:'.65rem',fontWeight:700,padding:'2px 7px',borderRadius:4,pointerEvents:'none'}}>HD · ${item.duration}</div>`}
      </div>`;

    if(item.type==='foto') return html`
      <div style=${{width:'100%',maxHeight:320,minHeight:180,background:'var(--surface)',display:'flex',alignItems:'center',justifyContent:'center'}}>
        ${(item.fileUrl||item.thumbData)
          ? html`<img src=${item.fileUrl||item.thumbData} style=${{maxWidth:'100%',maxHeight:320,objectFit:'contain',display:'block',cursor:'zoom-in'}}
              onClick=${e=>{e.stopPropagation();setPhotoOverlay(item.fileUrl||item.thumbData);}}/>`
          : html`<div style=${{padding:40,color:'var(--muted)',fontSize:'.85rem'}}>Kein Vorschaubild</div>`}
      </div>`;

    if(item.type==='audio') return html`
      <div style=${{padding:'16px 20px',background:sec.bg}}>
        <audio controls src=${item.fileUrl||''} style=${{width:'100%'}} onClick=${e=>e.stopPropagation()}/>
      </div>`;

    if(item.type==='link'){
      const host = urlHost(item.fileUrl);
      return html`
        <div style=${{width:'100%',minHeight:150,background:'var(--surface)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:10,padding:item.thumbData?0:'22px 16px'}}>
          ${item.thumbData
            ? html`<img src=${item.thumbData} style=${{width:'100%',maxHeight:220,objectFit:'cover',display:'block'}}/>`
            : html`<div style=${{width:52,height:52,borderRadius:12,background:sec.bg,border:'0.5px solid '+sec.border,display:'flex',alignItems:'center',justifyContent:'center'}}>
                ${host
                  ? html`<img src=${'https://www.google.com/s2/favicons?sz=64&domain='+host} width="30" height="30" style=${{borderRadius:6}}/>`
                  : html`<${Ic} name="link" size=${22} style=${{color:sec.color}}/>`}
              </div>`}
          <div style=${{textAlign:'center',padding:item.thumbData?'10px 16px 0':0}}>
            <div style=${{fontSize:'.88rem',fontWeight:700,color:'var(--text)'}}>${item.title}</div>
            ${host&&html`<div style=${{fontSize:'.75rem',color:'var(--muted)',marginTop:2}}>${host}</div>`}
          </div>
          ${item.fileUrl&&html`
            <a href=${item.fileUrl} target="_blank" rel="noopener" onClick=${e=>e.stopPropagation()}
              style=${{display:'flex',alignItems:'center',gap:6,padding:'8px 18px',background:'#156e6e',color:'white',borderRadius:8,fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:'.8rem',textDecoration:'none',marginTop:4,marginBottom:item.thumbData?16:0}}>
              <${Ic} name="extlink" size=${13} style=${{color:'white'}}/> Öffnen
            </a>`}
        </div>`;
    }

    if(item.type==='dokus') return html`
      <div>
        ${item.fileUrl&&html`
          <div style=${{width:'100%',overflow:'hidden',maxWidth:'100vw'}}>
            <iframe
              src=${'https://docs.google.com/viewer?url='+encodeURIComponent(item.fileUrl)+'&embedded=true'}
              style=${{width:'100%',height:340,border:'none',display:'block',background:'#f5f5f5'}}
              title=${item.title}/>
          </div>`}
        ${!item.fileUrl&&html`
          <div style=${{padding:'24px 16px',textAlign:'center',color:'var(--muted)',fontSize:'.85rem'}}>Keine Datei verfügbar</div>`}
        ${item.fileUrl&&html`
          <div style=${{display:'flex',justifyContent:'flex-end',padding:'8px 12px',background:'var(--surface)'}}>
            <a href=${item.fileUrl} target="_blank" rel="noopener" onClick=${e=>e.stopPropagation()}
              style=${{display:'flex',alignItems:'center',gap:5,padding:'5px 11px',background:'#156e6e',color:'white',borderRadius:7,fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:'.75rem',textDecoration:'none'}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Download
            </a>
          </div>`}
      </div>`;

    return null;
  };


  const visibleSecTypes = SECTIONS.filter(sec => library.some(i=>i.type===sec.type && matches(i))).map(sec=>sec.type);

  return html`
    <div class="content-main">
      <div><h1 class="page-heading">Mediathek</h1>
        <p class="page-sub">Impulse, Übungen und Inspiration für deinen Alltag — von Diana & Rico.</p>
      </div>
      <div style=${{marginBottom:14}}>
        <input class="input" type="text" placeholder="Inhalte suchen…"
          value=${searchQ} onInput=${e=>setSearchQ(e.target.value)}
          style=${{width:'100%',padding:'9px 14px'}}/>
      </div>

      ${SECTIONS.map(sec => {
        const items = library.filter(i=>i.type===sec.type && matches(i));
        if(items.length===0) return null;
        const showDivider = visibleSecTypes.indexOf(sec.type) > 0;
        return html`
          ${showDivider && html`<div style=${{height:1,background:'var(--border)',margin:'22px 0'}}/>`}
          <div key=${sec.type} style=${{marginBottom:32}}>
            <div style=${{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <div style=${{width:28,height:28,borderRadius:7,background:sec.bg,border:'0.5px solid '+sec.border,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <${Ic} name=${sec.icon} size=${15} style=${{color:sec.color}}/>
              </div>
              <span style=${{fontFamily:"'Manuale',serif",fontWeight:700,fontSize:'.95rem',color:'var(--text)'}}>${sec.label}</span>
              <span style=${{fontSize:'.78rem',color:'var(--muted)',fontWeight:400}}>${items.length}</span>
            </div>
            <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              ${items.map((item,idx) => {
                const isOpen = openId===item.id;
                const isNew = !seenIds.has(item.id);
                const isHighlighted = highlightId===item.id;
                const isFoto = item.type==='foto';
                const openFoto = () => setPhotoOverlay(item.fileUrl||item.thumbData);
                const onCardTap = () => { markSeen(item.id); if(isFoto){ openFoto(); } else { toggle(item.id); } };
                return html`
                  <div key=${item.id} ref=${el=>{ if(el) itemRefs.current[item.id]=el; }}
                    style=${{gridColumn:isOpen?'1 / -1':'auto',background:'var(--surface)',borderRadius:14,overflow:'hidden',
                      border:isHighlighted?'1px solid var(--sage)':'1px solid var(--border2)',
                      boxShadow:isHighlighted?'var(--shadow), inset 0 0 0 2px var(--sage)':'var(--shadow)',
                      transition:'box-shadow .3s'}}>
                    <div style=${{position:'relative'}}>
                      ${isNew&&html`<div style=${{position:'absolute',top:6,left:6,background:'#156e6e',color:'#fff',fontSize:'.78rem',fontWeight:700,padding:'3px 11px',borderRadius:20,zIndex:1}}>Neu</div>`}
                      <div style=${{width:'100%',height:isOpen?'auto':110,overflow:'hidden',cursor:'pointer'}}
                        onClick=${()=>{if(isFoto){markSeen(item.id);openFoto();} else if(!isOpen){toggle(item.id);markSeen(item.id);}}}>
                        ${isOpen
                          ? html`<${ExpandedMedia} item=${item} sec=${sec}/>`
                          : html`<${ThumbSmall} item=${item} sec=${sec}/>`}
                      </div>
                      ${isOpen&&html`
                        <div onClick=${e=>{e.stopPropagation();toggle(item.id);}}
                          style=${{position:'absolute',top:8,right:8,width:28,height:28,borderRadius:'50%',background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',zIndex:2}}>
                          <${Ic} name="x" size=${14} style=${{color:'white'}}/>
                        </div>`}
                    </div>
                    <div style=${{padding:'9px 11px 8px',cursor:'pointer'}} onClick=${onCardTap}>
                      <div style=${{fontSize:'.82rem',fontWeight:700,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${item.title}</div>
                      <div style=${{fontSize:'.72rem',color:'var(--muted)',marginTop:2,minHeight:15,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${[item.desc,item.duration].filter(Boolean).join(' · ')}</div>
                    </div>
                    <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 11px 10px'}}>
                      <span style=${{fontSize:'.68rem',color:'var(--muted)',opacity:.7}}>${item.uploadedAt||''}</span>
                      ${!isFoto&&html`
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round" style=${{transform:isOpen?'rotate(180deg)':'rotate(0deg)',transition:'transform .2s',cursor:'pointer'}}
                          onClick=${e=>{e.stopPropagation();toggle(item.id);markSeen(item.id);}}>
                          <polyline points="6 9 12 15 18 9"/>
                        </svg>`}
                      ${isFoto&&html`
                        <div onClick=${e=>{e.stopPropagation();markSeen(item.id);openFoto();}} style=${{cursor:'pointer',display:'flex',alignItems:'center'}}>
                          <${Ic} name="image" size=${13} style=${{color:'var(--muted)'}}/>
                        </div>`}
                    </div>
                  </div>`;
              })}
            </div>
          </div>`;
      })}

      ${library.filter(matches).length===0&&html`
        <div style=${{textAlign:'center',padding:'44px',color:'var(--muted)'}}>
          <p>${searchQ?"Keine Treffer für '"+searchQ+"'":"Noch keine Inhalte vorhanden."}</p>
        </div>`}
    </div>
      ${photoOverlay&&html`
        <div style=${{position:'fixed',inset:0,background:'rgba(0,0,0,.95)',zIndex:999,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}
          onClick=${()=>setPhotoOverlay(null)}>
          <button onClick=${e=>{e.stopPropagation();setPhotoOverlay(null);}}
            style=${{position:'fixed',top:14,right:14,width:36,height:36,borderRadius:'50%',background:'rgba(0,0,0,.55)',color:'white',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <img src=${photoOverlay} style=${{maxWidth:'100%',maxHeight:'90vh',objectFit:'contain',display:'block'}}
            onClick=${e=>e.stopPropagation()}/>
        </div>`}
  `;
}

const BLANK_FORM = {
  label:"", icon:"leaf", time:"08:00", recurrence:"daily",
  weekdays:[], monthDays:[], customWeekdays:[],
  customInterval:1, customUnit:"Tagen",
  area:"Allgemein", additionalTimes:[],
  sacredSymbol:""
};

const SymbolCard = ({s, selected, onSelect}) => {
  const src = SYMBOLS_B64[s.name]||"";
  return html`<div key=${s.name} onClick=${onSelect}
    style=${{background:selected?"var(--sage-pale)":"var(--surface2)",
      border:"1.5px solid "+(selected?"var(--teal)":"var(--border)"),
      borderRadius:12,padding:"12px 8px",textAlign:"center",cursor:"pointer",transition:"all .15s"}}>
    <div style=${{height:60,width:"100%",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:6,overflow:"hidden"}}>
      <img src=${src} style=${{width:"100%",height:"100%",maxHeight:"60px",objectFit:"contain",display:"block"}} alt=${s.name}/>
    </div>
    <div style=${{fontSize:".72rem",fontWeight:700,color:"var(--text)",marginBottom:2}}>${s.name}</div>
    <div style=${{fontSize:".62rem",color:"var(--muted)",lineHeight:1.3}}>${s.desc}</div>
  </div>`;
};

const SymbolButton = ({sacredSymbol, onClick}) => {
  if(!sacredSymbol) return html`<button class="btn btn-ghost btn-sm" onClick=${onClick} style=${{display:"flex",alignItems:"center",gap:8,padding:"8px 14px"}}><span style=${{color:"var(--muted)"}}>Symbol wählen →</span></button>`;
  const src = SYMBOLS_B64[sacredSymbol]||"";
  return html`<button class="btn btn-ghost btn-sm" onClick=${onClick} style=${{display:"flex",alignItems:"center",gap:8,padding:"8px 14px"}}>
    <img src=${src} style=${{width:42,height:42,objectFit:"contain",display:"block"}} alt=${sacredSymbol}/>
    <span style=${{fontWeight:700,fontSize:".84rem"}}>${sacredSymbol}</span>
  </button>`;
};

// Anzeige-Popup für einen einzelnen Impuls — Ebenenwechsel vom Verwalten (Liste) zum
// Erleben: Symbol gross und zentral, Beschreibung ruhig darunter, keine Formularelemente.
// Bei Push-Tap (showEdit=false) bewusst ganz ohne Bearbeiten-Link, um vom Moment nicht
// abzulenken; bei Klick aus der Liste (showEdit=true) mit dezentem Bearbeiten-Zugang unten.
const ReminderViewPopup = ({reminder:r, showEdit, onClose, onEdit}) => {
  const ac = REM_AREA_COLOR[r.area||"Allgemein"] || REM_AREA_COLOR["Allgemein"];
  const symbolSrc = r.sacredSymbol ? (SYMBOLS_B64[r.sacredSymbol]||"") : "";
  const symbolEl = symbolSrc
    ? html`<img src=${symbolSrc} style=${{width:98,height:98,objectFit:"contain",display:"block"}} alt=${r.sacredSymbol}/>`
    : html`<${Ic} name=${r.icon||"bell"} size=${40} style=${{color:ac.text}}/>`;
  return html`

function RemindersPage({reminders,setReminders,pendingReminderId,setPendingReminderId}) {
  const [showModal,setShowModal] = useState(false);
  const [editId,setEditId]       = useState(null);
  const [form,setForm]           = useState(BLANK_FORM);
  const [viewReminder,setViewReminder] = useState(null); // {reminder, showEdit}

  const [showSymbolPicker,setShowSymbolPicker] = useState(false);
  const labelRef = useRef(null);
  // Bezeichnungsfeld wächst automatisch mit dem Text mit — auch beim Öffnen zum
  // Bearbeiten (nicht nur beim Tippen), da der Text dort bereits vorhanden ist.
  useEffect(() => {
    if(labelRef.current) {
      labelRef.current.style.height = "auto";
      labelRef.current.style.height = labelRef.current.scrollHeight + "px";
    }
  }, [showModal, form.label]);
  const openNew  = () => { setForm(BLANK_FORM); setEditId(null); setShowModal(true); };
  const openView = (r, showEdit) => setViewReminder({reminder:r, showEdit});
  // Push-Deep-Link (#impulse-meine-<id>): Popup öffnen, sobald der passende Reminder in
  // der geladenen Liste vorhanden ist. WICHTIG: reminders startet beim Kaltstart mit
  // INIT_REMINDERS (Platzhalter) und wird erst asynchron per Firestore-Listener mit den
  // echten Daten befüllt — die ID darf deshalb NICHT sofort gelöscht werden, sonst ist sie
  // schon weg, bevor die echten Daten überhaupt geladen sind (v.a. bei komplett geschlossener
  // App / Kaltstart über Push-Tap). Erst löschen, wenn der Reminder wirklich gefunden wurde.
  // Falls er inzwischen gelöscht/deaktiviert wurde, bleibt pendingReminderId bewusst gesetzt
  // (kein Effekt, kein Absturz) — harmlos, da reminders sich danach nicht mehr ständig ändert.
  useEffect(() => {
    if(!pendingReminderId) return;
    const found = reminders.find(r=>String(r.id)===String(pendingReminderId));
    if(found) { openView(found, false); if(setPendingReminderId) setPendingReminderId(null); }
  }, [pendingReminderId, reminders]);
  const openEdit = r  => {
    setForm({...BLANK_FORM,...r,additionalTimes:r.additionalTimes||[],area:r.area||'Allgemein'});
    setEditId(r.id);
    setShowModal(true);

  const togWD = d => setForm(f=>({...f,weekdays:f.weekdays.includes(d)?f.weekdays.filter(x=>x!==d):[...f.weekdays,d]}));
  const togMD = d => setForm(f=>({...f,monthDays:f.monthDays.includes(d)?f.monthDays.filter(x=>x!==d):[...f.monthDays,d]}));
  const togCD = d => setForm(f=>({...f,customWeekdays:f.customWeekdays.includes(d)?f.customWeekdays.filter(x=>x!==d):[...f.customWeekdays,d]}));

  const [saveError,setSaveError] = useState(false);
  const save = () => {
    if(!form.label.trim()){
      setSaveError(true);
      setTimeout(()=>setSaveError(false),2000);
      return;
    }
    setSaveError(false);
    // Date.now() allein kann bei sehr schnellem Doppel-Speichern (gleiche Millisekunde)
    // theoretisch kollidieren — Zufalls-Suffix macht die ID praktisch eindeutig. Als
    // Firestore-Doc-ID und beim Matching wird r.id ohnehin immer als String behandelt
    // (nie arithmetisch als Zeitstempel weiterverwendet), daher unproblematisch.
    const id = editId||(Date.now()+"-"+Math.random().toString(36).slice(2,8));
    const entry={...form,id,enabled:true,area:form.area||'Allgemein',additionalTimes:form.additionalTimes||[],createdAt:form.createdAt||Date.now()};
    setShowModal(false);
    setReminders(rs=>editId?rs.map(r=>r.id===editId?entry:r):[...rs,entry]);

// Normalisiert das Doodle-Feld 'slots' zu einem echten JS-Array, unabhängig davon, ob Firestore es
// als Array oder (fälschlich, durch Dot-Notation-Updates auf nicht-existente Indizes) als Map mit
// numerischen String-Keys gespeichert hat. Siehe Pitfall 40.
function toSlotsArray(slots) {
  if(Array.isArray(slots)) return slots;
  if(slots && typeof slots==="object") return Object.keys(slots).sort((a,b)=>Number(a)-Number(b)).map(k=>slots[k]);
  return [];
}
// Termin-Set (Kapitel 98): Slots können ein optionales `audience`-Feld tragen — "gemeinsam" (Runder Tisch,
// beide Empfänger) oder eine Coachee-UID (nur für diese Person). Fehlt das Feld, gilt der Slot wie bisher
// für alle Empfänger (voll rückwärtskompatibel zu bestehenden Doodles).
function doodleHasGroups(d) { return toSlotsArray(d.slots).some(s=>s&&s.audience); }
function doodleGroupKey(s) { return (s&&s.audience) ? s.audience : "all"; }
// Liefert die für `uid` sichtbaren Gruppen eines Termin-Sets in fester Reihenfolge (Runder Tisch zuerst, dann eigener Termin).
function doodleGroupsForUid(d, uid) {
  const slots = toSlotsArray(d.slots);
  const gemeinsamIdx=[], ownIdx=[];
  slots.forEach((s,i)=>{ if(!s) return; if(s.audience==="gemeinsam") gemeinsamIdx.push(i); else if(s.audience && s.audience===uid) ownIdx.push(i); });
  const out=[];
  if(gemeinsamIdx.length) out.push({key:"gemeinsam",label:"Runder Tisch",icon:"users",indices:gemeinsamIdx});
  if(ownIdx.length) out.push({key:uid,label:"Dein Termin",icon:"user",indices:ownIdx});
  return out;
}
// Mehrfachbestätigung (Kapitel 98.2): Admin kann mehrere Termine gleichzeitig bestätigen.
// `confirmedSlots` ist ein Array von Slot-Indizes. Rückwärtskompatibel zu altem `confirmedSlot`
// (einzelne Zahl) und dem kurzzeitig verwendeten Gruppen-Objekt-Format aus einer früheren Session-Iteration.
function confirmedIndices(d) {
  if(Array.isArray(d.confirmedSlots)) return d.confirmedSlots;
  if(d.confirmedSlots && typeof d.confirmedSlots==="object") return Object.values(d.confirmedSlots).filter(v=>v!=null);
  if(d.confirmedSlot!=null) return [d.confirmedSlot];
  return [];
}
// Bemerkungsfelder starten 1-zeilig (rows=1) und wachsen automatisch mit dem Inhalt (Kapitel 98.1).
function autoGrowTextarea(el) { if(el){ el.style.height="auto"; el.style.height=el.scrollHeight+"px"; } }
function fmtDt(dt) {
  const d=new Date(dt);
  if(isNaN(d.getTime())) return "Datum ungültig";
  const days=["So","Mo","Di","Mi","Do","Fr","Sa"];
  const months=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  return days[d.getDay()]+", "+d.getDate()+". "+months[d.getMonth()]+" · "+
    String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+" Uhr";
}
// .ics-Kalenderdatei als data-URI — geräteunabhängig (iOS Apple-Kalender, Android Google Calendar, Desktop).
// dt: datetime-local String, durationMin: Dauer in Minuten (Default 120).
function icsDataUrl(dt, title, details, durationMin=120) {
  try {
    const start = new Date(dt);
    const end = new Date(start.getTime() + durationMin*60000);
    const fmt = d => d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00";
    const esc = s => String(s||"").replace(/[,;\\]/g,m=>"\\"+m).replace(/\n/g,"\\n");
    const ics = ["BEGIN:VCALENDAR","VERSION:2.0","CALSCALE:GREGORIAN","BEGIN:VEVENT",
      "UID:"+Date.now()+"@selbstwirksamkeit.ch",
      "DTSTAMP:"+fmt(new Date()),
      "DTSTART:"+fmt(start),
      "DTEND:"+fmt(end),
      "SUMMARY:"+esc(title||"Coaching-Termin"),
      "DESCRIPTION:"+esc(details||""),
      "END:VEVENT","END:VCALENDAR"].join("\r\n");
    return "data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);
  } catch(e){ return "#"; }
}
function bestSlotIdx(doodle) {
  let best=-1,bestCount=-1;
  toSlotsArray(doodle.slots).forEach((s,i)=>{
    if(!s) return;
    const yes=Object.values(s.votes||{}).filter(v=>v==="yes").length;
    if(yes>bestCount){bestCount=yes;best=i;}
  });
  return best;
}
function showToastMsg(msg) {
  const t=document.createElement("div");
  t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),300);},3000);
}

function LoginPage({ onLogin }) {
  const [mode,setMode]       = useState("login"); // login | register
  const [email,setEmail]     = useState("");
  const [password,setPassword] = useState("");
  const [error,setError]     = useState("");
  const [loading,setLoading] = useState(false);

  const handleEmail = async () => {
    if(!email||!password){ setError("Bitte E-Mail und Passwort eingeben."); return; }
    setLoading(true); setError("");
    try {
      const fbAuth = window._fb?.auth || window.firebase?.auth();
      if(!fbAuth) {
        setError("App wird geladen... Bitte warte kurz und versuche es nochmals.");
        setLoading(false);
        return;
      }
      if(mode==="login") {
        await fbAuth.signInWithEmailAndPassword(email, password);
      } else {
        await fbAuth.createUserWithEmailAndPassword(email, password);
      }
    } catch(e) {
      const msgs = {
        "auth/invalid-credential":"E-Mail oder Passwort falsch.",
        "auth/user-not-found":"Kein Konto mit dieser E-Mail gefunden.",
        "auth/wrong-password":"Falsches Passwort.",
        "auth/email-already-in-use":"Diese E-Mail ist bereits registriert.",
        "auth/weak-password":"Passwort muss mindestens 6 Zeichen haben.",
        "auth/invalid-email":"Ungültige E-Mail-Adresse.",
        "auth/network-request-failed":"Keine Internetverbindung.",
        "auth/too-many-requests":"Zu viele Versuche. Bitte warte kurz.",
      };
      setError(msgs[e.code] || "Fehler ("+e.code+"): "+e.message);
    }
    setLoading(false);
  };

  const handleGoogle = async () => {
    setLoading(true); setError("");
    try {
      const fbAuth = window._fb?.auth || window.firebase?.auth();
      const provider = window._fb?.googleProvider || new window.firebase.auth.GoogleAuthProvider();
      if(!fbAuth) throw {code:"no-auth", message:"Firebase nicht bereit"};
      // Popup first (works on iOS PWA 16.4+, Android, Desktop)
      // Redirect as fallback only if popup explicitly blocked
      try {
        await fbAuth.signInWithPopup(provider);
      } catch(popupErr) {
        if(popupErr.code === "auth/popup-blocked" || popupErr.code === "auth/operation-not-supported-in-this-environment") {
          // Fallback to redirect
          await fbAuth.signInWithRedirect(provider);
        } else {
          throw popupErr;
        }
      }
    } catch(e) {
      if(e.code === "auth/cancelled-popup-request" || e.code === "auth/popup-closed-by-user") {
        setError("");
      } else if(e.code === "auth/unauthorized-domain") {
        setError("Diese Domain ist nicht autorisiert. Bitte kontaktiere den Support.");
      } else {
        setError("Google fehlgeschlagen: "+e.message);
      }
      setLoading(false);
    }
  };

  return html`

      background:"var(--bg)", padding:"24px"

      <div style=${{
        background:"var(--surface)", borderRadius:20, padding:"36px 32px",
        width:"100%", maxWidth:400, boxShadow:"0 8px 40px rgba(30,58,47,.12)"
      }}>
        <!-- Logo -->
        <div style=${{textAlign:"center", marginBottom:28}}>
          <${Wordmark} dark=${true} height=${52}/>
        </div>

        <h2 style=${{fontFamily:"'Manuale',serif",fontSize:"1.3rem",color:"var(--text)",marginBottom:6,textAlign:"center"}}>
          ${mode==="login"?"Willkommen zurück":"Konto erstellen"}
        </h2>
        <p style=${{fontSize:".84rem",color:"var(--muted)",textAlign:"center",marginBottom:24}}>
          ${mode==="login"?"Melde dich mit deinem Konto an":"Erstelle deinen persönlichen Zugang"}
        </p>

        ${error && html`<div style=${{background:"#fff0ef",border:"1px solid #f5c0bc",borderRadius:10,padding:"10px 14px",fontSize:".83rem",color:"var(--danger)",marginBottom:14}}>${error}</div>`}

        <!-- Google Button -->
        <button onClick=${handleGoogle} disabled=${loading}
          style=${{width:"100%",padding:"11px",borderRadius:10,border:"1.5px solid var(--border)",background:"var(--surface)",cursor:"pointer",fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:".88rem",color:"var(--text)",display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:14,transition:"all .15s"}}>
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>

        <!-- Email -->

// ══ ATEMBALL OVERLAY ══
function BreathOverlay({ onDone }) {
  const [screen, setScreen] = useState('intro');
  const overlayRef = useRef(null);
  const ballRef    = useRef(null);
  const rafRef     = useRef(null);

  const IN_MS=4000, OUT_MS=6000, CYCLE=10000, REPS=3;
  const SZ_MIN=100, SZ_MAX=200;
  const ease = t => -(Math.cos(Math.PI*t)-1)/2;

  const startExercise = () => setScreen('exercise');

  // RAF-Loop – direkte DOM-Manipulation, kein State-Wechsel während Animation
  useEffect(()=>{
    if(screen!=='exercise') return;
    let startTime=null, finished=false;
    const frame = now => {
      if(!startTime) startTime=now;
      const elapsed=now-startTime;
      if(elapsed>=CYCLE*REPS){
        if(!finished){
          finished=true;
          cancelAnimationFrame(rafRef.current);
          // DOM direkt ersetzen – kein Preact State-Wechsel nötig
          const el = overlayRef.current;
          if(el){
            el.innerHTML = '';
            el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:var(--atemball-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;';
            const ball = document.createElement('div');
            ball.style.cssText = 'width:100px;height:100px;border-radius:50%;flex-shrink:0;margin-bottom:36px;background:radial-gradient(circle at 33% 28%,#f0ebe0 0%,#a8d4d4 18%,#3a9e9e 40%,#156e6e 64%,#0a4040 84%,#031c1c 100%);box-shadow:0 0 40px rgba(21,110,110,.22);';
            const w1 = document.createElement('div');
            w1.style.cssText = "font-family:'Exo 2',sans-serif;font-size:2rem;font-weight:300;color:rgba(255,255,255,.65);letter-spacing:6px;text-align:center;margin-bottom:20px;";
            w1.textContent = 'Ich bin.';
            const w2 = document.createElement('div');
            w2.style.cssText = "font-family:'Exo 2',sans-serif;font-size:.95rem;font-weight:300;color:rgba(255,255,255,.45);text-align:center;line-height:1.8;";
            w2.textContent = 'Nimm wahr, wie es sich anfühlt.';
            el.appendChild(ball);
            el.appendChild(w1);
            el.appendChild(w2);
          }
          setTimeout(()=>onDone(), 5000);
        }
        return;
      }
      const rep=Math.min(Math.floor(elapsed/CYCLE),REPS-1);
      const inCycle=elapsed%CYCLE;
      const isIn=inCycle<IN_MS;
      const t=isIn?inCycle/IN_MS:(inCycle-IN_MS)/OUT_MS;
      const sz=isIn?SZ_MIN+(SZ_MAX-SZ_MIN)*ease(t):SZ_MAX-(SZ_MAX-SZ_MIN)*ease(t);
      const b=ballRef.current;
      if(b){ b.style.width=sz+'px'; b.style.height=sz+'px'; }
      const lbl=document.getElementById('bh-rep-lbl');
      const ph=document.getElementById('bh-phase');
      const cnt=document.getElementById('bh-cnt');
      const totalSec=isIn?4:6;
      if(cnt)  cnt.textContent=Math.min(Math.floor(t*totalSec)+1,totalSec);
      if(ph)   ph.textContent=isIn?'Einatmen durch Nase':'Ausatmen durch Mund';
      if(lbl)  lbl.textContent='Atemübung · Runde '+(rep+1)+' von '+REPS;
      for(let i=0;i<REPS;i++){
        const d=document.getElementById('bh-dot-'+i);
        if(d) d.className='bh-dot'+(i<rep?' bh-done':i===rep?' bh-cur':'');
      }
      rafRef.current=requestAnimationFrame(frame);
    };
    rafRef.current=requestAnimationFrame(frame);
    return ()=>cancelAnimationFrame(rafRef.current);
  },[screen]);

  if(screen==='intro') return html`
    <div class="breath-overlay bh-intro" style=${{display:'flex'}}>
      <div class="bh-intro-ball"></div>
      <div class="bh-ebene">Verlasse den Kopf,<br/>komm im Körper an.</div>
      <div class="bh-bereit">Bereit?</div>
      <div class="bh-start-btn" onClick=${startExercise}>Start</div>
      <div class="bh-skip-lnk" onClick=${onDone}>Überspringen</div>
    </div>`;

  return html`
    <div ref=${overlayRef} class="breath-overlay bh-exercise" style=${{display:'flex'}}>
      <div class="bh-close-x" onClick=${onDone}>✕</div>
      <div id="bh-rep-lbl" class="bh-rep-lbl">Atemübung · Runde 1 von 3</div>
      <div class="bh-unit">
        <div class="bh-ball-wrap">
          <div class="bh-ball" ref=${ballRef} style=${{width:SZ_MIN+'px',height:SZ_MIN+'px'}}></div>
          <div id="bh-cnt" class="bh-count-inner">1</div>
        </div>
        <div id="bh-phase" class="bh-phase-word">Einatmen durch Nase</div>
      </div>
      <div class="bh-bottom">
        <div class="bh-dots">
          ${[0,1,2].map(i=>html`<div id=${'bh-dot-'+i} class=${'bh-dot'+(i===0?' bh-cur':'')}></div>`)}
        </div>
      </div>
    </div>`;
}

// Datum-Hilfsfunktionen — cross-browser sicher
const dateKeyFromTs = ts => { const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const formatDateKey = key => { try { const p=key.split('-'); const d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); const months=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember']; return d.getDate()+'. '+months[d.getMonth()]+' '+d.getFullYear(); } catch(e){return key;} };
function Root() {
  const [user,setUser]           = useState(null);
  const [authReady,setAuthReady] = useState(false);

  useEffect(() => {
    // Wait for Firebase to initialize
    let unsubscribe = null;
    const tryAuth = (attempts) => {
      const fbAuth = window._fb?.auth;
      if(fbAuth) {
        // Handle redirect result first (Google Sign-In on mobile)
        fbAuth.getRedirectResult().then(result => {
          // result.user is set if returning from redirect — onAuthStateChanged handles the rest
        }).catch(() => {});
        unsubscribe = fbAuth.onAuthStateChanged(u => {
          setUser(u);
          setAuthReady(true);
        });
      } else if(attempts < 20) {
        setTimeout(() => tryAuth(attempts + 1), 300);
      } else {
        // Firebase failed to load - show app anyway
        setAuthReady(true);
      }
    };
    tryAuth(0);
    return () => { if(unsubscribe) unsubscribe(); };
  }, []);

  if(!authReady) return html`
    <div style=${{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",width:"100%",flexDirection:"column",gap:16,background:"var(--bg)"}}>
      <div style=${{fontFamily:"'Exo 2',sans-serif",fontSize:".72rem",fontWeight:600,color:"#B8860B",letterSpacing:"1px"}}>88445719</div>
      <${Wordmark} dark=${true} height=${52}/>
      <div style=${{width:36,height:36,borderRadius:"50%",border:"3px solid var(--border)",borderTopColor:"var(--teal)",animation:"spin .8s linear infinite",willChange:"transform"}}/>
    </div>`;

  if(!user) return html`<${LoginPage}/>`;

  return html`<${AppGate} user=${user}/>`;
}

function AppGate({user}) {
  const [userDoc, setUserDoc]   = useState(undefined); // undefined=loading, null=missing, obj=exists
  const [agbDone, setAgbDone]   = useState(false);

  useEffect(() => {
    const firestore = window._fb?.db;
    if(!firestore) { setUserDoc(null); return; }
    firestore.collection("users").doc(user.uid).get()
      .then(async snap => {
        if(snap.exists) { setUserDoc(snap.data()); return; }
        // Kein users-Dokument vorhanden — prüfen, ob ein passender users_pending-Eintrag
        // (angelegt von Diana/Rico in der Admin-App) per E-Mail-Adresse geclaimt werden kann.
        const email = user.email;
        if(!email) { setUserDoc(null); return; }
        try {
          const pendingSnap = await firestore.collection("users_pending").doc(email).get();
          if(!pendingSnap.exists) { setUserDoc(null); return; }
          const pendingData = pendingSnap.data();
          const newDoc = {...pendingData, uid:user.uid, status:"active"};
          await firestore.collection("users").doc(user.uid).set(newDoc);
          await firestore.collection("users_pending").doc(email).delete().catch(()=>{});
          setUserDoc(newDoc);
        } catch(e) {
          setUserDoc(null);
        }
      })
      .catch(() => setUserDoc(null));
  }, [user.uid]);

  if(userDoc === undefined) return html`
    <div style=${{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",width:"100%",flexDirection:"column",gap:16,background:"var(--bg)"}}>
      <${Wordmark} dark=${true} height=${52}/>
      <div style=${{width:36,height:36,borderRadius:"50%",border:"3px solid var(--border)",borderTopColor:"var(--teal)",animation:"spin .8s linear infinite",willChange:"transform"}}/>
    </div>`;

  if(userDoc === null) return html`<${PendingScreen} user=${user}/>`;

  if(!agbDone && !userDoc.agbAccepted) return html`<${PrivacyScreen} user=${user} onAccept=${()=>setAgbDone(true)}/>`;

  return html`<${App} user=${user} userDoc=${userDoc}/>`;
}

// ── MOUNT ──
function BreathPortal() {
  // Einmal pro Kalendertag zeigen. WICHTIG (Fund 01.07.2026): localStorage statt
  // sessionStorage — sessionStorage überlebt zwar einen normalen Reload innerhalb
  // desselben Tabs, wird aber bei jedem Schliessen/Wiederöffnen der App als neue
  // Session gelöscht. Das führte dazu, dass der Atemball bei jedem App-Neustart
  // erneut erschien, statt wie beabsichtigt nur 1x/Tag. localStorage übersteht das,
  // der tagesbasierte Schlüssel sorgt trotzdem für den täglichen Reset.
  const todayKey = 'bh_shown_' + new Date().toISOString().slice(0,10);
  const alreadyShown = localStorage.getItem(todayKey) === '1';
  const [show, setShow] = useState(!alreadyShown);
  // Atemball nicht zeigen wenn Install-Banner aktiv (iOS + nicht als PWA)
  if(isIOS() && !isPWA()) return null;
  if(!show) return null;
  return html`<${BreathOverlay} onDone=${()=>{
    localStorage.setItem(todayKey, '1');
    setShow(false);
  }}/>`;
}

// ── Fehler-Overlay (ohne Class-Component) ──
window._showCrashScreen = function(errorInfo) {
  var app = document.getElementById('app');
  if(!app) return;
  app.innerHTML = '';
  var div = document.createElement('div');
  div.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f8f6f0;padding:32px 24px;text-align:center;font-family:Arial,sans-serif';
  div.innerHTML = '<div style="font-size:52px;margin-bottom:16px">⚠️</div>'
    + '<div style="font-size:1.2rem;font-weight:700;color:#1C1914;margin-bottom:10px">Etwas ist schiefgelaufen</div>'
    + '<div style="font-size:.85rem;color:#6B7280;line-height:1.6;max-width:300px;margin-bottom:24px">Die App hat einen unerwarteten Fehler. Bitte lade sie neu — das löst meistens das Problem.</div>'
    + '<button onclick="hardReload()" style="background:#156e6e;color:#fff;border:none;border-radius:10px;padding:11px 28px;font-size:.9rem;font-weight:600;cursor:pointer">App neu laden</button>'
    + '<div style="margin-top:20px;font-size:.72rem;color:#9CA3AF">Bleibt das Problem? info@selbstwirksamkeit.ch</div>'
    + (errorInfo ? '<div style="margin-top:22px;width:100%;max-width:340px;text-align:left;font-family:monospace;font-size:.68rem;color:#7A756B;background:#EFECE5;border:0.5px solid #D0CBC4;border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text">' + String(errorInfo).replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' : '');
  app.appendChild(div);
};

document.getElementById('app').innerHTML = '';
render(h(Root, null), document.getElementById('app'));
