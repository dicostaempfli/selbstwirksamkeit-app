    // Auto-reload when app comes back to foreground (gets latest version)
    // Safari/iOS friert PWA-Tabs im Hintergrund ein; ein einfacher reload() kann dann an einem
    // gerade erst wieder aufwachenden Service Worker "verhungern" (weisser Screen ohne Fehler).
    // Fix: harter Reload via location.href (umgeht eher den SW-Fetch-Pfad als reload()) + kurzes
    // Warten auf SW-Bereitschaft mit Timeout-Fallback, damit der Reload nie unbegrenzt blockiert.
    function hardReload() {
      const bust = 'rsw_reload=' + Date.now();
      const url = window.location.href.split('#')[0];
      const sep = url.includes('?') ? '&' : '?';
      let hash = window.location.hash || '';
      // Fix (02.07.2026, Kapitel 33, Fund "Tagesimpuls-Push nach Phasenwechsel: Crash +
      // Reload landet auf Home statt Tagesimpuls"): Trägt die URL selbst keinen Hash (Normalfall,
      // da sw.js für bereits offene Clients nur noch in Cache Storage schreibt statt einen Hash zu
      // setzen), ging bei JEDEM Reload-Pfad (Watchdog, Crash-Screen, Hintergrund>60s) ein zuvor
      // erfolgreich angewendetes Push-Ziel verloren, sobald der pending-deeplink-Cache-Eintrag
      // schon konsumiert war (er wird beim ersten Lesen sofort gelöscht — applyPendingDeepLink).
      // routeHash() hinterlegt deshalb bei jedem erfolgreichen Routing zusätzlich einen sehr
      // kurzlebigen (30s) Recovery-Eintrag in localStorage — einmalig gelesen und sofort gelöscht,
      // damit spätere, unabhängige Reloads (z.B. normales Hintergrund/Vordergrund-Wechseln nach
      // Minuten) nicht ungewollt auf ein längst überholtes Ziel zurückspringen.
      if(!hash) {
        try {
          const raw = localStorage.getItem('rsw_crash_recover_hash');
          if(raw) {
            localStorage.removeItem('rsw_crash_recover_hash');
            const r = JSON.parse(raw);
            if(r && r.hash && (Date.now() - (r.ts || 0) < 30000)) hash = '#' + r.hash;
          }
        } catch(e) {}
      }
      window.location.href = url + sep + bust + hash;
    }
    // Fix (03.07.2026, Fund "Watchdog-Timeout/Home-Landing bei Phasenwechsel-Push auf
    // schwachem Netz"): Der harte Reload-Pfad braucht jetzt den ServiceWorker-Ready-Race
    // als eigene, benannte Funktion, da er ab sofort NICHT mehr der einzige Ausgang aus
    // dem >60s-Zweig ist (siehe visibilitychange-Handler unten).
    function doHardReload() {
      if('serviceWorker' in navigator) {
        const timeout = new Promise(res => setTimeout(res, 800));
        Promise.race([navigator.serviceWorker.ready, timeout]).then(hardReload).catch(hardReload);
      } else {
        hardReload();
      }

  .btn-primary { background:var(--surface); border:1.5px solid var(--accent); color:var(--text); }
  .btn-primary:hover { background:var(--accent-pale); border-color:var(--accent-dark); }
  .btn-sage { background:transparent; border:1.5px solid var(--accent); color:var(--accent); }
  .btn-sage:hover { background:var(--accent-pale); }
  .btn-lime { background:var(--accent); color:#fff; border:none; }
  .btn-lime:hover { background:var(--accent-dark); }
  .btn-ghost { background:transparent; border:1px solid var(--border); color:var(--muted2); }
  .btn-ghost:hover { border-color:var(--border2); color:var(--muted); }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-sm { padding:4px 10px; font-size:.75rem; }

  /* Forms */
  .label { font-size:.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; display:block; }
  .input,.textarea,.select {
    width:100%; padding:8px 12px; border:1.5px solid var(--border); border-radius:10px;
    font-family:'Exo 2'; font-size:16px; background:var(--surface); color:var(--text); transition:border .2s;
  }
  .input:focus,.textarea:focus,.select:focus { outline:none; border-color:var(--teal); }
  .textarea { resize:vertical; min-height:74px; overflow-wrap:break-word; word-break:break-word; }
  .form-row { margin-bottom:12px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .flex-between { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }

  /* Goals */
  .goal-item { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:13px 15px; margin-bottom:9px; }
  .goal-item.done { opacity:.5; }
  .goal-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .goal-title { font-weight:700; font-size:.89rem; }
  .goal-area { font-size:.67rem; padding:2px 8px; border-radius:99px; font-weight:700; }
  .area-eltern { background:var(--teal-pale); color:var(--teal-dark); }
  .area-paar   { background:var(--sage-pale); color:var(--teal-dark); }
  .area-ich    { background:var(--sage-pale); color:var(--teal-dark); }
  .progress-bar { height:5px; background:var(--border); border-radius:99px; margin-top:8px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--teal); border-radius:99px; transition:width .4s; }
  .goal-meta { display:flex; justify-content:space-between; align-items:center; margin-top:7px; }
  .goal-date { font-size:.71rem; color:var(--muted); }
  .goal-actions { display:flex; gap:4px; }

  /* Journal */
  .journal-entry { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:13px 15px; margin-bottom:9px; }
  .je-header { display:flex; justify-content:space-between; margin-bottom:7px; align-items:center; }
  .je-date { font-size:.73rem; color:var(--muted); }
  .je-text { font-size:.87rem; line-height:1.6; white-space:pre-wrap; }
  .mood-row { display:flex; gap:7px; margin-bottom:10px; }
  .mood-btn {
    padding:6px 13px; border-radius:99px; cursor:pointer; border:1.5px solid var(--border);
    font-size:.74rem; font-weight:700; font-family:'Exo 2'; color:var(--muted);
    background:var(--surface2); transition:all .15s;
  }
  .mood-btn.selected { border-color:var(--teal); background:var(--teal); color:#fff; }

  /* Reminders */
  .reminder-item { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .reminder-item-top { display:flex; justify-content:space-between; align-items:center; }
  .rem-photo-add { width:60px; height:60px; border-radius:8px; border:2px dashed var(--border2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; color:var(--muted); font-size:.6rem; font-weight:700; font-family:'Exo 2',sans-serif; transition:all .15s; }
  .rem-photo-add:hover { border-color:var(--teal); color:var(--teal-dark); background:var(--teal-pale); }
  .reminder-left { display:flex; align-items:center; gap:12px; }
  .reminder-icon-wrap { width:36px; height:36px; border-radius:9px; background:var(--sage-pale); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--teal-dark); flex-shrink:0; }
  .reminder-text { font-weight:700; font-size:.86rem; }
  .reminder-time { font-size:.73rem; color:var(--muted); margin-top:1px; }
  .toggle { width:40px; height:22px; background:var(--border2); border-radius:99px; cursor:pointer; position:relative; border:none; transition:background .2s; }
  .toggle.on { background:var(--teal); }
  .toggle::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .toggle.on::after { left:21px; }

  /* Icon picker */
  .icon-picker { display:flex; gap:6px; flex-wrap:wrap; }
  .icon-pick-btn { width:38px; height:38px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface2); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--muted); transition:all .15s; }
  .icon-pick-btn:hover { border-color:var(--teal); color:var(--teal-dark); }
  .icon-pick-btn.selected { border-color:var(--accent); background:var(--accent); color:#fff; }

  /* Recurrence */
  .rec-tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .rec-tab { padding:7px 13px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); color:var(--muted); font-family:'Exo 2'; font-weight:700; font-size:.81rem; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .15s; }
  .rec-tab:hover { border-color:var(--teal); color:var(--text); }
  .rec-tab.active { border-color:var(--accent); background:var(--accent); color:#fff; }
  .rec-preview { background:var(--accent-pale); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:11px 13px; font-size:.88rem; color:var(--muted); margin-top:10px; line-height:1.6; }
  .rec-preview strong { color:var(--text); }
  .day-picker { display:flex; gap:5px; }
  .day-btn { width:38px; height:38px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface2); color:var(--muted); font-family:'Exo 2'; font-weight:700; font-size:.72rem; cursor:pointer; transition:all .15s; }
  .day-btn.sel { border-color:var(--accent); background:var(--accent); color:#fff; }
  .mday-grid { display:flex; gap:4px; flex-wrap:wrap; max-width:360px; }
  .mday-btn { width:33px; height:33px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); color:var(--muted); font-family:'Exo 2'; font-weight:700; font-size:.73rem; cursor:pointer; transition:all .15s; }
  .mday-btn.sel { border-color:var(--accent); background:var(--accent); color:#fff; }

  /* Modal */
  .overlay { position:fixed; inset:0; background:rgba(20,50,30,.3); z-index:9999; display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--surface); border-radius:var(--radius); padding:20px; padding-bottom:0; box-sizing:border-box; width:calc(100vw - 32px); max-width:460px; min-width:0; max-height:calc(100dvh - 80px); overflow-y:auto; overflow-x:hidden; box-shadow:0 20px 60px rgba(20,60,30,.2); display:flex; flex-direction:column; }
  .modal-title { font-family:'Manuale',serif; font-size:1.15rem; color:var(--text); margin-bottom:16px; }
  .modal-actions { display:flex; gap:8px; justify-content:space-between; flex-shrink:0; background:var(--surface); padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 16px); border-top:2px solid var(--border); margin:0 -20px -0px; margin-top:16px; }

  /* Dashboard stats */
  .stat-grid { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .stat-card { background:var(--surface); border-radius:var(--radius); border:0.5px solid var(--border); padding:16px 18px; border-left:4px solid var(--sage); }
  .stat-card:nth-child(2) { border-left-color:var(--lime); }
  .stat-card:nth-child(3) { border-left-color:var(--teal); }
  .stat-card:nth-child(4) { border-left-color:var(--sage-dark); }
  .stat-label { font-size:.69rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .stat-value { font-family:'Manuale',serif; font-size:1.75rem; color:var(--text); margin-top:2px; }
  .stat-hint { font-size:.74rem; color:var(--teal-dark); margin-top:2px; }

  .quote-block { background:var(--sage); border-radius:var(--radius); padding:20px 24px; margin-bottom:18px; position:relative; overflow:hidden; text-align:center; }
  .quote-block::before { content:''; }
  .quote-text { font-family:'Manuale',serif; font-size:1.15rem; font-style:italic; line-height:1.65; color:#fff; text-align:center; }
  .quote-author { font-size:.74rem; color:rgba(255,255,255,.85); margin-top:8px; font-weight:700; text-align:center; }

  /* Section label */
  .section-label { font-size:.69rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; margin-bottom:8px; margin-top:2px; display:flex; align-items:center; gap:7px; }
  .section-label-line { flex:1; height:1px; background:var(--border); }

  /* Info tip */
  .info-tip { border-radius:var(--radius); padding:13px 16px; margin-bottom:16px; font-size:.83rem; line-height:1.65; display:flex; align-items:flex-start; gap:11px; }
  .info-tip-lime { background:var(--lime-pale); border-left:3px solid var(--lime-dark); color:var(--text); }
  .info-tip-sage { background:var(--sage-pale); border-left:3px solid var(--sage-dark); color:var(--text); }

  /* Library */
  .lib-filter { display:flex; gap:7px; margin-bottom:18px; flex-wrap:wrap; }
  .lib-filter-btn { padding:6px 14px; border-radius:99px; border:1.5px solid var(--border); background:var(--surface); color:var(--muted); font-family:'Exo 2'; font-weight:700; font-size:.79rem; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .15s; }
  .lib-filter-btn.sel               { border-color:#c4b8a8; background:#c4b8a8; color:#3a3028; }
  .lib-filter-btn[data-type="audio"].sel { border-color:var(--accent); background:var(--accent); color:white; }
  .lib-filter-btn[data-type="video"].sel { border-color:var(--accent); background:var(--accent); color:#fff; }
  .lib-filter-btn[data-type="dokus"].sel { border-color:var(--accent); background:var(--accent); color:#fff; }
  /* All filter buttons use same forest color when selected */
  .lib-filter-btn:hover { border-color:var(--teal); }
  .lib-grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-bottom:20px; }
  .lib-card { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; cursor:pointer; transition:transform .15s,box-shadow .15s; }
  .lib-card:hover { transform:translateY(-2px); box-shadow:var(--shadow2); }
  .lib-thumb { width:100%; height:130px; display:flex; align-items:center; justify-content:center; color:var(--muted); position:relative; }
  .lib-thumb img { width:100%; height:100%; object-fit:cover; }
  .lib-type-badge { position:absolute; top:9px; left:9px; padding:3px 9px; border-radius:99px; font-size:.67rem; font-weight:700; display:flex; align-items:center; gap:4px; }
  .badge-audio { background:var(--accent); color:white; }
  .badge-video { background:var(--accent); color:#fff; }
  .badge-dokus { background:var(--accent); color:#fff; }
  .badge-foto  { background:#0e7490; color:#fff; }
  .lib-play-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(30,60,35,.2); }
  .lib-play-btn { width:40px; height:40px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .lib-card-body { padding:12px; border-left-width:3px; border-left-style:solid; }
  .lib-card-title { font-weight:700; font-size:.88rem; margin-bottom:3px; color:var(--text); }
  .lib-card-desc { font-size:.88rem; color:var(--muted); line-height:1.5; }
  .lib-card-meta { display:flex; justify-content:space-between; align-items:center; margin-top:9px; font-size:.71rem; color:var(--muted); }

  /* Upload zone */
  .upload-zone { border:2px dashed var(--border2); border-radius:var(--radius); padding:28px; text-align:center; cursor:pointer; transition:all .2s; color:var(--muted); }
  .upload-zone:hover,.upload-zone.drag { border-color:var(--teal); background:var(--teal-pale); color:var(--teal-dark); }
  .upload-zone p { font-size:.86rem; margin-top:8px; }
  .upload-zone span { font-size:.74rem; color:var(--muted); display:block; margin-top:3px; }


  /* ── DOODLE / TERMINFINDUNG ── */
  .doodle-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:12px;border:1.5px solid var(--border2);transition:transform .15s}
  .doodle-card:hover{transform:translateY(-1px)}
  .doodle-card.closed{border-left-color:var(--border2);opacity:.7}
  .doodle-title{font-family:'Manuale',serif;font-weight:700;font-size:1rem;color:var(--text);margin-bottom:6px}
  .doodle-meta{font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
  .doodle-recipients{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
  .recipient-chip{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--sage-pale);color:var(--text)}
  .doodle-actions{display:flex;gap:7px;flex-wrap:wrap}
  .timeslot-row{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:10px;padding:9px 13px;margin-bottom:6px;border:1.5px solid transparent}
  .timeslot-row.best-slot{background:var(--teal-pale);border-color:var(--teal)}
  .timeslot-datetime{flex:1;font-size:.85rem;font-weight:600;color:var(--text)}
  .votes-wrap{display:flex;gap:4px;flex-wrap:wrap}
  .vote-chip{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.63rem;font-weight:700}
  .vote-yes-chip{background:var(--teal);color:white}
  .vote-no-chip{background:#ffe0de;color:var(--danger)}
  .vote-unknown-chip{background:#f0f0f0;color:#999}
  .vote-count-label{font-size:.76rem;font-weight:700;color:var(--muted);min-width:44px}
  .vote-count-label.best{color:var(--teal-dark)}
  .best-badge{font-size:.62rem;font-weight:700;background:var(--teal);color:white;padding:1px 7px;border-radius:99px;margin-left:6px}
  .status-pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px}
  .status-open{background:var(--lime-pale);color:#6b6200}
  .status-closed{background:#f0f0f0;color:#777}
  .slot-list-build{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  .slot-item-build{display:flex;align-items:center;justify-content:space-between;background:var(--sage-pale);border-radius:8px;padding:7px 12px;font-size:.85rem;font-weight:600;color:var(--text)}
  .coachee-check-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;cursor:pointer;transition:background .15s;border:1.5px solid transparent;margin-bottom:5px}
  .coachee-check-row:hover{background:var(--sage-pale)}
  .coachee-check-row.sel{background:var(--teal-pale);border-color:var(--teal)}
  .coachee-av-sm{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;flex-shrink:0}
  /* vote rows coachee */
  .vote-row-c{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:10px;margin-bottom:8px;background:var(--bg);border:1.5px solid var(--border);transition:all .15s;cursor:pointer}
  .vote-row-c.sel-yes{background:var(--teal-pale);border-color:var(--teal);border-width:2px}
  .vote-row-c.sel-no{background:#fff0ef;border-color:#f5c0bc;border-width:2px}
  .vbtn{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-size:.95rem;transition:all .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .vbtn:hover{transform:scale(1.1)}
  .vbtn.yes.on{background:var(--teal);border-color:var(--teal-dark);color:#fff}
  .vbtn.no.on{background:var(--danger);border-color:#a03020;color:white}
  /* event cards */
  .event-card-row{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;display:flex;transition:transform .15s}
  .event-card-row:hover{transform:translateY(-2px)}
  .event-date-blk{width:68px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 6px}
  .event-day-big{font-family:'Manuale',serif;font-size:1.7rem;font-weight:700;line-height:1;color:white}
  .event-month-sm{font-size:.68rem;font-weight:700;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:.5px}
  .event-body-c{flex:1;padding:14px 16px}
  .event-title-c{font-family:'Manuale',serif;font-size:.97rem;font-weight:700;color:var(--text);margin-bottom:3px}
  .event-meta-c{font-size:.84rem;color:var(--muted);margin-bottom:7px}
  .event-desc-c{font-size:.88rem;color:var(--text);line-height:1.55;margin-bottom:9px}
  .event-bar{height:4px;background:var(--border);border-radius:99px;margin-top:6px;overflow:hidden}
  .event-bar-fill{height:100%;border-radius:99px;transition:width .4s}
  /* sub-tabs inside doodle page */
  .sub-tabs{display:flex;gap:6px;margin-bottom:20px}
  .sub-tab{padding:7px 16px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-family:'Exo 2',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;transition:all .15s}
  .sub-tab.active{background:var(--forest);color:white;border-color:var(--forest)}
  .sub-tab:hover:not(.active){border-color:var(--teal);color:var(--forest)}
  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--forest);color:white;padding:12px 20px;border-radius:10px;font-size:.85rem;font-weight:600;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .3s;pointer-events:none}


  /* ── CRISP POSITION FIX (mobile) ── */
  @media (max-width: 768px) {
    #crisp-chatbox, .crisp-client {
      bottom: 70px !important;  /* above bottom nav */
    }
  }

  @media (max-width: 375px) {
    .grid-2, .form-grid { grid-template-columns: 1fr !important; }
    .page-heading { font-size: 1.2rem; }
    .stat-card { padding: 10px 12px; }
    .modal { padding: 14px 12px !important; }
    .rem-area-btn { padding: 5px 10px !important; font-size: .72rem !important; }
    .btn { padding: 7px 12px; font-size: .8rem; }
  }

  /* Extra fixes */
  @keyframes spin { to { transform: rotate(360deg); } }
  *, *::before, *::after { box-sizing: border-box; }
  html { overflow: hidden; max-width: 100vw; }
  body { font-family:'Exo 2',sans-serif; background:var(--bg); color:var(--text); margin:0; overflow:hidden; width:100%; touch-action:pan-y; }
  #app { height: var(--vp-h, 100dvh); display: flex; overflow: hidden; position: relative; padding-top: 32px; box-sizing: border-box; }
  #breath-portal { position:fixed;top:0;left:0;width:100vw;height:100dvh;z-index:9999;background:var(--atemball-bg); }
  #breath-portal:empty { display:none; }
  /* Portal für Fixed-Overlays, die inhaltlich zu #app gehören (z.B. ImpulsPushPopup),
     aber wie der Atemball ausserhalb von #app liegen müssen, da position:fixed innerhalb
     von #app (overflow:hidden) auf bestimmten iOS-Safari-Konfigurationen geclippt/nicht
     dargestellt werden kann. Niedrigerer z-index als #breath-portal (9999), damit ein
     zufällig noch sichtbarer Atemball weiterhin Vorrang hat. pointer-events:none auf dem
     leeren Container, damit er nicht versehentlich Klicks auf #app blockiert, wenn er
     leer ist (zusätzlich zu :empty{display:none} als zweite Absicherung). */
  #overlay-portal { position:fixed;top:0;left:0;width:100vw;height:100dvh;z-index:9998;pointer-events:none; }
  #overlay-portal:empty { display:none; }
  #overlay-portal > * { pointer-events:auto; }
  input[type=range] { cursor: pointer; }
  textarea { font-family: inherit; }
  select { font-family: inherit; }

  /* ══════════════════════════════
     MOBILE RESPONSIVE (max 768px)
  ══════════════════════════════ */

  /* Bottom nav bar - hidden on desktop */
  .bottom-nav {
    display: none;
  }

  @media (max-width: 768px) {
    /* Body & root */
    #app {
      flex-direction: column;
      padding-top: 0;
    }

    /* Push content down from status bar */
    .panel-header,
    .content-main > *:first-child {
      padding-top: 0;
    }

    .topbar {
      padding-top: max(52px, calc(env(safe-area-inset-top, 0px) + 44px));
    }



    /* Hide desktop sidebar */
    .sidebar { display: none !important; }

    /* Main content area takes full width */
    .app > div:last-child,
    .app > div:nth-child(2) {
      flex: 1;
      min-width: 0;
      width: 100%;
      overflow: hidden;
    }

    /* Content pages */
    .content-main {
      padding: 16px 14px calc(72px + env(safe-area-inset-bottom, 0px) + 16px);
      padding-top: max(52px, calc(env(safe-area-inset-top, 0px) + 44px));
      overflow-y: auto;

const PUSH_SW_URL = './sw.js';
const PUSH_SCOPE  = './';

// VAPID Public Key (Web Push — kostenlos, kein Server nötig für lokale Notifications)
// Für echten Server-Push muss hier ein echter VAPID Key eingetragen werden.
// Für lokale Browser-Notifications (kein Server) wird kein Key benötigt.
const PUSH_VAPID_KEY = "BBCn3O14AGtrDs2x0uADp8OAb3y-66BlJOJe84QnMMnRrVIjq1Ahfnexvz07VqUg7PdKxGKK943U6FD0mCphaiA"; // Public Key — unbedenklich im Client, da nur zur Verschlüsselung der Subscription verwendet

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

// Erzeugt eine echte Push-Subscription (für Push bei geschlossener App) und speichert sie
// pro Coachee in Firestore — die Cloud Function liest diese Subscriptions beim Versand.
// Prüft den Public Key der bestehenden Browser-Subscription gegen den aktuellen PUSH_VAPID_KEY:
// bei VAPID-Schlüsselwechsel (z.B. nach einem Secret-Reset) bleibt sonst eine alte, nicht mehr
// passende Subscription im Browser/Service-Worker bestehen (unsubscribe() ist nötig, getSubscription()
// allein liefert sonst die alte Subscription unverändert zurück → VapidPkHashMismatch beim Versand).
// Erzeugt einen kurzen, stabilen Schlüssel aus dem Subscription-Endpoint (eindeutig pro
// Browser/Gerät) — identisches Muster wie in admin.html, ermöglicht mehrere Geräte (z.B.
// iPhone + Desktop) gleichzeitig unter derselben Coachee-UID, statt sich beim erneuten
// Abonnieren gegenseitig zu überschreiben.
async function subKeyFromEndpoint(endpoint) {
  const enc = new TextEncoder().encode(endpoint);
  const hashBuffer = await crypto.subtle.digest('SHA-256', enc);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 24);
}

async function subscribeToPush(uid) {
  try {
    if(!PUSH_VAPID_KEY || !uid) return;
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(sub) {
      const currentKey = urlBase64ToUint8Array(PUSH_VAPID_KEY);
      const subKey = new Uint8Array(sub.options?.applicationServerKey || []);
      const keyMatches = subKey.length === currentKey.length && subKey.every((b,i) => b === currentKey[i]);
      if(!keyMatches) {
        await sub.unsubscribe().catch(()=>{});
        sub = null;
      }
    }
    if(!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(PUSH_VAPID_KEY)
      });
    }
    const fbDb = window._fb?.db;
    if(fbDb && sub) {
      const subJson = JSON.parse(JSON.stringify(sub));
      const deviceKey = await subKeyFromEndpoint(subJson.endpoint);
      fbDb.collection("users").doc(uid)
        .collection("devices").doc(deviceKey)
        .set({ pushSubscription: subJson, updatedAt: Date.now() }).catch(()=>{});
    }
  } catch(e) {}
}

async function registerSW() {
  if(!('serviceWorker' in navigator)) return null;
  try {
    const reg = await navigator.serviceWorker.register(PUSH_SW_URL, { scope: PUSH_SCOPE });
    return reg;
  } catch(e) { return null; }
}

async function requestPushPermission() {
  try {
    if(!('Notification' in window)) return false;
    if(Notification.permission === 'granted') return true;
    if(Notification.permission === 'denied') return false;
    const result = await Notification.requestPermission();
    return result === 'granted';
  } catch(e) { return false; }
}

function isPWA() {
  try {
    return window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
  } catch(e) { return false; }
}

function isIOS() {
  return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function showLocalNotification(title, body, tag, urlPath) {
  try {
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    navigator.serviceWorker?.ready.then(reg => {
      reg.showNotification(title, {
        body,
        tag: tag || 'rsw',
        icon: './icon-192.png',
        data: { url: urlPath || './' },
        vibrate: [100, 50, 100],
        requireInteraction: false
      });
    }).catch(() => {
      try { new Notification(title, { body, tag }); } catch(e) {}
    });
  } catch(e) {}
}

// Globaler SW Init beim Laden — mit Auto-Update-Mechanismus
let _swReg = null;
window.addEventListener('load', () => {
  registerSW().then(r => {
    _swReg = r;
    if(!r) return;
    // Neuer SW aktiviert → Seite neu laden (nur einmalig, mit Debounce).
    // WICHTIG: hardReload() statt window.location.reload() — exakt der gleiche Safari/iOS-
    // Hängenpunkt wie im visibilitychange-Handler oben (siehe v3.56-Fix/Pitfall 29): ein
    // klassischer reload() kann an einem gerade erst (neu) aktivierten Service Worker
    // verhungern. Dieser Pfad feuert insbesondere beim Kaltstart durch einen Push-Klick
    // zuverlässig, da dort registerSW() immer neu aufgerufen wird — bisher fehlender,
    // zweiter Reload-Trigger neben visibilitychange, der denselben weissen Bildschirm
    // auslösen konnte.
    let reloadPending = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(reloadPending) return;
      reloadPending = true;
      setTimeout(hardReload, 300);
    });
    // SW wartet auf Aktivierung → skipWaiting anstoßen
    r.addEventListener('updatefound', () => {
      const newWorker = r.installing;
      if(!newWorker) return;
      newWorker.addEventListener('statechange', () => {
        if(newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          newWorker.postMessage({ type: 'SKIP_WAITING' });
        }
      });
    });
    // Sofort prüfen ob Update verfügbar
    r.update().catch(() => {});
  }).catch(() => {});
});

    // der Browser die an clients.openWindow() übergebene URL nicht immer zuverlässig weiter
    // (bekannte WebKit-Einschränkung) — die App startet dann ohne Hash bei der start_url.
    // sw.js legt das eigentliche Ziel deshalb zusätzlich im Cache Storage ab; hier wird das
    // beim Boot ausgelesen und nachträglich angewendet, unabhängig davon, ob der Hash in der

    // Deep-Link bei einem späteren, regulären App-Start irrtümlich erneut angewendet wird.
    const applyPendingDeepLink = async (attempt) => {
      attempt = attempt || 0;
      if(!('caches' in window)) return;
      try {
        const cache = await caches.open('pending-deeplink');
        const resp = await cache.match('/pending');
        if(!resp) {
          // Fix (02.07.2026, Fund "Tagesimpuls-Push nach Phasenwechsel zeigt Home statt
          // Impuls", Kapitel 32): Seit dem SW-Race-Fix schreibt sw.js den Cache-Eintrag
          // parallel zu client.focus() statt davor. Bei kurzer Hintergrundzeit (kein
          // Reload, siehe visibilitychange-Handler oben) kann applyPendingDeepLink()
          // dadurch VOR dem Cache-Write der SW ankommen und findet noch nichts — der
          // Deep-Link ging dadurch verloren, die App blieb auf der zuletzt sichtbaren
          // Seite (meist Home) stehen. Kurzer, mehrfacher Retry schliesst dieses enge
          // Zeitfenster, ohne bei echten "kein Deep-Link"-Fällen spürbar zu verzögern.
          // Erweiterung (03.07.2026, Fund "Meine-Impulse-Push landet auf Home"): Bei
          // Hintergrundzeit >60s löst der visibilitychange-Handler zusätzlich hardReload()
          // aus (volle Seiten-Navigation), NACHDEM client.focus() bereits das
          // visibilitychange-Event ausgelöst hat — dieser Reload kann dem parallelen
          // cacheWrite in sw.js zuvorkommen, das alte 600ms-Fenster (4×150ms) reichte in
          // diesem Fall oft nicht. Grosszügiger auf ca. 2s (10×200ms) erweitert, damit auch
          // dieser Reload-Pfad den Cache-Eintrag zuverlässig noch vorfindet.
          if(attempt < 10) setTimeout(() => applyPendingDeepLink(attempt + 1), 200);
          return;
        }
        const data = await resp.json();
        await cache.delete('/pending');
        // Fix (02.07.2026, Fund "alle Push-Kategorien landen zufällig auf Home", Kapitel
        // 32): 60s-Fenster war für reale Nutzung viel zu knapp — eine Push-Notification
        // wird selten sofort angetippt, sondern oft erst nach Minuten aus der
        // Mitteilungszentrale. War die Zeitspanne überschritten, verwarf die App den
        // Deep-Link und landete beim Default (Home) — unabhängig von der Push-Kategorie.
        // Der Cache-Eintrag wird ohnehin immer gelöscht, sobald er gelesen wird (Zeile
        // oben), ein kurzes Zeitfenster bringt daher kaum Schutz, verwirft aber legitime,
        // verspätete Taps. Grosszügig auf 24h erweitert.
        if(Date.now() - (data.ts || 0) > 24*60*60*1000) return;
        const hash = (data.url || '').includes('#') ? data.url.split('#')[1] : '';
        if(hash) routeHash(hash);
      } catch(e) {}
    };
    // Fix 02.07.2026 (Kapitel 32): global exponieren, damit der visibilitychange-Handler
    // ganz oben im File (ausserhalb von React/Preact) sie bei kurzer Hintergrundzeit
    // (kein Reload) direkt aufrufen kann — ohne diesen Hook bliebe ein während des
    // Fokuswechsels geschriebener Deep-Link sonst wirkungslos.
    window.__swApplyPendingDeepLink = applyPendingDeepLink;
    applyHash();

    // bewusst KEIN hashchange aus, kein Schleifenrisiko). Sonst bleibt er im Tab-/PWA-
    // Verlauf hängen: ein simples Neuladen oder Wiederöffnen landete dadurch immer wieder
    // auf der zuletzt besuchten Seite statt auf der Home-Seite, obwohl useState("dashboard")
    // das eigentlich als Standard vorsieht. Ein echter Push-Tap setzt den Hash bei jedem
    // Tap ohnehin frisch neu — davon unberührt.
    if(window.location.hash) {

    const syncCollection = async (ref, initData, setter, idField) => {
      try {
        const snap = await ref.get();
        if(snap.empty) {
          for(const item of initData) {
            await ref.doc(String(item[idField||"id"])).set({...item, uid});

        } else {
          setter(snap.docs.map(d=>({...d.data(), id:d.id})));

    syncCollection(libRef,    INIT_LIBRARY,   setLibrary);
    syncCollection(doodleRef, INIT_DOODLES,   setDoodles);

    // Live listeners

  // + erteilte Push-Berechtigung) sowie Desktop-Chrome/Edge unterstützen navigator.setAppBadge;
  // Chrome für Android exponiert die API bewusst nicht (eigene, nicht steuerbare OS-Badge

function ChatPage({user,coachees,setCoachees,mobileChatOpen,setMobileChatOpen,recipient,setRecipient}) {
  const uid = user?.uid || null;
  const fbDb = window._fb?.db;
  const coachee = {id:"coach",name:"Diana & Rico",initials:"DR",color:"var(--accent)",photo:null,online:true,topic:"Dein Coaching",messages:[]};
  const [messages,setMessages] = useState([]);
  // recipient/setRecipient kommen seit dem Bugfix 12.08.2026 als Props von App (gehobener
  // State) — der Unread-Zähler in App muss wissen, welcher Strang gerade sichtbar ist,
  // um nur diesen als gelesen zu markieren (siehe chatUnreadDiana/chatUnreadRico in App).

  useEffect(() => {
    if(!uid||!fbDb) return;
    const ref = fbDb.collection("chats").doc(uid).collection("messages").orderBy("ts","asc").limitToLast(80);
    const unsub = ref.onSnapshot(snap => {
      setMessages(snap.docs.map(d=>({...d.data(),id:d.id})));
    }, ()=>{});
    return () => unsub();
  }, [uid]);

  // Beim Öffnen des Chat-Tabs (Nav-Icon) direkt den Strang des zuletzt schreibenden Absenders
  // zeigen, statt immer auf "Diana" zu starten — sonst landet man nach einer Rico-Nachricht
  // erst im falschen (Diana-)Strang. Nur beim ersten Laden nach dem Mount, damit ein manueller
  // Tab-Wechsel danach nicht wieder überschrieben wird.
  const initialRecipientSetRef = useRef(false);
  useEffect(() => {
    if(initialRecipientSetRef.current || !messages.length) return;
    initialRecipientSetRef.current = true;
    const lastAdminMsg = [...messages].reverse().find(m=>m.from==="admin");
    if(lastAdminMsg && (lastAdminMsg.sender==="Diana"||lastAdminMsg.sender==="Rico")) {
      setRecipient(lastAdminMsg.sender);
    }
  }, [messages]);

  // Verlauf auf den aktiven Strang filtern — Umschalten entspricht einem echten Kontaktwechsel,
  // nicht nur der Adressierung neuer Nachrichten. Alte Nachrichten ohne recipient-Feld gelten als "Diana".
  const filteredMessages = messages.filter(m => {
    const ctx = m.from==="admin" ? (m.sender||"Diana") : (m.recipient||"Diana");
    return ctx===recipient;
  });

  const coacheeWithMsgs = {...coachee, messages:filteredMessages};

  const sendMsg = text => {
    if(!text.trim()||!uid||!fbDb) return;
    const t = new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
    const d = dateKeyFromTs(Date.now());
    fbDb.collection("chats").doc(uid).collection("messages").add({from:"coachee",sender:uid,recipient,text:text.trim(),time:t,date:d,ts:Date.now(),seen:false}).catch(()=>{});
  };

  const sendImg = (dataUrl, isVideo=false) => {
    if(!uid||!fbDb) return;
    const t = new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
    const d = dateKeyFromTs(Date.now());
    fbDb.collection("chats").doc(uid).collection("messages").add({from:"coachee",sender:uid,recipient,imgSrc:dataUrl,isVideo,text:"",time:t,date:d,ts:Date.now()}).catch(()=>{});
  };

  const sendFile = async file => {
    if(!uid||!fbDb) return;
    const fbStorage = window._fb?.storage;
    const t = new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
    const d = dateKeyFromTs(Date.now());
    try {
      let fileData = file;
      if(fbStorage && file.url && file.url.startsWith('data:')) {
        // Base64 → Blob → Storage hochladen
        const resp = await fetch(file.url);
        const blob = await resp.blob();
        const ext  = file.name.split('.').pop() || 'bin';
        const path = 'chats/'+uid+'/'+Date.now()+'_'+file.name;
        const ref  = fbStorage.ref(path);
        await ref.put(blob, {contentType: file.type || blob.type});
        const downloadUrl = await ref.getDownloadURL();
        fileData = {name: file.name, type: file.type, size: file.size||blob.size, isAudio: file.isAudio||false, url: downloadUrl, storagePath: path};
      }
      await fbDb.collection("chats").doc(uid).collection("messages").add({from:"coachee",sender:uid,recipient,file:fileData,text:"",time:t,date:d,ts:Date.now()});
    } catch(e) { console.error("sendFile error:", e); }
  };

  const deleteMsg = async msgId => {
    if(!uid||!fbDb) return;
    try { await fbDb.collection("chats").doc(uid).collection("messages").doc(msgId).delete(); } catch(e){}
  };

  return html`
    <div style=${{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0,background:"var(--bg)"}}>
      <${ChatWindow} coachee=${coacheeWithMsgs} recipient=${recipient} setRecipient=${setRecipient} onSend=${sendMsg} onSendImg=${sendImg} onSendFile=${sendFile} onDeleteMsg=${deleteMsg} onBack=${()=>setMobileChatOpen&&setMobileChatOpen(false)}/>
    </div>`;
}

function ChatWindow({coachee,recipient,setRecipient,onSend,onSendImg,onSendFile,onDeleteMsg,onUpdate,onBack}) {
  const [input,setInput]         = useState("");
  const [lightbox,setLightbox]   = useState(null);
  const [videoLightbox,setVideoLightbox] = useState(null);
  const [recording,setRecording]   = useState(false);
  const [fileViewer,setFileViewer]   = useState(null);
  const [showCamMenu,setShowCamMenu] = useState(false);
  const [msgMenu,setMsgMenu]       = useState(null); // {id, x, y}
  const bottomRef  = useRef(null);
  const textRef    = useRef(null);
  const chatImgRef = useRef(null);
  const attachRef  = useRef(null);
  const mediaRecRef = useRef(null);
  const chunksRef  = useRef([]);
  const longPressRef = useRef(null);

  const startLongPress = (msg, e) => {
    if(msg.from !== "coachee") return;
    const touch = e.touches?.[0] || e;
    const x = touch.clientX; const y = touch.clientY;
    longPressRef.current = setTimeout(() => {
      setMsgMenu({id: msg.id, x, y});
      if(navigator.vibrate) navigator.vibrate(30);
    }, 500);
  };
  const cancelLongPress = () => { if(longPressRef.current) clearTimeout(longPressRef.current); };

  const handleDeleteMsg = async () => {
    if(!msgMenu) return;
    const id = msgMenu.id;
    setMsgMenu(null);
    if(onDeleteMsg) await onDeleteMsg(id);
  };

  // Beim ersten Öffnen des Chats sofort (ohne Animation) ans Ende springen — "smooth" allein
  // konnte bei langen, noch rendernden Listen abgebrochen wirken und der Coachee landete
  // mitten in der Historie statt bei der neuesten Nachricht. Bei späteren neuen Nachrichten
  // bleibt das weiche Scrollen erhalten (passt besser zu einer aktiven Konversation).
  // Fix (10.08.2026, Rico-Meldung "scrollt nicht bis zur aktuellsten Nachricht"): scrollIntoView()
  // direkt im Effect racet gegen das beim Mount noch nicht final berechnete Layout (variable
  // Bubble-Höhen, Sender-Avatare, Bilder) — identisches Pitfall-Muster wie beim Mediathek-Deep-
  // Link-Scroll (Fix 01.08.2026). Kurze Verzögerung lässt das Layout zuerst fertig berechnen.
  // Fix (11.08.2026, Rico-Meldung "scrollt nicht runter wenn Chat gewechselt wird"): nur auf
  // coachee.messages.length zu reagieren reicht nicht — beim Umschalten zwischen Diana/Rico
  // kann die gefilterte Nachrichtenanzahl zufällig gleich bleiben, dann feuerte der Effekt gar
  // nicht. recipient zusätzlich als Trigger, plus lastRecipientRef statt globalem Einmal-Flag,
  // damit jeder Tab-Wechsel wieder wie ein "erstes Öffnen" (sofortiger Sprung) behandelt wird.
  const isFirstScrollRef = useRef(true);
  const lastRecipientRef = useRef(recipient);
  useEffect(()=>{
    const isNewContext = isFirstScrollRef.current || lastRecipientRef.current !== recipient;
    const t = setTimeout(() => {
      bottomRef.current?.scrollIntoView({behavior: isNewContext ? "auto" : "smooth", block:"end"});
      isFirstScrollRef.current = false;
      lastRecipientRef.current = recipient;
    }, 60);
    return () => clearTimeout(t);
  },[coachee.messages.length, recipient]);

  const groups = coachee.messages.reduce((acc,msg)=>{
    const key = msg.ts ? dateKeyFromTs(msg.ts) : dateKeyFromTs(Date.now());
    if(!acc[key])acc[key]=[];
    acc[key].push(msg);
    return acc;
  },{});
  const groupsSorted = Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0]));

  const handleSend = () => {
    if(!input.trim())return;
    onSend(input);
    setInput("");
    if(textRef.current){ textRef.current.style.height='auto'; textRef.current.style.overflowY='hidden'; }
  };
  const handleKey  = e => { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleSend();} };

  const handleChatImg = async e => {
    const files = e.target.files; if(!files||!files[0])return;
    for(let i=0;i<files.length;i++){
      const f=files[i];
      if(f.type.startsWith("video/")) {
        // For video: store blob URL directly (iOS can play blob URLs)
        const blobUrl = URL.createObjectURL(f);
        onSendImg(blobUrl, true);
      } else {
        onSendImg(await readFile(f), false);
      }
    }
    setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),50);
  };

  const handleAttach = async e => {
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{ onSendFile({url:ev.target.result,name:f.name,type:f.type,size:f.size,isAudio:false}); };
    r.readAsDataURL(f); e.target.value="";
  };

  const startRecording = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      // MIME-Type vom Browser bestimmen lassen (iOS: audio/mp4, Android: audio/webm)
      const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
                     : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
                     : '';
      const mrOpts = mimeType ? {mimeType} : {};
      const mr = new MediaRecorder(stream, mrOpts);
      mediaRecRef.current = mr; chunksRef.current = [];
      mr.ondataavailable = ev => chunksRef.current.push(ev.data);
      mr.onstop = () => {
        const mime = mr.mimeType || mimeType || 'audio/mp4';
        const ext  = mime.includes('webm') ? 'webm' : 'm4a';
        const blob = new Blob(chunksRef.current, {type: mime});
        const rdr = new FileReader();
        rdr.onload = ev2 => {
          onSendFile({url:ev2.target.result, name:'Sprachmemo.'+ext, type:mime, isAudio:true});
        };
        rdr.readAsDataURL(blob);
        stream.getTracks().forEach(t=>t.stop());
      };
      mr.start(); setRecording(true);
    } catch(err) { alert("Mikrofon-Zugriff nicht möglich."); }
  };

  const stopRecording = () => {
    if(mediaRecRef.current&&recording){ mediaRecRef.current.stop(); setRecording(false); }
  };

  const openFile = file => {
    try {
      const arr=file.url.split(","); const mime=arr[0].match(/:(.*?);/)[1];
      const bstr=atob(arr[1]); let n=bstr.length; const u8=new Uint8Array(n);
      while(n--)u8[n]=bstr.charCodeAt(n);
      const blob=new Blob([u8],{type:mime});
      const blobUrl=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=blobUrl; a.target="_blank"; a.rel="noopener";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(blobUrl),30000);
    } catch(e){ window.open(file.url,"_blank"); }
  };

  return html`
    <div class="chat-area">
      <div class="chat-topbar" style=${{flexDirection:"column",alignItems:"stretch",height:"auto",paddingTop:"max(52px, calc(env(safe-area-inset-top, 0px) + 44px))",paddingLeft:"14px",paddingRight:"14px",paddingBottom:"10px",gap:8}}>
        <div style=${{display:"flex",alignItems:"center",gap:10}}>
        <div>
          <div class="ct-name" style=${{fontSize:"1.05rem",letterSpacing:"-.2px"}}>${recipient} Stämpfli</div>
          <div class="ct-status" style=${{display:"flex",alignItems:"center",gap:5}}>
            <span class="status-dot"/>
            <span>Online · Dein Coaching-Team</span>
          </div>
        </div>
        </div>
        <div style=${{display:"flex",gap:8,width:"100%"}}>
          ${["Diana","Rico"].map(name=>h("button",{
            key:name,
            onClick:()=>setRecipient(name),
            style:{flex:"1 1 0",height:"40px",maxHeight:"40px",display:"flex",alignItems:"center",
              justifyContent:"center",gap:"7px",padding:"8px 18px",
              border:"1.5px solid "+(recipient===name?(name==="Rico"?"#3b6d11":"#1d5a8f"):"var(--border2)"),
              borderRadius:"10px",
              background:recipient===name?(name==="Rico"?"#e9f3dd":"#e0f5ee"):"transparent",
              color:recipient===name?(name==="Rico"?"#3b6d11":"#1d5a8f"):"var(--muted)",
              fontFamily:"'Exo 2',sans-serif",fontSize:".83rem",fontWeight:700,
              cursor:"pointer",transition:"all .18s"}
          }, h(Ic,{name:"user",size:15}), " "+name))}
        </div>
      </div>

      <div class="messages">
        ${groupsSorted.map(([date,msgs])=>html`
          <div key=${date}>
            <div class="date-divider">${formatDateKey(date)}</div>
            ${msgs.map((msg,i)=>{
              const isOut = msg.from==="admin";
              const sender = msg.sender||"Diana";
              const prevSame = i>0&&msgs[i-1].from===msg.from&&(msgs[i-1].sender||"Diana")===sender;
              const avatarColor = sender==="Rico" ? "#3b6d11" : "#1d5a8f";
              const bubbleBg = sender==="Rico" ? "#e9f3dd" : "#e0f5ee";
              const senderClass = isOut ? (sender==="Rico"?" sender-rico":" sender-diana") : "";
              return html`
                <div key=${msg.id} class=${"msg-row "+(isOut?"out":"in")+senderClass}
                  style=${{marginBottom:prevSame?1:8,alignItems:"flex-end",userSelect:"none"}}
                  onTouchStart=${e=>startLongPress(msg,e)}
                  onTouchEnd=${cancelLongPress}
                  onTouchMove=${cancelLongPress}
                  onMouseDown=${e=>startLongPress(msg,e)}
                  onMouseUp=${cancelLongPress}
                  onMouseLeave=${cancelLongPress}>
                  <div class="msg-bubble-wrap">
                    ${isOut&&!prevSame&&html`<div style=${{fontSize:".67rem",fontWeight:700,
                      color:avatarColor,marginBottom:2,marginLeft:2}}>${sender}</div>`}
                    <div class="msg-bubble" style=${isOut?{background:bubbleBg,color:avatarColor}:{}}>
                      ${msg.imgSrc&&!msg.isVideo&&html`<div class="msg-img-wrap"><img src=${msg.imgSrc} class="msg-img" alt="Foto" onClick=${()=>setLightbox(msg.imgSrc)}/></div>`}
                      ${msg.imgSrc&&msg.isVideo&&html`<div class="msg-img-wrap">
                        <div onClick=${()=>setVideoLightbox(msg.imgSrc)}
                          style=${{width:220,borderRadius:12,overflow:"hidden",background:"var(--forest)",
                            cursor:"pointer",display:"flex",alignItems:"center",gap:10,padding:"10px 12px"}}>
                          <div style=${{width:44,height:44,borderRadius:8,background:"rgba(255,255,255,.12)",
                            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7">
                              <polygon points="23 7 16 12 23 17 23 7"/>
                              <rect x="1" y="5" width="15" height="14" rx="2"/>
                            </svg>
                          </div>
                          <div style=${{flex:1,minWidth:0}}>
                            <div style=${{fontSize:".82rem",fontWeight:700,color:"white"}}>Video</div>
                            <div style=${{fontSize:".72rem",color:"rgba(255,255,255,.55)"}}>Tippen zum Abspielen</div>
                          </div>
                          <div style=${{width:30,height:30,borderRadius:"50%",background:"rgba(255,255,255,.15)",
                            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="white" stroke="none">
                              <polygon points="6,3 20,12 6,21"/>
                            </svg>
                          </div>
                        </div>
                      </div>`}
                      ${msg.file&&msg.file.isAudio&&html`
                        <div style=${{padding:"2px 0"}}>
                          <audio controls=${true} src=${msg.file.url}
                            style=${{height:34,maxWidth:220,borderRadius:20,display:"block"}}></audio>
                          <div style=${{fontSize:".68rem",opacity:.6,marginTop:3}}>Sprachmemo</div>
                        </div>`}
                      ${msg.file&&!msg.file.isAudio&&html`
                        <div onClick=${()=>openFile(msg.file)}
                          style=${{display:"flex",alignItems:"center",gap:8,cursor:"pointer",
                            padding:"6px 10px",background:"rgba(255,255,255,.15)",borderRadius:8,minWidth:160}}>
                          <${Ic} name="file" size=${20} style=${{flexShrink:0,opacity:.8}}/>
                          <div style=${{minWidth:0}}>
                            <div style=${{fontSize:".8rem",fontWeight:700,overflow:"hidden",
                              textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:160}}>${msg.file.name}</div>
                            <div style=${{fontSize:".68rem",opacity:.7}}>${(msg.file.type||"").split("/")[1]?.toUpperCase()||"Datei"}</div>
                          </div>
                          <${Ic} name="chevron" size=${14} style=${{flexShrink:0,opacity:.6}}/>
                        </div>`}
                      ${msg.text&&html`<span>${msg.text}</span>`}
                    </div>
                    <div class="msg-meta" style=${{justifyContent:isOut?"flex-end":"flex-start"}}>
                      <span class="msg-time-small">${msg.time}</span>
                      ${!isOut&&msg.seen&&html`<span style=${{color:"var(--teal)",fontSize:".65rem"}}>✓✓</span>`}
                    </div>
                  </div>
                </div>`;
            })}
          </div>`)}
        <div ref=${bottomRef}/>
      </div>

      <div class="chat-input-area">
        <input ref=${chatImgRef} type="file" accept="image/*,video/*" capture="environment"
          style=${{display:"none"}} onChange=${handleChatImg}/>
        <input id="lib-pick" type="file" accept="image/*,video/*"
          style=${{display:"none"}} onChange=${handleChatImg}/>
        <input ref=${attachRef} type="file"
          accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,application/*"
          style=${{display:"none"}} onChange=${handleAttach}/>
        <button class="attach-btn" onClick=${()=>setShowCamMenu(true)}><${Ic} name="camera" size=${18}/></button>
        <button class="attach-btn" onClick=${()=>attachRef.current?.click()}><${Ic} name="attach" size=${18}/></button>
        <button class="attach-btn"
          onClick=${recording?stopRecording:startRecording}
          style=${{color:recording?"#e53e3e":"var(--muted)",position:"relative"}}>
          <${Ic} name=${recording?"stop":"mic"} size=${18}/>
          ${recording&&html`<span style=${{position:"absolute",top:1,right:1,width:7,height:7,
            borderRadius:"50%",background:"#e53e3e",border:"2px solid var(--surface)"}}/>`}
        </button>
        <textarea ref=${textRef} class="input-box" rows=${1} value=${input}
          onInput=${e=>{
            setInput(e.target.value);
            const el=e.target;
            el.style.height='auto';
            el.style.height=Math.min(el.scrollHeight,130)+'px';
            el.style.overflowY=el.scrollHeight>130?'auto':'hidden';
          }} onKeyDown=${handleKey}
          onFocus=${()=>{
            setTimeout(()=>{
              if(textRef.current) textRef.current.scrollIntoView({block:"nearest",behavior:"smooth"});
              if(bottomRef.current) bottomRef.current.scrollIntoView({behavior:"smooth"});
            },350);
          }}
          autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"
          placeholder=${"Nachricht an "+recipient+"…"}/>
        <button class="send-btn" onClick=${handleSend} disabled=${!input.trim()}><${Ic} name="send" size=${17}/></button>
      </div>

      ${msgMenu&&html`
        <div style=${{position:"fixed",inset:0,zIndex:99996,background:"rgba(0,0,0,.25)"}}
          onClick=${()=>setMsgMenu(null)}>
          <div style=${{
            position:"fixed",
            left:Math.min(msgMenu?.x||0, window.innerWidth-160)+'px',
            top:Math.max((msgMenu?.y||0)-90,60)+'px',
            background:"var(--surface)",
            borderRadius:12,
            boxShadow:"0 4px 24px rgba(0,0,0,.18)",
            overflow:"hidden",
            minWidth:140,
            zIndex:99997
          }} onClick=${e=>e.stopPropagation()}>
            <button onClick=${handleDeleteMsg}
              style=${{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"13px 16px",
                border:"none",background:"none",cursor:"pointer",color:"var(--danger)",
                fontSize:".88rem",fontWeight:600,fontFamily:"'Exo 2',sans-serif"}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
              </svg>
              Nachricht löschen
            </button>
          </div>
        </div>`}

      ${showCamMenu&&html`
        <div style=${{position:"fixed",inset:0,zIndex:99998,background:"rgba(0,0,0,.4)"}}
          onClick=${()=>setShowCamMenu(false)}>
          <div style=${{position:"fixed",bottom:0,left:0,right:0,background:"var(--surface)",
            borderRadius:"16px 16px 0 0",padding:"8px 0 32px",boxShadow:"0 -4px 24px rgba(0,0,0,.15)"}}
            onClick=${e=>e.stopPropagation()}>
            <div style=${{width:36,height:4,borderRadius:2,background:"var(--border)",margin:"0 auto 16px"}}/>
            ${[
              {label:"Foto oder Video aufnehmen", action:()=>{setShowCamMenu(false);chatImgRef.current?.click();},
                icon:html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>`},
              {label:"Aus Fotomediathek wählen", action:()=>{setShowCamMenu(false);document.getElementById("lib-pick")?.click();},
                icon:html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`},
            ].map((item,i)=>html`
              <div key=${i} onClick=${item.action}
                style=${{display:"flex",alignItems:"center",gap:14,padding:"13px 22px",

                <span style=${{fontSize:".95rem",color:"var(--text)"}}>${item.label}</span>

      ${lightbox&&html`
        <div class="lightbox" onClick=${e=>{if(e.target===e.currentTarget)setLightbox(null);}}>
          <div style=${{position:"relative",display:"inline-block"}}>
            <button onClick=${()=>setLightbox(null)}
              style=${{position:"absolute",top:-14,right:-14,width:32,height:32,
                borderRadius:"50%",background:"white",border:"none",cursor:"pointer",
                display:"flex",alignItems:"center",justifyContent:"center",
                boxShadow:"0 2px 8px rgba(0,0,0,.3)",zIndex:1,color:"var(--text)"}}>
              <${Ic} name="x" size=${16}/>
            </button>

              style=${{maxWidth:"85vw",maxHeight:"75vh",borderRadius:12,display:"block"}}/>

          onClick=${e=>{if(e.target===e.currentTarget)setVideoLightbox(null);}}>
          <div style=${{position:"relative",maxWidth:"95vw",maxHeight:"90vh"}}>
            <button onClick=${()=>setVideoLightbox(null)}
              style=${{position:"absolute",top:-14,right:-14,width:32,height:32,
                borderRadius:"50%",background:"white",border:"none",cursor:"pointer",

                  justifyContent:"center",flexShrink:0}}>

                </svg>

}


function SettingsPage({user, onDeleted}) {
  const [deleteWord, setDeleteWord] = useState("");
  const [deleting, setDeleting] = useState(false);
  const [step, setStep] = useState(0); // 0=info, 1=bestaetigen

  const doDelete = async () => {
    if(deleteWord.trim().toLowerCase() !== "löschen") return;
    setDeleting(true);
    const fbDb = window._fb?.db;
    const fbAuth = window._fb?.auth;
    try {
      if(fbDb && user?.uid) {
        const uid = user.uid;
        const name = user.displayName || user.email || uid;
        const email = user.email || "";
        // Vor Löschung: users_deleted Dokument anlegen (für Admin sichtbar)
        await fbDb.collection("users_deleted").doc(uid).set({
          uid, name, email,
          deletedAt: new Date().toISOString(),
          deletedBy: "coachee"
        });
        // Daten löschen
        await fbDb.collection("users").doc(uid).delete().catch(()=>{});
      }
      // Firebase Auth User löschen
      if(fbAuth?.currentUser) {
        await fbAuth.currentUser.delete().catch(()=>{});
      }
      if(onDeleted) onDeleted();
    } catch(e) {
      setDeleting(false);
      setDeleteWord("");
      alert("Fehler beim Löschen. Bitte kontaktiere info@selbstwirksamkeit.ch");
    }
  };

  if(step === 0) return html`
    <div class="content-main" style=${{maxWidth:480,margin:"0 auto",padding:"32px 20px"}}>
      <div style=${{fontFamily:"'Manuale',serif",fontSize:"1.2rem",fontWeight:700,color:"var(--text)",marginBottom:20}}>Einstellungen</div>

      <div style=${{background:"var(--surface)",borderRadius:14,border:"0.5px solid var(--border)",padding:"16px 18px",marginBottom:16}}>
        <div style=${{fontWeight:600,color:"var(--text)",fontSize:".9rem",marginBottom:4}}>Dein Konto</div>
        <div style=${{color:"var(--muted)",fontSize:".82rem"}}>${user?.email||""}</div>
      </div>

      <div style=${{background:"var(--surface)",borderRadius:14,border:"0.5px solid var(--border)",padding:"16px 18px",marginBottom:16}}>
        <div style=${{fontWeight:600,color:"var(--text)",fontSize:".9rem",marginBottom:6}}>Datenschutz & Aufbewahrung</div>
        <div style=${{color:"var(--muted)",fontSize:".82rem",lineHeight:1.65}}>
          Solange du die App nutzt, bleiben deine Daten erhalten. Nach 24 Monaten ohne Anmeldung erhältst du eine E-Mail-Ankündigung und deine Daten werden nach weiteren 30 Tagen gelöscht — ausser du meldest dich zurück.<br/><br/>
          Für Fragen zum Datenschutz: info@selbstwirksamkeit.ch
        </div>
      </div>

      <div style=${{background:"var(--danger-pale)",borderRadius:14,border:"0.5px solid var(--danger-border)",padding:"16px 18px"}}>
        <div style=${{fontWeight:600,color:"var(--danger)",fontSize:".9rem",marginBottom:6}}>Konto löschen</div>
        <div style=${{color:"var(--muted)",fontSize:".82rem",lineHeight:1.65,marginBottom:14}}>
          Alle deine Daten (Chat, Impulse, Profil) werden unwiderruflich gelöscht. Diese Aktion kann nicht rückgängig gemacht werden.
        </div>
        <button onClick=${()=>setStep(1)} style=${{background:"var(--danger)",color:"#fff",border:"none",borderRadius:9,padding:"9px 20px",fontSize:".82rem",fontWeight:600,cursor:"pointer",fontFamily:"'Exo 2',sans-serif"}}>
          Konto löschen
        </button>
      </div>
    </div>`;

  return html`
    <div class="content-main" style=${{maxWidth:480,margin:"0 auto",padding:"32px 20px"}}>
      <div style=${{fontFamily:"'Manuale',serif",fontSize:"1.2rem",fontWeight:700,color:"var(--text)",marginBottom:8}}>Konto wirklich löschen?</div>
      <div style=${{color:"var(--muted)",fontSize:".85rem",lineHeight:1.6,marginBottom:24}}>
        Alle Daten werden unwiderruflich entfernt. Tippe <strong>löschen</strong> zur Bestätigung.
      </div>
      <input
        value=${deleteWord}
        onInput=${e=>setDeleteWord(e.target.value)}
        placeholder="löschen"
        style=${{width:"100%",boxSizing:"border-box",padding:"11px 14px",borderRadius:9,border:"1.5px solid var(--danger-border)",background:"var(--bg)",color:"var(--text)",fontSize:".9rem",fontFamily:"'Exo 2',sans-serif",outline:"none",marginBottom:14}}
      />
      <div style=${{display:"flex",gap:10}}>
        <button onClick=${()=>{setStep(0);setDeleteWord("");}} style=${{flex:1,padding:"11px 0",borderRadius:9,border:"1.5px solid var(--border2)",background:"none",color:"var(--muted)",fontSize:".85rem",cursor:"pointer",fontFamily:"'Exo 2',sans-serif"}}>
          Abbrechen
        </button>
        <button onClick=${doDelete} disabled=${deleteWord.trim().toLowerCase()!=="löschen"||deleting}
          style=${{flex:1,padding:"11px 0",borderRadius:9,border:"none",background:deleteWord.trim().toLowerCase()==="löschen"?"var(--danger)":"var(--border)",color:"#fff",fontSize:".85rem",fontWeight:700,cursor:deleteWord.trim().toLowerCase()==="löschen"?"pointer":"not-allowed",fontFamily:"'Exo 2',sans-serif",transition:"background .2s"}}>
          ${deleting?"Wird gelöscht…":"Endgültig löschen"}
        </button>
      </div>

function ImpulseTab({ user, reminders, setReminders, setPage, defaultSubTab, setDefaultSubTab, setActiveImpuls, activeImpuls, pendingReminderId, setPendingReminderId, pendingImpulsPopup, setPendingImpulsPopup, pendingReflexionPopup, setPendingReflexionPopup }) {

  // Fix: War die Impulse-Seite beim Push-Tap schon offen (App im Hintergrund, nicht
  // komplett geschlossen), bleibt ImpulseTab als Komponente bestehen — der useState-
  // Initialwert oben greift dann NICHT mehr, da er nur beim allerersten Mount zieht.

  // defaultSubTab (impulseDefaultTab) bereits korrekt aktualisiert hat — Popup und Inhalt
  // der Zielseite (z.B. Tages-Impuls) werden dadurch nie gerendert.
  useEffect(() => {

// ── PORTAL ──
// Fund (31.07.2026): Der Tages-Impuls-Push-Popup (ImpulsPushPopup) erschien nach dem
// morgendlichen Atemball nicht mehr, obwohl der State (showPushPopup) korrekt gesetzt
// wurde. Root Cause: ImpulsPushPopup ist ein position:fixed;inset:0-Overlay, wird aber
// INNERHALB von #app gerendert — #app hat overflow:hidden. Exakt derselbe bereits
// bekannte Pitfall, der den Atemball ursprünglich zu #breath-portal ausserhalb von #app
// zwang: position:fixed-Elemente innerhalb eines overflow:hidden-Vorfahren können auf
// bestimmten iOS-Safari-Konfigurationen geclippt/nicht dargestellt werden — insbesondere
// nachdem kurz zuvor ein anderes vollflächiges Fixed-Overlay (der Atemball) die dynamische
// Viewport-Höhe (100dvh) neu hat berechnen lassen.
// Fix: generischer, manueller Portal (kein preact/compat verfügbar, daher kein
// createPortal) — rendert seine Kinder über einen zweiten, unabhängigen render()-Aufruf
// in #overlay-portal, einen Geschwister-Div von #app, analog zum bestehenden
// #breath-portal-Muster. Wiederverwendbar für alle künftigen Fixed-Overlays mit
// demselben Problem (z.B. ImpulsReflexionPopup, ReminderPopup).
function Portal({ children }) {
  const containerRef = useRef(null);
  if (!containerRef.current) containerRef.current = document.createElement('div');

  useEffect(() => {
    const root = document.getElementById('overlay-portal');
    if (root) root.appendChild(containerRef.current);
    return () => {
      render(null, containerRef.current);
      if (root && containerRef.current.parentNode === root) root.removeChild(containerRef.current);
    };
  }, []);

  useEffect(() => {
    render(children, containerRef.current);
  });

  return null;
}

function ImpulsPage({ user, setPage, setActiveImpuls, activeImpuls, pendingImpulsPopup, setPendingImpulsPopup, pendingReflexionPopup, setPendingReflexionPopup }) {
  const [step, setStep]           = useState(0);
  // NEU (06.08.2026): welcomePhase hält die Phase, für die gerade der Willkommens-Screen
  // (step===7) angezeigt wird — unabhängig vom später geladenen Tagesimpuls.
  const [welcomePhase, setWelcomePhase] = useState(null);
  // NEU (06.08.2026): activePhaseNum wird für den Workbook-Seitenhinweis beim Tagesimpuls
  // benötigt — Fallback auf die Phasen-Seitenspanne (PHASE_INFO), falls ein einzelner
  // Impuls keine eigene "page"-Angabe in der Bibliothek hat.
  const [activePhaseNum, setActivePhaseNum] = useState(1);
  // NEU (12.08.2026): zählt abgeschlossene vs. gesamte Impulse der aktuell aktiven Phase
  // (aus settings/impulse_library) — Grundlage für die Pause-Logik in saveAndFinish():
  // nach dem letzten Impuls der Phase wird kein neuer nextImpulseAt mehr gesetzt, die Phase
  // pausiert bis Diana/Rico manuell die nächste Phase setzen (onActivePhaseChanged).
  const [phaseImpulseCount, setPhaseImpulseCount] = useState({done:0, total:0});
  const [reflexion, setReflexion] = useState("");
  // Fix (02.07.2026, Kapitel 32): Multi-Select statt Single-Select — koerper ist jetzt ein
  // Array statt ein einzelner String, damit mehrere Körperregionen gleichzeitig gewählt
  // werden können (z.B. "Herz" und "Bauch"). Wichtig für später: Bestehende Firestore-
  // Einträge vor diesem Fix haben koerper als einzelnen String, neue Einträge als Array —
  // eine künftige Reflexion-Anzeige muss beide Formate abfangen können.
  const [koerper, setKoerper]     = useState([]);
  const toggleKoerper = (opt) => setKoerper(prev => prev.includes(opt) ? prev.filter(k => k !== opt) : [...prev, opt]);
  const [impuls, setImpuls]       = useState(null);
  const [saving, setSaving]       = useState(false);
  const [activeEntryRef, setActiveEntryRef] = useState(null);
  // Fix (10.08.2026, Pitfall 69 "Willkommensnachricht verschwindet bei zeitgleichem
  // eigenem Impuls"): Der untenstehende Mount-Effect hängt auch von activeImpuls ab
  // (siehe Kommentar dort) und lief bisher bei jeder Änderung dieser Prop komplett neu
  // durch — inklusive des Willkommens-Checks. Da dieser Check beim ERSTEN Treffer sofort
  // localStorage (phaseWelcomeSeen_) aktualisiert, wurde bei einem zweiten Durchlauf (z.B.
  // weil DashboardPage kurz vor dem Wegnavigieren noch einen eigenen, bereits aktiven
  // Tagesimpuls aus Firestore nachlieferte) die Bedingung nicht mehr erfüllt — der Screen
  // verschwand kommentarlos und war wegen des bereits gesetzten Flags für diese Phase
  // endgültig verloren. Dieser Ref hält fest, dass in diesem Mount bereits Willkommen
  // gezeigt wurde, und blockt jeden weiteren Durchlauf dieses Effects hart ab.
  const welcomeShownRef = useRef(false);
  const [showPushPopup, setShowPushPopup]   = useState(false);
  const [showReflexionPopup, setShowReflexionPopup] = useState(false);
  // "Später" darf nur beim allerersten Push-Popup erscheinen, nicht mehr bei dessen
  // eigenem 1h-später-Reminder-Popup (sonst könnte man sich beliebig oft weiter vertagen).
  const [popupIsSnoozed, setPopupIsSnoozed] = useState(false);

  // Fix (02.07.2026, Kapitel 32): "Kehle" raus (redundant zu "Hals"), "Hals", "Rücken" und
  // "Ganzer Körper" dazu — vollständigere Körperliste für die Reflexion.
  const KOERPER_OPTS = ["Kopf","Hals","Herz","Brust","Bauch","Rücken","Schultern","Arme","Beine","Ganzer Körper"];

  // Push-Deep-Link (#impulse-tages): Popup nur zeigen, wenn wirklich ein frischer,
  // noch nicht entschiedener Tages-Impuls vorliegt (step===0). Analog zum Reminder-Popup
  // NICHT sofort auf pendingImpulsPopup reagieren, sondern erst wenn impuls geladen ist —
  // sonst würde die Entscheidung anhand des Platzhalter-Zustands (impuls noch null) beim
  // Kaltstart über Push-Tap fälschlich getroffen, bevor die echten Firestore-Daten da sind.
  useEffect(() => {
